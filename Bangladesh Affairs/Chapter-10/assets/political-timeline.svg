<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Political development of Bangladesh</title><desc id="desc">A thematic timeline of major phases in Bangladesh's political development.</desc>
<defs><style>.bg{fill:#f7f8fa}.title{font:700 40px Arial,sans-serif;fill:#172b3a}.sub{font:22px Arial,sans-serif;fill:#52616b}.card{fill:#fff;stroke:#52616b;stroke-width:2.5;rx:20}.year{font:700 25px Arial,sans-serif;fill:#172b3a}.bn{font:22px 'Noto Sans Bengali',Arial,sans-serif;fill:#243746}.sm{font:18px Arial,sans-serif;fill:#52616b}.line{stroke:#52616b;stroke-width:4;fill:none}</style></defs>
<rect class="bg" width="1600" height="900"/><text class="title" x="800" y="65" text-anchor="middle">BANGLADESH: POLITICAL DEVELOPMENT</text><text class="sub" x="800" y="105" text-anchor="middle">Read as changing institutions and participation—not only as dates</text>
<path class="line" d="M170 250H1430 M170 250V290 M380 250V290 M590 250V290 M800 250V290 M1010 250V290 M1220 250V290 M1430 250V290"/>
<rect class="card" x="55" y="290" width="230" height="220"/><text class="year" x="170" y="335" text-anchor="middle">1947–1970</text><text class="bn" x="170" y="380" text-anchor="middle">ভাষা ও স্বায়ত্তশাসন</text><text class="sm" x="170" y="425" text-anchor="middle">Representation</text><text class="sm" x="170" y="455" text-anchor="middle">Mass mobilisation</text>
<rect class="card" x="265" y="290" width="230" height="220"/><text class="year" x="380" y="335" text-anchor="middle">1971–1975</text><text class="bn" x="380" y="380" text-anchor="middle">মুক্তিযুদ্ধ ও রাষ্ট্রগঠন</text><text class="sm" x="380" y="425" text-anchor="middle">Independence</text><text class="sm" x="380" y="455" text-anchor="middle">Constitution</text>
<rect class="card" x="475" y="290" width="230" height="220"/><text class="year" x="590" y="335" text-anchor="middle">1975–1990</text><text class="bn" x="590" y="380" text-anchor="middle">শাসন ও দল পুনর্গঠন</text><text class="sm" x="590" y="425" text-anchor="middle">Military rule</text><text class="sm" x="590" y="455" text-anchor="middle">Democracy movement</text>
<rect class="card" x="685" y="290" width="230" height="220"/><text class="year" x="800" y="335" text-anchor="middle">1991–2006</text><text class="bn" x="800" y="380" text-anchor="middle">সংসদীয় প্রতিযোগিতা</text><text class="sm" x="800" y="425" text-anchor="middle">Party rivalry</text><text class="sm" x="800" y="455" text-anchor="middle">Election trust</text>
<rect class="card" x="895" y="290" width="230" height="220"/><text class="year" x="1010" y="335" text-anchor="middle">2007–2024</text><text class="bn" x="1010" y="380" text-anchor="middle">প্রতিষ্ঠান ও মেরুকরণ</text><text class="sm" x="1010" y="425" text-anchor="middle">Election debates</text><text class="sm" x="1010" y="455" text-anchor="middle">Accountability</text>
<rect class="card" x="1105" y="290" width="230" height="220"/><text class="year" x="1220" y="335" text-anchor="middle">2024–2026</text><text class="bn" x="1220" y="380" text-anchor="middle">রূপান্তর ও সংস্কার</text><text class="sm" x="1220" y="425" text-anchor="middle">Participation</text><text class="sm" x="1220" y="455" text-anchor="middle">Institutional renewal</text>
<rect class="card" x="1315" y="290" width="230" height="220"/><text class="year" x="1430" y="335" text-anchor="middle">Across periods</text><text class="bn" x="1430" y="380" text-anchor="middle">নাগরিকের ভূমিকা</text><text class="sm" x="1430" y="425" text-anchor="middle">Rights • voice</text><text class="sm" x="1430" y="455" text-anchor="middle">Public accountability</text>
<rect x="200" y="590" width="1200" height="140" rx="24" fill="#e8eef2" stroke="#52616b" stroke-width="2.5"/><text class="year" x="800" y="635" text-anchor="middle">Historical analysis formula</text><text class="bn" x="800" y="680" text-anchor="middle">দলীয় প্রতিযোগিতা + সাংবিধানিক নিয়ম + নাগরিক অংশগ্রহণ + জবাবদিহি</text>
<text class="sm" x="800" y="785" text-anchor="middle">Use official legal texts and reliable historical sources for dates and constitutional changes.</text>
</svg>