<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" rx="24" fill="#f8fafc"/><text x="550" y="50" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#102a43">Political Party Registration — Study Flow</text><g font-family="Arial" text-anchor="middle"><rect x="325" y="90" width="450" height="70" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="550" y="120" font-size="21" font-weight="700" fill="#1e3a8a">Party prepares its constitution &amp; records</text><text x="550" y="143" font-size="15" fill="#1e3a8a">Membership · organisation · internal rules</text><path d="M550 160 V195" stroke="#475569" stroke-width="3"/><path d="M538 183 L550 200 L562 183" stroke="#475569" stroke-width="3" fill="none"/><rect x="325" y="205" width="450" height="75" rx="15" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="550" y="235" font-size="21" font-weight="700" fill="#78350f">Check RPO eligibility &amp; legal requirements</text><text x="550" y="259" font-size="15" fill="#78350f">Current amended Articles 90A–90H</text><path d="M550 280 V315" stroke="#475569" stroke-width="3"/><path d="M538 303 L550 320 L562 303" stroke="#475569" stroke-width="3" fill="none"/><rect x="325" y="325" width="450" height="70" rx="15" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="550" y="355" font-size="21" font-weight="700" fill="#581c87">Submit application to Election Commission</text><text x="550" y="378" font-size="15" fill="#581c87">Required documents and signatures</text><path d="M550 395 V430" stroke="#475569" stroke-width="3"/><path d="M538 418 L550 435 L562 418" stroke="#475569" stroke-width="3" fill="none"/><rect x="325" y="440" width="450" height="70" rx="15" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="550" y="470" font-size="21" font-weight="700" fill="#14532d">Commission scrutinises application</text><text x="550" y="493" font-size="15" fill="#14532d">Decision depends on current law and evidence</text><path d="M550 510 V540" stroke="#475569" stroke-width="3"/><path d="M538 528 L550 545 L562 528" stroke="#475569" stroke-width="3" fill="none"/><rect x="355" y="550" width="390" height="45" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="550" y="578" font-size="18" font-weight="700" fill="#0c4a6e">Registration decision / lawful refusal</text></g><text x="550" y="610" text-anchor="middle" font-family="Arial" font-size="12" fill="#52606d">Conceptual summary only; not a substitute for the latest RPO text or EC rules.</text></svg>