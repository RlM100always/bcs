<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Internal party democracy</title><desc id="desc">Six connected steps for meaningful internal party democracy.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#52616b"/></marker><style>.bg{fill:#f7f8fa}.title{font:700 40px Arial,sans-serif;fill:#172b3a}.sub{font:22px Arial,sans-serif;fill:#52616b}.card{fill:#fff;stroke:#52616b;stroke-width:2.5;rx:22}.n{font:700 25px Arial,sans-serif;fill:#172b3a}.bn{font:22px 'Noto Sans Bengali',Arial,sans-serif;fill:#243746}.sm{font:18px Arial,sans-serif;fill:#52616b}.line{stroke:#52616b;stroke-width:3.5;fill:none;marker-end:url(#a)}</style></defs>
<rect class="bg" width="1600" height="900"/><text class="title" x="800" y="65" text-anchor="middle">INTERNAL PARTY DEMOCRACY</text><text class="sub" x="800" y="105" text-anchor="middle">Member participation should influence real decisions</text>
<path class="line" d="M500 255H550 M1050 255H1100 M1350 335V465 M1100 545H1050 M550 545H500 M250 465V335"/>
<rect class="card" x="50" y="175" width="450" height="160"/><text class="n" x="275" y="220" text-anchor="middle">1. Clear membership rules</text><text class="bn" x="275" y="262" text-anchor="middle">স্বচ্ছ সদস্যপদ</text><text class="sm" x="275" y="300" text-anchor="middle">Rights • records • participation</text>
<rect class="card" x="550" y="175" width="500" height="160"/><text class="n" x="800" y="220" text-anchor="middle">2. Regular internal elections</text><text class="bn" x="800" y="262" text-anchor="middle">নিয়মিত দলীয় নির্বাচন</text><text class="sm" x="800" y="300" text-anchor="middle">Fair competition • leadership renewal</text>
<rect class="card" x="1100" y="175" width="450" height="160"/><text class="n" x="1325" y="220" text-anchor="middle">3. Policy debate</text><text class="bn" x="1325" y="262" text-anchor="middle">নীতিগত আলোচনা</text><text class="sm" x="1325" y="300" text-anchor="middle">Evidence • dissent • deliberation</text>
<rect class="card" x="1100" y="465" width="450" height="160"/><text class="n" x="1325" y="510" text-anchor="middle">4. Transparent nominations</text><text class="bn" x="1325" y="552" text-anchor="middle">স্বচ্ছ প্রার্থী মনোনয়ন</text><text class="sm" x="1325" y="590" text-anchor="middle">Criteria • local input • appeals</text>
<rect class="card" x="550" y="465" width="500" height="160"/><text class="n" x="800" y="510" text-anchor="middle">5. Finance disclosure</text><text class="bn" x="800" y="552" text-anchor="middle">অর্থায়নের স্বচ্ছতা</text><text class="sm" x="800" y="590" text-anchor="middle">Accounts • audit • lawful sources</text>
<rect class="card" x="50" y="465" width="450" height="160"/><text class="n" x="275" y="510" text-anchor="middle">6. Review and remedy</text><text class="bn" x="275" y="552" text-anchor="middle">পর্যালোচনা ও প্রতিকার</text><text class="sm" x="275" y="590" text-anchor="middle">Complaints • fair procedures</text>
<rect x="240" y="700" width="1120" height="95" rx="22" fill="#e8eef2" stroke="#52616b" stroke-width="2.5"/><text class="n" x="800" y="738" text-anchor="middle">Written rules matter only when implemented</text><text class="bn" x="800" y="775" text-anchor="middle">গঠনতন্ত্র + বাস্তব অংশগ্রহণ + জবাবদিহি</text>
</svg>