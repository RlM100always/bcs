<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Political process cycle</title><desc id="desc">Eight stages from social demands through accountability and feedback.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#52616b"/></marker><style>
.bg{fill:#f7f8fa}.title{font:700 40px Arial,sans-serif;fill:#172b3a}.sub{font:22px Arial,sans-serif;fill:#52616b}.card{fill:#fff;stroke:#52616b;stroke-width:2.5;rx:20}.n{font:700 25px Arial,sans-serif;fill:#172b3a}.bn{font:22px 'Noto Sans Bengali',Arial,sans-serif;fill:#243746}.sm{font:18px Arial,sans-serif;fill:#52616b}.line{stroke:#52616b;stroke-width:3.5;fill:none;marker-end:url(#a)}
</style></defs>
<rect class="bg" width="1600" height="900"/><text class="title" x="800" y="62" text-anchor="middle">THE POLITICAL PROCESS</text><text class="sub" x="800" y="104" text-anchor="middle">From citizens' demands to public accountability</text>
<path class="line" d="M390 245H430 M770 245H810 M1150 245H1190 M1360 330V430 M1190 520H1150 M810 520H770 M430 520H390 M220 430V330"/>
<rect class="card" x="50" y="165" width="340" height="165"/><text class="n" x="220" y="210" text-anchor="middle">1. Social demands</text><text class="bn" x="220" y="252" text-anchor="middle">সামাজিক দাবি</text><text class="sm" x="220" y="292" text-anchor="middle">Needs • rights • services</text>
<rect class="card" x="430" y="165" width="340" height="165"/><text class="n" x="600" y="210" text-anchor="middle">2. Public discussion</text><text class="bn" x="600" y="252" text-anchor="middle">জনআলোচনা</text><text class="sm" x="600" y="292" text-anchor="middle">Media • civic debate</text>
<rect class="card" x="810" y="165" width="340" height="165"/><text class="n" x="980" y="210" text-anchor="middle">3. Organisation</text><text class="bn" x="980" y="252" text-anchor="middle">সংগঠন ও প্রতিনিধিত্ব</text><text class="sm" x="980" y="292" text-anchor="middle">Parties • interest groups</text>
<rect class="card" x="1190" y="165" width="340" height="165"/><text class="n" x="1360" y="210" text-anchor="middle">4. Competition</text><text class="bn" x="1360" y="252" text-anchor="middle">প্রতিযোগিতা ও পছন্দ</text><text class="sm" x="1360" y="292" text-anchor="middle">Policies • candidates</text>
<rect class="card" x="1190" y="430" width="340" height="165"/><text class="n" x="1360" y="475" text-anchor="middle">5. Decision</text><text class="bn" x="1360" y="517" text-anchor="middle">প্রাতিষ্ঠানিক সিদ্ধান্ত</text><text class="sm" x="1360" y="557" text-anchor="middle">Law • budget • policy</text>
<rect class="card" x="810" y="430" width="340" height="165"/><text class="n" x="980" y="475" text-anchor="middle">6. Implementation</text><text class="bn" x="980" y="517" text-anchor="middle">বাস্তবায়ন</text><text class="sm" x="980" y="557" text-anchor="middle">Services • administration</text>
<rect class="card" x="430" y="430" width="340" height="165"/><text class="n" x="600" y="475" text-anchor="middle">7. Accountability</text><text class="bn" x="600" y="517" text-anchor="middle">জবাবদিহি</text><text class="sm" x="600" y="557" text-anchor="middle">Review • audit • remedy</text>
<rect class="card" x="50" y="430" width="340" height="165"/><text class="n" x="220" y="475" text-anchor="middle">8. Feedback</text><text class="bn" x="220" y="517" text-anchor="middle">প্রতিক্রিয়া ও সংস্কার</text><text class="sm" x="220" y="557" text-anchor="middle">Evidence • improvement</text>
<rect x="240" y="690" width="1120" height="100" rx="22" fill="#e8eef2" stroke="#52616b" stroke-width="2.5"/><text class="n" x="800" y="732" text-anchor="middle">A cycle, not a one-day event</text><text class="bn" x="800" y="770" text-anchor="middle">নির্বাচন গুরুত্বপূর্ণ—কিন্তু পুরো রাজনৈতিক প্রক্রিয়ার একটি ধাপ</text>
</svg>