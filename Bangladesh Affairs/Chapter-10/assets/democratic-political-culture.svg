<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Democratic political culture framework</title><desc id="desc">Six foundations of democratic political culture and the reform goal.</desc>
<defs><style>.bg{fill:#f7f8fa}.title{font:700 40px Arial,sans-serif;fill:#172b3a}.sub{font:22px Arial,sans-serif;fill:#52616b}.card{fill:#fff;stroke:#52616b;stroke-width:2.5;rx:22}.n{font:700 27px Arial,sans-serif;fill:#172b3a}.bn{font:22px 'Noto Sans Bengali',Arial,sans-serif;fill:#243746}.sm{font:18px Arial,sans-serif;fill:#52616b}</style></defs>
<rect class="bg" width="1600" height="900"/><text class="title" x="800" y="65" text-anchor="middle">DEMOCRATIC POLITICAL CULTURE</text><text class="sub" x="800" y="105" text-anchor="middle">From political disagreement to rules-based competition</text>
<rect class="card" x="80" y="160" width="440" height="190"/><text class="n" x="300" y="215" text-anchor="middle">1. Tolerance</text><text class="bn" x="300" y="260" text-anchor="middle">মতভিন্নতার প্রতি সহনশীলতা</text><text class="sm" x="300" y="305" text-anchor="middle">Opponents are legitimate rivals</text>
<rect class="card" x="580" y="160" width="440" height="190"/><text class="n" x="800" y="215" text-anchor="middle">2. Rule of law</text><text class="bn" x="800" y="260" text-anchor="middle">আইনের সমান প্রয়োগ</text><text class="sm" x="800" y="305" text-anchor="middle">Fair rules and remedies</text>
<rect class="card" x="1080" y="160" width="440" height="190"/><text class="n" x="1300" y="215" text-anchor="middle">3. Participation</text><text class="bn" x="1300" y="260" text-anchor="middle">কার্যকর নাগরিক অংশগ্রহণ</text><text class="sm" x="1300" y="305" text-anchor="middle">Inclusive political voice</text>
<rect class="card" x="80" y="400" width="440" height="190"/><text class="n" x="300" y="455" text-anchor="middle">4. Accountability</text><text class="bn" x="300" y="500" text-anchor="middle">জবাবদিহি</text><text class="sm" x="300" y="545" text-anchor="middle">Explain decisions and correct failures</text>
<rect class="card" x="580" y="400" width="440" height="190"/><text class="n" x="800" y="455" text-anchor="middle">5. Transparency</text><text class="bn" x="800" y="500" text-anchor="middle">স্বচ্ছতা</text><text class="sm" x="800" y="545" text-anchor="middle">Open rules and party finance</text>
<rect class="card" x="1080" y="400" width="440" height="190"/><text class="n" x="1300" y="455" text-anchor="middle">6. Peaceful competition</text><text class="bn" x="1300" y="500" text-anchor="middle">শান্তিপূর্ণ রাজনৈতিক প্রতিযোগিতা</text><text class="sm" x="1300" y="545" text-anchor="middle">Debate, not intimidation</text>
<rect x="220" y="660" width="1160" height="110" rx="22" fill="#e8eef2" stroke="#52616b" stroke-width="2.5"/><text class="n" x="800" y="705" text-anchor="middle">Reform objective</text><text class="bn" x="800" y="745" text-anchor="middle">মতভিন্নতা দূর নয়—আইনসম্মত ও জবাবদিহিমূলকভাবে পরিচালনা</text>
</svg>