<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Functions of political parties</title><desc id="desc">Seven core functions of political parties in a democracy.</desc>
<defs><style>.bg{fill:#f7f8fa}.title{font:700 40px Arial,sans-serif;fill:#172b3a}.sub{font:22px Arial,sans-serif;fill:#52616b}.card{fill:#fff;stroke:#52616b;stroke-width:2.5;rx:22}.n{font:700 25px Arial,sans-serif;fill:#172b3a}.bn{font:22px 'Noto Sans Bengali',Arial,sans-serif;fill:#243746}.sm{font:18px Arial,sans-serif;fill:#52616b}</style></defs>
<rect class="bg" width="1600" height="900"/><text class="title" x="800" y="65" text-anchor="middle">FUNCTIONS OF POLITICAL PARTIES</text><text class="sub" x="800" y="105" text-anchor="middle">How parties connect citizens, policy and government</text>
<rect class="card" x="80" y="155" width="440" height="160"/><text class="n" x="300" y="205" text-anchor="middle">1. Representation</text><text class="bn" x="300" y="247" text-anchor="middle">জনগণের দাবি তুলে ধরা</text><text class="sm" x="300" y="283" text-anchor="middle">Voices → public agenda</text>
<rect class="card" x="580" y="155" width="440" height="160"/><text class="n" x="800" y="205" text-anchor="middle">2. Recruitment</text><text class="bn" x="800" y="247" text-anchor="middle">নেতৃত্ব তৈরি</text><text class="sm" x="800" y="283" text-anchor="middle">Members → leaders</text>
<rect class="card" x="1080" y="155" width="440" height="160"/><text class="n" x="1300" y="205" text-anchor="middle">3. Socialisation</text><text class="bn" x="1300" y="247" text-anchor="middle">রাজনৈতিক শিক্ষা</text><text class="sm" x="1300" y="283" text-anchor="middle">Rights • duties • debate</text>
<rect class="card" x="80" y="355" width="440" height="160"/><text class="n" x="300" y="405" text-anchor="middle">4. Aggregation</text><text class="bn" x="300" y="447" text-anchor="middle">বিভিন্ন দাবি সমন্বয়</text><text class="sm" x="300" y="483" text-anchor="middle">Interests → programme</text>
<rect class="card" x="580" y="355" width="440" height="160"/><text class="n" x="800" y="405" text-anchor="middle">5. Policy</text><text class="bn" x="800" y="447" text-anchor="middle">নীতি ও বিকল্প প্রস্তাব</text><text class="sm" x="800" y="483" text-anchor="middle">Ideas → public choices</text>
<rect class="card" x="1080" y="355" width="440" height="160"/><text class="n" x="1300" y="405" text-anchor="middle">6. Government</text><text class="bn" x="1300" y="447" text-anchor="middle">সরকার গঠন ও পরিচালনা</text><text class="sm" x="1300" y="483" text-anchor="middle">Mandate → administration</text>
<rect class="card" x="330" y="555" width="940" height="150"/><text class="n" x="800" y="600" text-anchor="middle">7. Accountability and opposition</text><text class="bn" x="800" y="642" text-anchor="middle">নজরদারি • বিকল্প • জবাবদিহি</text><text class="sm" x="800" y="678" text-anchor="middle">Scrutiny is part of democratic competition</text>
<text class="sm" x="800" y="775" text-anchor="middle">A party strengthens democracy when it also practises transparency and internal democracy.</text>
</svg>