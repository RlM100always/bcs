<path d="M905 245 H945" stroke="#496581" stroke-width="4" marker-end="url(#arr)"/>
<rect x="960" y="180" width="180" height="130" rx="18" fill="#d9f0e7" stroke="#24846a" stroke-width="2"/><text x="1050" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#135c4b">Response</text><text x="1050" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#17483f">Enforce</text><text x="1050" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#17483f">and monitor</text>
<text x="60" y="385" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#15364a">Control points</text>
<rect x="60" y="420" width="330" height="135" rx="18" fill="#ffffff" stroke="#b8c8d7" stroke-width="2"/><text x="225" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#15364a">Prevent at source</text><text x="225" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#496581">ETP • sewage treatment</text><text x="225" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#496581">safe waste collection</text>
<rect x="435" y="420" width="330" height="135" rx="18" fill="#ffffff" stroke="#b8c8d7" stroke-width="2"/><text x="600" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#15364a">Measure and disclose</text><text x="600" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#496581">sampling • open data</text><text x="600" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#496581">independent compliance checks</text>
<rect x="810" y="420" width="330" height="135" rx="18" fill="#ffffff" stroke="#b8c8d7" stroke-width="2"/><text x="975" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#15364a">Restore and involve</text><text x="975" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#496581">river corridors • communities</text><text x="975" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#496581">complaints • accountability</text>
<text x="600" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#496581">Do not attribute every river's pollution to one source without site-specific monitoring data.</text></svg>