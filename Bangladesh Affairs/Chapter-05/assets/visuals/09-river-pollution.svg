<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4fbff"/><stop offset="1" stop-color="#edf7f1"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#496581"/></marker></defs><rect width="1200" height="700" rx="28" fill="url(#bg)"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15364a">River pollution: source to solution</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#496581">Causal diagram for exam answers — not a measured dataset</text>
<rect x="60" y="180" width="240" height="130" rx="18" fill="#fff0d9" stroke="#d28a2c" stroke-width="2"/><text x="180" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#8c520b">Sources</text><text x="180" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#71450e">Industry • sewage</text><text x="180" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#71450e">plastic • runoff</text>
<path d="M305 245 H345" stroke="#496581" stroke-width="4" marker-end="url(#arr)"/>
<rect x="360" y="180" width="240" height="130" rx="18" fill="#fde5e2" stroke="#c44d43" stroke-width="2"/><text x="480" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#8d2922">Water quality</text><text x="480" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#7b3933">Chemical load</text><text x="480" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#7b3933">pathogens • low oxygen</text>
