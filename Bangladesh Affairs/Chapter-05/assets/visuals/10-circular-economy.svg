<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6fbf7"/><stop offset="1" stop-color="#edf4ff"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#24846a"/></marker></defs><rect width="1200" height="700" rx="28" fill="url(#bg)"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15364a">Circular economy | Waste reduction cycle</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#496581">Prevent waste before recycling or disposal</text>
<rect x="400" y="145" width="400" height="90" rx="18" fill="#15364a"/><text x="600" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff">Design out waste</text>
<path d="M600 238 V275" stroke="#24846a" stroke-width="4" marker-end="url(#arr)"/><rect x="440" y="285" width="320" height="72" rx="16" fill="#d9f0e7" stroke="#24846a" stroke-width="2"/><text x="600" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#135c4b">Reduce</text>
<path d="M760 320 H870 V390" fill="none" stroke="#24846a" stroke-width="4" marker-end="url(#arr)"/><rect x="760" y="400" width="260" height="72" rx="16" fill="#e2eafe" stroke="#5878c8" stroke-width="2"/><text x="890" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#284b9b">Reuse / Repair</text>
<path d="M890 474 V515 H740" fill="none" stroke="#24846a" stroke-width="4" marker-end="url(#arr)"/><rect x="430" y="515" width="300" height="72" rx="16" fill="#fff0d9" stroke="#d28a2c" stroke-width="2"/><text x="580" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#8c520b">Recycle / Recover</text>
<path d="M430 550 H300 V420" fill="none" stroke="#24846a" stroke-width="4" marker-end="url(#arr)"/><rect x="90" y="350" width="240" height="120" rx="18" fill="#fde5e2" stroke="#c44d43" stroke-width="2"/><text x="210" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#8d2922">Safe disposal</text><text x="210" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#7b3933">Only for residual</text><text x="210" y="449" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#7b3933">waste</text>
<path d="M210 348 V200 H390" fill="none" stroke="#496581" stroke-width="3" stroke-dasharray="8 8"/><text x="600" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#496581">Enablers: source separation • safe collection • markets • producer responsibility • worker safety</text></svg>