<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" rx="24" fill="#f8fafc"/><text x="450" y="45" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#123047">বর্জ্য ব্যবস্থাপনার অগ্রাধিকার</text><g font-family="sans-serif" text-anchor="middle"><path d="M170 90 H730 L690 150 H210 Z" fill="#166534"/><text x="450" y="128" font-size="21" font-weight="700" fill="#fff">1. REDUCE — বর্জ্য তৈরি কমান</text><path d="M210 160 H690 L650 220 H250 Z" fill="#15803d"/><text x="450" y="198" font-size="21" font-weight="700" fill="#fff">2. REUSE — পুনঃব্যবহার</text><path d="M250 230 H650 L610 290 H290 Z" fill="#65a30d"/><text x="450" y="268" font-size="21" font-weight="700" fill="#fff">3. REPAIR — মেরামত</text><path d="M290 300 H610 L570 360 H330 Z" fill="#ca8a04"/><text x="450" y="338" font-size="21" font-weight="700" fill="#fff">4. RECYCLE — পুনর্ব্যবহার</text><path d="M330 370 H570 L535 425 H365 Z" fill="#b45309"/><text x="450" y="405" font-size="19" font-weight="700" fill="#fff">5. SAFE DISPOSAL</text><text x="450" y="463" font-size="17" fill="#475569">প্রথমে বর্জ্য কমানো; শেষ ধাপে নিরাপদ নিষ্পত্তি</text></g></svg>