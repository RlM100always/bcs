<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4fbf8"/><stop offset="1" stop-color="#f4f6ff"/></linearGradient></defs><rect width="1200" height="700" rx="28" fill="url(#bg)"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15364a">Ecosystem services in Bangladesh</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#496581">Illustrative summary; local benefits vary with ecosystem condition and management</text>
<rect x="60" y="160" width="520" height="210" rx="22" fill="#d9f0e7" stroke="#24846a" stroke-width="2"/><text x="320" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#135c4b">Mangrove / Sundarbans</text><text x="100" y="246" font-family="Arial,sans-serif" font-size="19" fill="#17483f">• Wildlife and fisheries habitat</text><text x="100" y="282" font-family="Arial,sans-serif" font-size="19" fill="#17483f">• Coastal buffering in suitable settings</text><text x="100" y="318" font-family="Arial,sans-serif" font-size="19" fill="#17483f">• Livelihoods, carbon storage, tourism</text>
<rect x="620" y="160" width="520" height="210" rx="22" fill="#e2eafe" stroke="#5878c8" stroke-width="2"/><text x="880" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#284b9b">Haor / Wetland</text><text x="660" y="246" font-family="Arial,sans-serif" font-size="19" fill="#273f70">• Seasonal water storage and drainage</text><text x="660" y="282" font-family="Arial,sans-serif" font-size="19" fill="#273f70">• Fish breeding and migratory birds</text><text x="660" y="318" font-family="Arial,sans-serif" font-size="19" fill="#273f70">• Agriculture, fishing and livelihoods</text>
<rect x="60" y="410" width="520" height="210" rx="22" fill="#fff0d9" stroke="#d28a2c" stroke-width="2"/><text x="320" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#8c520b">Forest / Hill ecosystem</text><text x="100" y="496" font-family="Arial,sans-serif" font-size="19" fill="#71450e">• Biodiversity and habitat connectivity</text><text x="100" y="532" font-family="Arial,sans-serif" font-size="19" fill="#71450e">• Soil protection and water regulation</text><text x="100" y="568" font-family="Arial,sans-serif" font-size="19" fill="#71450e">• Forest-based livelihoods and culture</text>
<rect x="620" y="410" width="520" height="210" rx="22" fill="#fde5e2" stroke="#c44d43" stroke-width="2"/><text x="880" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#8d2922">River / Urban waterbody</text><text x="660" y="496" font-family="Arial,sans-serif" font-size="19" fill="#7b3933">• Water, transport and fisheries</text><text x="660" y="532" font-family="Arial,sans-serif" font-size="19" fill="#7b3933">• Drainage and flood-storage functions</text><text x="660" y="568" font-family="Arial,sans-serif" font-size="19" fill="#7b3933">• Recreation and local climate benefits</text>
<text x="600" y="665" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#496581">Conservation works best when ecological functions and local community needs are planned together.</text></svg>