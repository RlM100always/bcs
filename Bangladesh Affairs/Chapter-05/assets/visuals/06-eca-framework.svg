<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4fbf8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#496581"/></marker></defs>
<rect width="1200" height="700" rx="28" fill="url(#bg)"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15364a">ECA framework | Bangladesh</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#496581">Conceptual learning diagram — not an official boundary map</text>
<rect x="70" y="165" width="280" height="160" rx="22" fill="#d9f0e7" stroke="#24846a" stroke-width="2"/><text x="210" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#135c4b">1. Identify</text><text x="210" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17483f">Sensitive habitat</text><text x="210" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17483f">and ecological value</text>
<path d="M355 245 H415" stroke="#496581" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="430" y="165" width="300" height="160" rx="22" fill="#e2eafe" stroke="#5878c8" stroke-width="2"/><text x="580" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#284b9b">2. Notify / Gazette</text><text x="580" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#273f70">Legal designation</text><text x="580" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#273f70">and applicable rules</text>
<path d="M735 245 H795" stroke="#496581" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="810" y="165" width="320" height="160" rx="22" fill="#fff0d9" stroke="#d28a2c" stroke-width="2"/><text x="970" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#8c520b">3. Manage</text><text x="970" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#71450e">Control damaging activity</text><text x="970" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#71450e">and restore habitat</text>
<path d="M970 335 V405 H580 V435" fill="none" stroke="#496581" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="350" y="450" width="460" height="145" rx="22" fill="#dcefe1" stroke="#24846a" stroke-width="2"/><text x="580" y="492" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#135c4b">4. Monitor and review</text><text x="580" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17483f">Water quality • habitat • species</text><text x="580" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17483f">local livelihoods • compliance</text>
<path d="M350 520 H205 V335" fill="none" stroke="#496581" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<text x="60" y="655" font-family="Arial,sans-serif" font-size="16" fill="#496581">Check the latest Gazette for current ECA names, legal boundaries and applicable rules.</text></svg>