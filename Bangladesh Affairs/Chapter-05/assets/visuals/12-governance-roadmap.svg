<path d="M780 340 H815" stroke="#496581" stroke-width="4" marker-end="url(#arr)"/>
<rect x="830" y="180" width="300" height="320" rx="22" fill="#d9f0e7" stroke="#24846a" stroke-width="2"/><text x="980" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#135c4b">Years 4–5</text><text x="980" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17483f">Restore and evaluate</text><text x="870" y="315" font-family="Arial,sans-serif" font-size="17" fill="#17483f">• Rivers and wetlands</text><text x="870" y="350" font-family="Arial,sans-serif" font-size="17" fill="#17483f">• Climate-resilient projects</text><text x="870" y="385" font-family="Arial,sans-serif" font-size="17" fill="#17483f">• Green skills and jobs</text><text x="870" y="420" font-family="Arial,sans-serif" font-size="17" fill="#17483f">• Independent outcome audit</text>
