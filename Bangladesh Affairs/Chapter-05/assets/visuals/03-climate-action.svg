<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><rect width="900" height="480" rx="24" fill="#f8fafc"/><text x="450" y="45" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#123047">জলবায়ু পদক্ষেপ: Adaptation + Mitigation</text><g font-family="sans-serif" text-anchor="middle"><rect x="70" y="95" width="350" height="235" rx="18" fill="#dbeafe" stroke="#7aa7d9"/><text x="245" y="135" font-size="24" font-weight="700" fill="#173e68">ADAPTATION</text><text x="245" y="170" font-size="17" fill="#173e68">ঝুঁকির প্রভাব কমানো</text><text x="245" y="210" font-size="16" fill="#173e68">• আগাম সতর্কতা ও আশ্রয়কেন্দ্র</text><text x="245" y="240" font-size="16" fill="#173e68">• সহনশীল ফসল ও নিরাপদ পানি</text><text x="245" y="270" font-size="16" fill="#173e68">• জলবায়ু-সহনশীল অবকাঠামো</text><rect x="480" y="95" width="350" height="235" rx="18" fill="#dcfce7" stroke="#86c69b"/><text x="655" y="135" font-size="24" font-weight="700" fill="#14532d">MITIGATION</text><text x="655" y="170" font-size="17" fill="#14532d">নির্গমন কমানো/কার্বন শোষণ</text><text x="655" y="210" font-size="16" fill="#14532d">• পরিচ্ছন্ন শক্তি ও দক্ষতা</text><text x="655" y="240" font-size="16" fill="#14532d">• গণপরিবহন ও পরিচ্ছন্ন শিল্প</text><text x="655" y="270" font-size="16" fill="#14532d">• বন ও জলাভূমি সংরক্ষণ</text><rect x="160" y="370" width="580" height="60" rx="15" fill="#123047"/><text x="450" y="407" font-size="21" font-weight="700" fill="#fff">ন্যায্য অর্থায়ন + স্থানীয় অংশগ্রহণ + জবাবদিহি</text></g></svg>