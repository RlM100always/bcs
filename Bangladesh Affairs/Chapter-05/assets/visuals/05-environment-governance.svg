<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><rect width="900" height="480" rx="24" fill="#f8fafc"/><text x="450" y="45" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#123047">পরিবেশগত সুশাসন: আইন থেকে ফলাফল</text><g font-family="sans-serif" text-anchor="middle"><rect x="70" y="100" width="160" height="85" rx="13" fill="#dbeafe"/><text x="150" y="135" font-size="20" font-weight="700" fill="#173e68">আইন ও নীতি</text><text x="150" y="160" font-size="15" fill="#173e68">মানদণ্ড</text><rect x="260" y="100" width="160" height="85" rx="13" fill="#dcfce7"/><text x="340" y="135" font-size="20" font-weight="700" fill="#14532d">পর্যবেক্ষণ</text><text x="340" y="160" font-size="15" fill="#14532d">তথ্য ও পরীক্ষা</text><rect x="450" y="100" width="160" height="85" rx="13" fill="#fef3c7"/><text x="530" y="135" font-size="20" font-weight="700" fill="#854d0e">প্রয়োগ</text><text x="530" y="160" font-size="15" fill="#854d0e">নিরীক্ষা/প্রতিকার</text><rect x="640" y="100" width="190" height="85" rx="13" fill="#f3e8ff"/><text x="735" y="135" font-size="20" font-weight="700" fill="#6b21a8">জবাবদিহি</text><text x="735" y="160" font-size="15" fill="#6b21a8">স্বচ্ছতা/জনমত</text><path d="M230 142 H252 M420 142 H442 M610 142 H632" stroke="#64748b" stroke-width="3"/><rect x="140" y="255" width="620" height="100" rx="18" fill="#123047"/><text x="450" y="295" font-size="23" font-weight="700" fill="#fff">বাস্তব ফলাফল</text><text x="450" y="325" font-size="17" fill="#e2e8f0">কম দূষণ • নিরাপদ পানি • সুরক্ষিত বাস্তুতন্ত্র • উন্নত স্বাস্থ্য</text><text x="450" y="410" font-size="17" fill="#475569">আইন থাকা যথেষ্ট নয়—বাস্তব প্রয়োগ ও ফলাফল মাপতে হবে</text></g></svg>