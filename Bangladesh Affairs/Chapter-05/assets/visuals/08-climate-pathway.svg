<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3fbff"/><stop offset="1" stop-color="#f4f1ff"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#506783"/></marker></defs><rect width="1200" height="700" rx="28" fill="url(#bg)"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15364a">Climate action pathway | Adaptation + mitigation</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#496581">Separate the causes of climate change from measures that reduce its impacts</text>
<rect x="65" y="170" width="330" height="160" rx="22" fill="#fde5e2" stroke="#c44d43" stroke-width="2"/><text x="230" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#8d2922">CLIMATE MITIGATION</text><text x="230" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#7b3933">Reduce emissions</text><text x="230" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#7b3933">and increase removals</text><text x="230" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#7b3933">Clean energy • efficiency • forests</text>
<rect x="805" y="170" width="330" height="160" rx="22" fill="#d9f0e7" stroke="#24846a" stroke-width="2"/><text x="970" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#135c4b">CLIMATE ADAPTATION</text><text x="970" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17483f">Reduce exposure and harm</text><text x="970" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17483f">prepare and recover</text><text x="970" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17483f">Warnings • shelters • resilient crops</text>
<rect x="450" y="185" width="300" height="130" rx="22" fill="#e2eafe" stroke="#5878c8" stroke-width="2"/><text x="600" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#284b9b">Shared planning</text><text x="600" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#273f70">Data • finance • institutions</text><text x="600" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#273f70">equity • accountability</text>
<path d="M395 250 H440" stroke="#506783" stroke-width="4" marker-end="url(#arr)"/><path d="M760 250 H795" stroke="#506783" stroke-width="4" marker-end="url(#arr)"/>
<path d="M230 340 V405 H600 V425" fill="none" stroke="#506783" stroke-width="3" marker-end="url(#arr)"/><path d="M970 340 V405 H600" fill="none" stroke="#506783" stroke-width="3"/>
<rect x="290" y="440" width="620" height="110" rx="22" fill="#15364a"/><text x="600" y="483" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#ffffff">Climate-resilient development</text><text x="600" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e7f1ff">Protect lives, livelihoods, infrastructure and ecosystems</text>
<text x="600" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#496581">Adaptation does not replace mitigation; mitigation does not remove the need to adapt.</text></svg>