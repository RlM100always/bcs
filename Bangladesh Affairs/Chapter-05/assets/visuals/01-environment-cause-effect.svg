<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"><rect width="900" height="470" rx="24" fill="#f8fafc"/><text x="450" y="45" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#123047">পরিবেশগত সমস্যা: কারণ → প্রভাব → সমাধান</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="105" width="235" height="115" rx="15" fill="#dbeafe" stroke="#7aa7d9"/><text x="172" y="139" font-size="21" font-weight="700" fill="#173e68">কারণ</text><text x="172" y="169" font-size="16" fill="#173e68">নির্গমন • বর্জ্য</text><text x="172" y="192" font-size="16" fill="#173e68">ভূমি ব্যবহার • দুর্বল প্রয়োগ</text><rect x="332" y="105" width="235" height="115" rx="15" fill="#ffe4e6" stroke="#e8a0a8"/><text x="449" y="139" font-size="21" font-weight="700" fill="#9f1239">প্রভাব</text><text x="449" y="169" font-size="16" fill="#9f1239">স্বাস্থ্য • জীবিকা</text><text x="449" y="192" font-size="16" fill="#9f1239">অর্থনীতি • বাস্তুতন্ত্র</text><rect x="610" y="105" width="235" height="115" rx="15" fill="#dcfce7" stroke="#86c69b"/><text x="727" y="139" font-size="21" font-weight="700" fill="#14532d">সমাধান</text><text x="727" y="169" font-size="16" fill="#14532d">উৎস নিয়ন্ত্রণ</text><text x="727" y="192" font-size="16" fill="#14532d">আইন • তথ্য • জবাবদিহি</text><path d="M290 162 H324 M567 162 H602" stroke="#64748b" stroke-width="3"/><rect x="110" y="285" width="680" height="90" rx="18" fill="#123047"/><text x="450" y="321" font-size="22" font-weight="700" fill="#fff">টেকসই উন্নয়ন</text><text x="450" y="350" font-size="17" fill="#e2e8f0">জনস্বাস্থ্য + অর্থনীতি + সামাজিক ন্যায় + প্রকৃতির সুরক্ষা</text><path d="M727 220 V250 H450 V277" stroke="#64748b" stroke-width="3" fill="none"/></g></svg>