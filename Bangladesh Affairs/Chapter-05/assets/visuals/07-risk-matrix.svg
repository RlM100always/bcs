<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#edf5f1"/></linearGradient></defs><rect width="1200" height="700" rx="28" fill="url(#bg)"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15364a">Environmental risk | Risk model</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#496581">Conceptual model — risk depends on hazard, exposure and vulnerability</text>
<rect x="80" y="180" width="280" height="180" rx="20" fill="#fde5e2" stroke="#c44d43" stroke-width="2"/><text x="220" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#8d2922">HAZARD</text><text x="220" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#7b3933">Cyclone • flood</text><text x="220" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#7b3933">heat • pollution</text><text x="220" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#7b3933">What can cause harm?</text>
<text x="400" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#496581">×</text>
<rect x="440" y="180" width="280" height="180" rx="20" fill="#fff0d9" stroke="#d28a2c" stroke-width="2"/><text x="580" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#8c520b">EXPOSURE</text><text x="580" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#71450e">People • homes</text><text x="580" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#71450e">farms • roads</text><text x="580" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#71450e">Who / what is in harm's way?</text>
<text x="760" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#496581">×</text>
<rect x="800" y="180" width="320" height="180" rx="20" fill="#e2eafe" stroke="#5878c8" stroke-width="2"/><text x="960" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#284b9b">VULNERABILITY</text><text x="960" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#273f70">Poverty • health</text><text x="960" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#273f70">weak services • low readiness</text><text x="960" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#273f70">How hard is recovery?</text>
<path d="M600 365 V420" stroke="#496581" stroke-width="4"/><path d="M590 410 L600 425 L610 410" fill="none" stroke="#496581" stroke-width="4"/><rect x="270" y="440" width="660" height="90" rx="20" fill="#15364a"/><text x="600" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff">DISASTER RISK / EXPECTED LOSS</text>
<text x="600" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#15364a">Reduce risk at all three points</text><text x="600" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#496581">Reduce hazards where possible • limit exposure • strengthen resilience and recovery capacity</text></svg>