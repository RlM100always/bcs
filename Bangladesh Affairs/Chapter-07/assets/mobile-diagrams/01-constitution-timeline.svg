<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="607" viewBox="0 0 420 607" role="img" aria-labelledby="title desc"><title id="title">সংবিধান প্রণয়নের সময়রেখা</title><desc id="desc">Constitution-making timeline • BCS Written</desc><rect width="420" height="607" rx="16" fill="#f8fafc"/><rect width="420" height="98" rx="16" fill="#123047"/><rect y="68" width="420" height="22" fill="#123047"/><text x="22" y="27" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#bfdbfe">BCS WRITTEN • BANGLADESH AFFAIRS</text><text x="22" y="53" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff"><tspan x="22" dy="0">সংবিধান প্রণয়নের সময়রেখা</tspan></text><text x="22" y="65" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="10.5" fill="#dbeafe"><tspan x="22" dy="0">Constitution-making timeline • BCS Written</tspan></text><rect x="20" y="98" width="380" height="87" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="122" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">১০ এপ্রিল ১৯৭২</tspan><tspan></tspan></text><text x="38" y="143" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">গণপরিষদ আদেশের ভিত্তিতে সংবিধান প্রণয়নের</tspan><tspan x="38" dy="16">সাংবিধানিক প্রক্রিয়া শুরু।</tspan></text><rect x="20" y="197" width="380" height="87" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="221" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">১১ এপ্রিল ১৯৭২</tspan><tspan></tspan></text><text x="38" y="242" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">ড. কামাল হোসেনের নেতৃত্বে ৩৪ সদস্যের খসড়া প্রণয়ন</tspan><tspan x="38" dy="16">কমিটি গঠিত হয়।</tspan></text><rect x="20" y="296" width="380" height="87" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="320" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">১২ অক্টোবর ১৯৭২</tspan><tspan></tspan></text><text x="38" y="341" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">গণপরিষদে খসড়া সংবিধান উত্থাপন করা হয়; আলোচনা ও</tspan><tspan x="38" dy="16">সংশোধনের পর চূড়ান্ত রূপ পায়।</tspan></text><rect x="20" y="395" width="380" height="87" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="419" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">৪ নভেম্বর ১৯৭২</tspan><tspan></tspan></text><text x="38" y="440" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">গণপরিষদ সংবিধান গ্রহণ করে—এটি গ্রহণের তারিখ,</tspan><tspan x="38" dy="16">কার্যকারিতার তারিখ নয়।</tspan></text><rect x="20" y="494" width="380" height="87" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="518" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">১৬ ডিসেম্বর ১৯৭২</tspan><tspan></tspan></text><text x="38" y="539" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">বিজয় দিবসে সংবিধান কার্যকর হয়; Article 153(1) এ</tspan><tspan x="38" dy="16">তারিখটি নির্ধারণ করে।</tspan></text></svg>