<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Bangladesh Constitution article map</title>
<desc id="desc">A revision map of the Preamble and principal parts and article ranges of the Constitution of Bangladesh, including the fundamental principles, fundamental rights, executive, legislature, judiciary, elections, services, emergency provisions and amendment.</desc>
<rect width="1200" height="760" rx="28" fill="#f8fafc"/>
<text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">CONSTITUTION ARTICLE MAP — QUICK REVISION</text>
<rect x="350" y="82" width="500" height="58" rx="18" fill="#172033"/>
<text x="600" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">PREAMBLE • State ideals and commitments</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="60" y="175" width="330" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="225" y="210" font-size="24" font-weight="700" fill="#1d4ed8">PART I • Arts. 1–7B</text><text x="225" y="242" font-size="19" fill="#1e293b">Republic • popular sovereignty</text>
<rect x="435" y="175" width="330" height="100" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="600" y="210" font-size="24" font-weight="700" fill="#166534">PART II • Arts. 8–25</text><text x="600" y="242" font-size="19" fill="#14532d">Fundamental state principles</text>
<rect x="810" y="175" width="330" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="975" y="210" font-size="24" font-weight="700" fill="#92400e">PART III • Arts. 26–47A</text><text x="975" y="242" font-size="19" fill="#78350f">Fundamental rights</text>
<rect x="60" y="315" width="330" height="100" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
<text x="225" y="350" font-size="24" font-weight="700" fill="#9d174d">PART IV • Arts. 48–64</text><text x="225" y="382" font-size="19" fill="#831843">Executive • Cabinet • AG</text>
<rect x="435" y="315" width="330" height="100" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
<text x="600" y="350" font-size="24" font-weight="700" fill="#3730a3">PART V • Arts. 65–93</text><text x="600" y="382" font-size="19" fill="#312e81">Parliament • law-making</text>
<rect x="810" y="315" width="330" height="100" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
<text x="975" y="350" font-size="24" font-weight="700" fill="#6b21a8">PART VI • Arts. 94–117</text><text x="975" y="382" font-size="19" fill="#581c87">Supreme Court • judiciary</text>
<rect x="60" y="455" width="330" height="100" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
<text x="225" y="490" font-size="24" font-weight="700" fill="#0e7490">PART VII • Arts. 118–126</text><text x="225" y="522" font-size="19" fill="#164e63">Election Commission</text>
<rect x="435" y="455" width="330" height="100" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
<text x="600" y="490" font-size="24" font-weight="700" fill="#334155">PART VIII–IX • 127–141</text><text x="600" y="522" font-size="19" fill="#334155">Audit • public service</text>
<rect x="810" y="455" width="330" height="100" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="975" y="490" font-size="24" font-weight="700" fill="#991b1b">PART IXA • 141A–141C</text><text x="975" y="522" font-size="19" fill="#7f1d1d">Emergency provisions</text>
<rect x="260" y="595" width="300" height="95" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="410" y="630" font-size="24" font-weight="700" fill="#1d4ed8">PART X • Article 142</text><text x="410" y="661" font-size="19" fill="#1e293b">Constitutional amendment</text>
<rect x="640" y="595" width="300" height="95" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="790" y="630" font-size="24" font-weight="700" fill="#166534">PART XI • Arts. 143–153</text><text x="790" y="661" font-size="19" fill="#14532d">Miscellaneous provisions</text>
</g>
<text x="600" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">Revision aid, not a substitute for the official consolidated text and subsequent binding judgments.</text>
</svg>