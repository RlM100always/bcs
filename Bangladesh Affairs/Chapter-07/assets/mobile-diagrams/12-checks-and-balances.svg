<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Constitutional checks and balances</title>
<desc id="desc">Parliament, executive and judiciary exercise distinct constitutional functions and check one another, with citizens, media and elections supplying public accountability.</desc>
<rect width="1200" height="690" rx="28" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">CHECKS &amp; BALANCES IN CONSTITUTIONAL GOVERNMENT</text>
<g stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M360 240 L840 240"/><path d="M850 280 L690 440"/><path d="M510 440 L350 280"/>
<path d="M826 228 L840 240 L826 252"/><path d="M704 425 L690 440 L710 441"/><path d="M364 425 L350 280 L364 294"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="75" y="150" width="330" height="150" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="240" y="195" font-size="29" font-weight="700" fill="#1d4ed8">PARLIAMENT</text><text x="240" y="235" font-size="21" fill="#1e293b">Laws • budget • oversight</text><text x="240" y="267" font-size="19" fill="#1e293b">Articles 65–93</text>
<rect x="795" y="150" width="330" height="150" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="960" y="195" font-size="29" font-weight="700" fill="#166534">EXECUTIVE</text><text x="960" y="235" font-size="21" fill="#14532d">Policy • administration</text><text x="960" y="267" font-size="19" fill="#14532d">Articles 48–64</text>
<rect x="435" y="390" width="330" height="150" rx="24" fill="#f3e8ff" stroke="#9333ea" stroke-width="4"/>
<text x="600" y="435" font-size="29" font-weight="700" fill="#6b21a8">JUDICIARY</text><text x="600" y="475" font-size="21" fill="#581c87">Interpretation • remedies</text><text x="600" y="507" font-size="19" fill="#581c87">Articles 94–117; 102</text>
<rect x="170" y="565" width="860" height="75" rx="20" fill="#172033"/>
<text x="600" y="595" font-size="25" font-weight="700" fill="#ffffff">PUBLIC ACCOUNTABILITY</text><text x="600" y="622" font-size="19" fill="#e2e8f0">Citizens • elections • media • open information • independent institutions</text>
</g>
<text x="600" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">The Constitution defines powers; accountability and institutional practice make the checks effective.</text>
</svg>