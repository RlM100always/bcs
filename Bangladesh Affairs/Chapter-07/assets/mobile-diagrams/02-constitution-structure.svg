<svg xmlns="http://www.w3.org/2000/svg" width="420" height="706" viewBox="0 0 420 706" role="img" aria-labelledby="title desc"><title id="title">সংবিধানের কাঠামো</title><desc id="desc">১১ ভাগ • ১৫৩ অনুচ্ছেদ • ৭ তফসিল নম্বর</desc><rect width="420" height="706" rx="16" fill="#f8fafc"/><rect width="420" height="98" rx="16" fill="#123047"/><rect y="68" width="420" height="22" fill="#123047"/><text x="22" y="27" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#bfdbfe">BCS WRITTEN • BANGLADESH AFFAIRS</text><text x="22" y="53" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff"><tspan x="22" dy="0">সংবিধানের কাঠামো</tspan></text><text x="22" y="65" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="10.5" fill="#dbeafe"><tspan x="22" dy="0">১১ ভাগ • ১৫৩ অনুচ্ছেদ • ৭ তফসিল নম্বর</tspan></text><rect x="20" y="98" width="380" height="87" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="122" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">প্রস্তাবনা (Preamble)</tspan><tspan></tspan></text><text x="38" y="143" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">রাষ্ট্রের পরিচয়, মুক্তিসংগ্রামের উত্তরাধিকার,</tspan><tspan x="38" dy="16">আদর্শ ও সাংবিধানিক অঙ্গীকারের ভিত্তি।</tspan></text><rect x="20" y="197" width="380" height="87" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="221" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">ভাগ I — প্রজাতন্ত্র</tspan><tspan></tspan></text><text x="38" y="242" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">অনুচ্ছেদ ১–৭ মূল কাঠামো; ৭A ও ৭B সংযোজন সম্পর্কে</tspan><tspan x="38" dy="16">পরবর্তী আদালতের রায় অবশ্যই বিবেচ্য।</tspan></text><rect x="20" y="296" width="380" height="87" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="320" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">ভাগ II — রাষ্ট্র পরিচালনার মূলনীতি</tspan><tspan></tspan></text><text x="38" y="341" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">অনুচ্ছেদ ৮–২৫: রাষ্ট্রের নীতিগত নির্দেশনা;</tspan><tspan x="38" dy="16">Article 8(2) অনুযায়ী সরাসরি আদালতে বলবৎযোগ্য নয়।</tspan></text><rect x="20" y="395" width="380" height="87" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="419" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">ভাগ III — মৌলিক অধিকার</tspan><tspan></tspan></text><text x="38" y="440" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">অনুচ্ছেদ ২৬–৪৭A: নাগরিকের অধিকার, সীমাবদ্ধতা ও</tspan><tspan x="38" dy="16">সাংবিধানিক প্রতিকার।</tspan></text><rect x="20" y="494" width="380" height="87" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="518" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">ভাগ IV–IXA</tspan><tspan></tspan></text><text x="38" y="539" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">নির্বাহী, আইনসভা, বিচার বিভাগ, নির্বাচন, CAG,</tspan><tspan x="38" dy="16">PSC, কর্মবিভাগ ও জরুরি বিধান।</tspan></text><rect x="20" y="593" width="380" height="87" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="617" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">ভাগ X–XI</tspan><tspan></tspan></text><text x="38" y="638" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">Article 142: সংশোধন; Articles 143–153: বিবিধ,</tspan><tspan x="38" dy="16">ব্যাখ্যা ও কার্যকারিতা।</tspan></text></svg>