<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="611" viewBox="0 0 420 611" role="img" aria-labelledby="title desc"><title id="title">রাষ্ট্রের মূলনীতি বনাম মৌলিক অধিকার</title><desc id="desc">দুটি অংশের উদ্দেশ্য ও প্রয়োগ এক নয়</desc><rect width="420" height="611" rx="16" fill="#f8fafc"/><rect width="420" height="118" rx="16" fill="#123047"/><rect y="68" width="420" height="22" fill="#123047"/><text x="22" y="27" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#bfdbfe">BCS WRITTEN • BANGLADESH AFFAIRS</text><text x="22" y="53" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff"><tspan x="22" dy="0">রাষ্ট্রের মূলনীতি বনাম মৌলিক</tspan><tspan x="22" dy="20">অধিকার</tspan></text><text x="22" y="85" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="10.5" fill="#dbeafe"><tspan x="22" dy="0">দুটি অংশের উদ্দেশ্য ও প্রয়োগ এক নয়</tspan></text><rect x="20" y="118" width="380" height="122" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="142" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">রাষ্ট্র পরিচালনার মূলনীতি — Part II,</tspan><tspan x="38" dy="18">Arts. 8–25</tspan><tspan></tspan></text><text x="38" y="181" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">রাষ্ট্রের নীতি নির্ধারণ ও আইন/নীতির ব্যাখ্যায়</tspan><tspan x="38" dy="16">নির্দেশনা দেয়; Article 8(2) অনুযায়ী বিচারিকভাবে</tspan><tspan x="38" dy="16">সরাসরি বলবৎযোগ্য নয়।</tspan></text><rect x="20" y="252" width="380" height="103" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="276" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">মৌলিক অধিকার — Part III, Arts. 26–47A</tspan><tspan></tspan></text><text x="38" y="297" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">নির্দিষ্ট সাংবিধানিক অধিকার; লঙ্ঘনের ক্ষেত্রে</tspan><tspan x="38" dy="16">Article 44 ও High Court Division-এর Article 102</tspan><tspan x="38" dy="16">গুরুত্বপূর্ণ।</tspan></text><rect x="20" y="367" width="380" height="119" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="391" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">পরীক্ষার মূল পার্থক্য</tspan><tspan></tspan></text><text x="38" y="412" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">Principles = রাষ্ট্রের নীতিগত দিকনির্দেশনা।</tspan><tspan x="38" dy="16">Rights = ব্যক্তি/নাগরিকের আইনগত সুরক্ষা ও</tspan><tspan x="38" dy="16">প্রতিকার। উভয়ই সাংবিধানিক শাসনের জন্য</tspan><tspan x="38" dy="16">গুরুত্বপূর্ণ।</tspan></text><rect x="20" y="498" width="380" height="87" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="522" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">উত্তরে সতর্কতা</tspan><tspan></tspan></text><text x="38" y="543" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">মৌলিক অধিকারও সব ক্ষেত্রে নিরঙ্কুশ নয়; সংবিধান ও</tspan><tspan x="38" dy="16">আইন নির্দিষ্ট যুক্তিসঙ্গত সীমাবদ্ধতা অনুমোদন করে।</tspan></text></svg>