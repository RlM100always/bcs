<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="669" viewBox="0 0 420 669" role="img" aria-labelledby="title desc"><title id="title">সংবিধান সংশোধনের প্রক্রিয়া</title><desc id="desc">Article 142 • judicial decisions must be read too</desc><rect width="420" height="669" rx="16" fill="#f8fafc"/><rect width="420" height="112" rx="16" fill="#123047"/><rect y="68" width="420" height="22" fill="#123047"/><text x="22" y="27" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#bfdbfe">BCS WRITTEN • BANGLADESH AFFAIRS</text><text x="22" y="53" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff"><tspan x="22" dy="0">সংবিধান সংশোধনের প্রক্রিয়া</tspan></text><text x="22" y="65" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="10.5" fill="#dbeafe"><tspan x="22" dy="0">Article 142 • judicial decisions must be</tspan><tspan x="22" dy="13">read too</tspan></text><rect x="20" y="112" width="380" height="87" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="136" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">ধাপ ১ — সংশোধনী বিল</tspan></text><text x="38" y="157" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">বিলের long title-এ সংবিধান সংশোধনের বিষয়টি স্পষ্ট</tspan><tspan x="38" dy="16">থাকতে হবে।</tspan></text><rect x="20" y="211" width="380" height="87" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="235" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">ধাপ ২ — সংসদে বিশেষ সংখ্যাগরিষ্ঠতা</tspan></text><text x="38" y="256" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">মোট সংসদ-সদস্যের অন্তত দুই-তৃতীয়াংশ ভোটে বিল</tspan><tspan x="38" dy="16">পাসের শর্ত Article 142-এ রয়েছে।</tspan></text><rect x="20" y="310" width="380" height="87" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="334" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">ধাপ ৩ — রাষ্ট্রপতির সম্মতি</tspan></text><text x="38" y="355" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">Article 142-এর পাঠ অনুযায়ী রাষ্ট্রপতির সম্মতির</tspan><tspan x="38" dy="16">জন্য ৭ দিনের বিধান আছে।</tspan></text><rect x="20" y="409" width="380" height="119" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="433" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">ধাপ ৪ — বিশেষ বিষয়ে গণভোট</tspan></text><text x="38" y="454" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">পঞ্চদশ সংশোধনীর গণভোট-সংক্রান্ত অংশ আদালত বাতিল</tspan><tspan x="38" dy="16">করে আগের বিধান পুনর্বহাল করেছে; প্রস্তাবনা ও</tspan><tspan x="38" dy="16">Articles 8, 48, 56-এ সংশোধনের ক্ষেত্রে প্রযোজ্য</tspan><tspan x="38" dy="16">বিধান পড়তে হবে।</tspan></text><rect x="20" y="540" width="380" height="103" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="564" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">ধাপ ৫ — Basic Structure review</tspan></text><text x="38" y="585" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">সংশোধনী সংখ্যাগরিষ্ঠতায় পাস হলেও সংবিধানের মৌলিক</tspan><tspan x="38" dy="16">কাঠামো ও আদালতের বাধ্যতামূলক রায় উপেক্ষা করা যায়</tspan><tspan x="38" dy="16">না।</tspan></text></svg>