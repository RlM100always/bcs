<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="627" viewBox="0 0 420 627" role="img" aria-labelledby="title desc"><title id="title">২০ নম্বরের সংবিধান-প্রবন্ধ লেখার ছক</title><desc id="desc">Explain • analyse • evaluate • recommend</desc><rect width="420" height="627" rx="16" fill="#f8fafc"/><rect width="420" height="118" rx="16" fill="#123047"/><rect y="68" width="420" height="22" fill="#123047"/><text x="22" y="27" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#bfdbfe">BCS WRITTEN • BANGLADESH AFFAIRS</text><text x="22" y="53" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff"><tspan x="22" dy="0">২০ নম্বরের সংবিধান-প্রবন্ধ</tspan><tspan x="22" dy="20">লেখার ছক</tspan></text><text x="22" y="99" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="10.5" fill="#dbeafe"><tspan x="22" dy="0">Explain • analyse • evaluate • recommend</tspan></text><rect x="20" y="118" width="380" height="87" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="142" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">১. ভূমিকা ও সংজ্ঞা</tspan></text><text x="38" y="163" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">প্রশ্নের মূল শব্দ ব্যাখ্যা করুন; সংবিধানের</tspan><tspan x="38" dy="16">প্রাসঙ্গিক অনুচ্ছেদ দিয়ে বিষয়টি স্থাপন করুন।</tspan></text><rect x="20" y="217" width="380" height="87" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="241" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">২. আইনগত ভিত্তি</tspan></text><text x="38" y="262" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">সঠিক Article/Part/Amendment এবং প্রযোজ্য আদালতের</tspan><tspan x="38" dy="16">রায়ের উল্লেখ দিন।</tspan></text><rect x="20" y="316" width="380" height="87" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="340" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">৩. বিশ্লেষণ</tspan></text><text x="38" y="361" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">ঐতিহাসিক প্রেক্ষাপট, উদ্দেশ্য, ক্ষমতা, সীমাবদ্ধতা</tspan><tspan x="38" dy="16">এবং বাস্তব প্রয়োগ ব্যাখ্যা করুন।</tspan></text><rect x="20" y="415" width="380" height="87" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="439" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">৪. সমালোচনামূলক মূল্যায়ন</tspan></text><text x="38" y="460" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">সুশাসন, জবাবদিহি, অধিকার, নির্বাচন, স্বাধীন বিচার</tspan><tspan x="38" dy="16">বিভাগ ও প্রতিষ্ঠানগত ভারসাম্যের দিক বিবেচনা করুন।</tspan></text><rect x="20" y="514" width="380" height="87" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="538" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">৫. সুপারিশ ও উপসংহার</tspan></text><text x="38" y="559" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">আইনানুগ, বাস্তবসম্মত সুপারিশ দিন; প্রমাণ ছাড়া</tspan><tspan x="38" dy="16">রাজনৈতিক বক্তব্যকে তথ্য হিসেবে লিখবেন না।</tspan></text></svg>