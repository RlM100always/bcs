<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="721" viewBox="0 0 420 721" role="img" aria-labelledby="title desc"><title id="title">সাম্প্রতিক সাংবিধানিক রায়ের সময়রেখা</title><desc id="desc">পরীক্ষার জন্য আইনপাঠ ও আদালতের রায় মিলিয়ে পড়ুন</desc><rect width="420" height="721" rx="16" fill="#f8fafc"/><rect width="420" height="132" rx="16" fill="#123047"/><rect y="68" width="420" height="22" fill="#123047"/><text x="22" y="27" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#bfdbfe">BCS WRITTEN • BANGLADESH AFFAIRS</text><text x="22" y="53" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff"><tspan x="22" dy="0">সাম্প্রতিক সাংবিধানিক রায়ের</tspan><tspan x="22" dy="20">সময়রেখা</tspan></text><text x="22" y="99" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="10.5" fill="#dbeafe"><tspan x="22" dy="0">পরীক্ষার জন্য আইনপাঠ ও আদালতের রায় মিলিয়ে</tspan><tspan x="22" dy="13">পড়ুন</tspan></text><rect x="20" y="132" width="380" height="103" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="156" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">২০১৭ — ১৬তম সংশোধনী</tspan></text><text x="38" y="177" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">সুপ্রিম কোর্ট বিচারপতি অপসারণে সংসদীয় ব্যবস্থার</tspan><tspan x="38" dy="16">১৬তম সংশোধনী অসাংবিধানিক ঘোষণা করে; Supreme</tspan><tspan x="38" dy="16">Judicial Council পদ্ধতি পুনর্বহাল হয়।</tspan></text><rect x="20" y="247" width="380" height="103" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="271" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">১৭ ডিসেম্বর ২০২৪ — ১৫তম সংশোধনী</tspan></text><text x="38" y="292" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">হাইকোর্ট ১৫তম সংশোধনীর কিছু অংশ—caretaker বাতিল,</tspan><tspan x="38" dy="16">referendum repeal, Articles 7A/7B-সহ—অসাংবিধানিক</tspan><tspan x="38" dy="16">ঘোষণা করে; পুরো সংশোধনী বাতিল করেনি।</tspan></text><rect x="20" y="362" width="380" height="119" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="386" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">২০ নভেম্বর ২০২৫ — ১৩তম সংশোধনী</tspan></text><text x="38" y="407" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">আপিল বিভাগ caretaker government-সংক্রান্ত ১৩তম</tspan><tspan x="38" dy="16">সংশোধনী পুনর্বহাল করে; বিধানগুলো পরবর্তী সংসদ</tspan><tspan x="38" dy="16">ভাঙার সাংবিধানিক পরিস্থিতি না আসা পর্যন্ত dormant</tspan><tspan x="38" dy="16">থাকে বলে রায়ে বলা হয়।</tspan></text><rect x="20" y="493" width="380" height="87" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="517" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">৯ জুলাই ২০২৬ — ১৫তম সংশোধনী</tspan></text><text x="38" y="538" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">BSS-এর প্রতিবেদন অনুযায়ী আপিল বিভাগ ১৫তম সংশোধনীর</tspan><tspan x="38" dy="16">আংশিক অবৈধতা-সংক্রান্ত হাইকোর্টের রায় বহাল রাখে।</tspan></text><rect x="20" y="592" width="380" height="103" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="616" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">পরীক্ষার সতর্কতা</tspan></text><text x="38" y="637" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">সরকারি consolidated Constitution text-এ পুরোনো</tspan><tspan x="38" dy="16">সংশোধিত শব্দ দেখা যেতে পারে; সংশ্লিষ্ট Supreme</tspan><tspan x="38" dy="16">Court judgment-ও পড়তে হবে।</tspan></text></svg>