<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="591" viewBox="0 0 420 591" role="img" aria-labelledby="title desc"><title id="title">রাষ্ট্রের তিন অঙ্গ</title><desc id="desc">Separation of powers • checks and balances</desc><rect width="420" height="591" rx="16" fill="#f8fafc"/><rect width="420" height="98" rx="16" fill="#123047"/><rect y="68" width="420" height="22" fill="#123047"/><text x="22" y="27" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#bfdbfe">BCS WRITTEN • BANGLADESH AFFAIRS</text><text x="22" y="53" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff"><tspan x="22" dy="0">রাষ্ট্রের তিন অঙ্গ</tspan></text><text x="22" y="79" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="10.5" fill="#dbeafe"><tspan x="22" dy="0">Separation of powers • checks and balances</tspan></text><rect x="20" y="98" width="380" height="103" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="122" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">আইনসভা — জাতীয় সংসদ</tspan><tspan></tspan></text><text x="38" y="143" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">Articles 65–93: আইন প্রণয়ন, বাজেট অনুমোদন,</tspan><tspan x="38" dy="16">নির্বাহীকে প্রশ্ন/আলোচনার মাধ্যমে জবাবদিহির আওতায়</tspan><tspan x="38" dy="16">আনা।</tspan></text><rect x="20" y="213" width="380" height="103" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="237" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">নির্বাহী — রাষ্ট্রপতি ও মন্ত্রিসভা</tspan><tspan></tspan></text><text x="38" y="258" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">Articles 48–64: রাষ্ট্রীয় কার্য পরিচালনা; সংসদীয়</tspan><tspan x="38" dy="16">ব্যবস্থায় প্রধানমন্ত্রী ও মন্ত্রিসভা কার্যকর</tspan><tspan x="38" dy="16">নির্বাহী নেতৃত্ব দেয়।</tspan></text><rect x="20" y="328" width="380" height="122" rx="12" fill="#eaf3ff" stroke="#7c9bb8" stroke-width="1.2"/><text x="38" y="352" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">বিচার বিভাগ — সুপ্রিম কোর্ট ও অধস্তন</tspan><tspan x="38" dy="18">আদালত</tspan><tspan></tspan></text><text x="38" y="391" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">Articles 94–117: বিচার, সাংবিধানিক ব্যাখ্যা,</tspan><tspan x="38" dy="16">বিচারিক পর্যালোচনা এবং মৌলিক অধিকার রক্ষায়</tspan><tspan x="38" dy="16">ভূমিকা।</tspan></text><rect x="20" y="462" width="380" height="103" rx="12" fill="#f0fdf4" stroke="#7bb99a" stroke-width="1.2"/><text x="38" y="486" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#123047"><tspan x="38" dy="0">ভারসাম্যের যুক্তি</tspan><tspan></tspan></text><text x="38" y="507" font-family="Noto Sans Bengali, Noto Sans, Arial, sans-serif" font-size="12" fill="#334155"><tspan x="38" dy="0">ক্ষমতার বিভাজন মানে সম্পূর্ণ বিচ্ছিন্নতা নয়;</tspan><tspan x="38" dy="16">সাংবিধানিক সীমা, জবাবদিহি ও বিচারিক পর্যালোচনার</tspan><tspan x="38" dy="16">মাধ্যমে ক্ষমতার অপব্যবহার নিয়ন্ত্রণ।</tspan></text></svg>