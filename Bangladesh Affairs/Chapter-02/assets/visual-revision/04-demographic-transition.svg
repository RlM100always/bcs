<text x="180" y="515" text-anchor="middle" fill="#334155" font-size="15">প্রাথমিক</text><text x="385" y="515" text-anchor="middle" fill="#334155" font-size="15">মৃত্যুহার কমে</text><text x="600" y="515" text-anchor="middle" fill="#334155" font-size="15">জন্মহার কমে</text><text x="815" y="515" text-anchor="middle" fill="#334155" font-size="15">বৃদ্ধি ধীর</text>
