<text x="50" y="105" fill="#dbeafe" font-family="Noto Sans Bengali, Noto Sans, sans-serif" font-size="19">ধারণাগত মডেল; বাংলাদেশের সব অঞ্চল একই পর্যায়ে নয়</text>

