<text x="50" y="660" fill="#334155" font-family="Noto Sans Bengali, Noto Sans, sans-serif" font-size="15">এটি তত্ত্বের ব্যাখ্যামূলক চিত্র, বাংলাদেশের জন্ম-মৃত্যুহারের বাস্তব data chart নয়.</text>
