<line x1="48" y1="628" x2="952" y2="628" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="660" fill="#334155" font-family="Noto Sans Bengali, Noto Sans, sans-serif" font-size="15">উৎস: BBS Census 2022 National Report; BBS SVRS 2023. গণনাকৃত ও adjusted মোট এক নয়.</text>
