<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450"><rect width="900" height="450" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">অন্তর্ভুক্তিমূলক উন্নয়নের রোডম্যাপ</text><g font-family="sans-serif" text-anchor="middle"><rect x="65" y="95" width="230" height="82" rx="14" fill="#dbeafe" stroke="#7aa7d9"/><text x="180" y="128" font-size="20" font-weight="700" fill="#173e68">উৎপাদনশীল কাজ</text><text x="180" y="153" font-size="15" fill="#173e68">দক্ষতা • বৈচিত্র্য</text><rect x="335" y="95" width="230" height="82" rx="14" fill="#dcfce7" stroke="#86c69b"/><text x="450" y="128" font-size="20" font-weight="700" fill="#14532d">কার্যকর প্রতিষ্ঠান</text><text x="450" y="153" font-size="15" fill="#14532d">রাজস্ব • সুশাসন</text><rect x="605" y="95" width="230" height="82" rx="14" fill="#fef3c7" stroke="#e4bd55"/><text x="720" y="128" font-size="20" font-weight="700" fill="#854d0e">মানব উন্নয়ন</text><text x="720" y="153" font-size="15" fill="#854d0e">শিক্ষা • স্বাস্থ্য</text><path d="M180 177 V220 H720 V177 M450 220 V245" stroke="#64748b" stroke-width="3" fill="none"/><rect x="130" y="245" width="640" height="78" rx="16" fill="#123047"/><text x="450" y="276" font-size="22" font-weight="700" fill="#fff">সামাজিক আস্থা ও অন্তর্ভুক্তি</text><text x="450" y="302" font-size="16" fill="#e2e8f0">ন্যায্য সুযোগ • জবাবদিহি • সাংস্কৃতিক বৈচিত্র্য</text><path d="M450 323 V350" stroke="#64748b" stroke-width="3"/><rect x="190" y="350" width="520" height="65" rx="14" fill="#e2e8f0" stroke="#94a3b8"/><text x="450" y="377" font-size="20" font-weight="700" fill="#123047">ফলাফল নিয়মিত মাপুন</text><text x="450" y="400" font-size="15" fill="#334155">কাজের মান • দারিদ্র্য • বৈষম্য • পরিবেশ</text></g></svg>