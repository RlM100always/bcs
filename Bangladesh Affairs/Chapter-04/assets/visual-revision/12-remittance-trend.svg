<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Bangladesh workers' remittance inflows, FY2019–20 to FY2024–25</title><desc id="desc">Bangladesh Bank reports remittance in US$ billion: FY2019–20 18.205, FY2020–21 24.778, FY2021–22 21.032, FY2022–23 21.611, FY2023–24 23.912, FY2024–25 30.329.</desc><rect width="1000" height="590" rx="24" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Workers’ Remittance to Bangladesh</text><text x="500" y="76" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">Fiscal year · US$ billion • Bangladesh Bank Statistics Department</text><g stroke="#cbd5e1" stroke-width="1"><path d="M100 440 H920 M100 365 H920 M100 290 H920 M100 215 H920 M100 140 H920"/></g><g font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="end"><text x="88" y="445">0</text><text x="88" y="370">10</text><text x="88" y="295">20</text><text x="88" y="220">30</text><text x="88" y="145">40</text></g><path d="M100 140 V440 H920" stroke="#64748b" stroke-width="2" fill="none"/><g fill="#2563eb"><rect x="145" y="303.5" width="72" height="136.5" rx="6"/><rect x="275" y="254.2" width="72" height="185.8" rx="6"/><rect x="405" y="282.3" width="72" height="157.7" rx="6"/><rect x="535" y="278.0" width="72" height="162.0" rx="6"/><rect x="665" y="260.7" width="72" height="179.3" rx="6"/><rect x="795" y="212.5" width="72" height="227.5" rx="6"/></g><g font-family="sans-serif" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle"><text x="181" y="288">18.21</text><text x="311" y="239">24.78</text><text x="441" y="267">21.03</text><text x="571" y="263">21.61</text><text x="701" y="246">23.91</text><text x="831" y="198">30.33</text></g><g font-family="sans-serif" font-size="15" fill="#334155" text-anchor="middle"><text x="181" y="466">2019–20</text><text x="311" y="466">2020–21</text><text x="441" y="466">2021–22</text><text x="571" y="466">2022–23</text><text x="701" y="466">2023–24</text><text x="831" y="466">2024–25</text></g><rect x="100" y="500" width="820" height="56" rx="13" fill="#dbeafe" stroke="#93c5fd"/><text x="510" y="524" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">FY2024–25 reached about US$30.33 billion.</text><text x="510" y="545" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e3a8a">Remittances support households and foreign-exchange supply; effects differ across families.</text></svg>