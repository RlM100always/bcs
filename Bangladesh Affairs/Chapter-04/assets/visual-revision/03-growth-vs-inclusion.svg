<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><rect width="900" height="420" rx="24" fill="#f8fafc"/><text x="450" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">প্রবৃদ্ধি ও অন্তর্ভুক্তিমূলক উন্নয়ন</text><rect x="65" y="95" width="345" height="235" rx="18" fill="#dbeafe" stroke="#7aa7d9"/><rect x="490" y="95" width="345" height="235" rx="18" fill="#dcfce7" stroke="#86c69b"/><g font-family="sans-serif" fill="#173e68"><text x="237" y="137" text-anchor="middle" font-size="23" font-weight="700">অর্থনৈতিক প্রবৃদ্ধি</text><text x="95" y="183" font-size="18">• বাস্তব GDP বৃদ্ধি</text><text x="95" y="222" font-size="18">• উৎপাদন ও বিনিয়োগ</text><text x="95" y="261" font-size="18">• গড় আয়</text><text x="237" y="302" text-anchor="middle" font-size="16" font-style="italic">বণ্টন সরাসরি বোঝায় না</text></g><g font-family="sans-serif" fill="#14532d"><text x="662" y="137" text-anchor="middle" font-size="23" font-weight="700">অন্তর্ভুক্তিমূলক উন্নয়ন</text><text x="520" y="183" font-size="18">• মানসম্মত কাজ</text><text x="520" y="222" font-size="18">• শিক্ষা ও স্বাস্থ্য</text><text x="520" y="261" font-size="18">• ন্যায্য সুযোগ ও সুরক্ষা</text><text x="662" y="302" text-anchor="middle" font-size="16" font-style="italic">কারা লাভবান তা বিবেচনা করে</text></g><text x="450" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#123047">প্রবৃদ্ধি + বণ্টন + সক্ষমতা + পরিবেশ</text></svg>