<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Bangladesh RMG export earnings, FY2019–20 to FY2024–25</title><desc id="desc">BGMEA reported RMG exports in US$ billion: 27.95, 31.46, 42.61, 38.14, 36.15, and 39.35 respectively. RMG share of total exports: 83.00, 81.16, 81.82, 82.15, 81.29, and 81.49 percent.</desc><rect width="1000" height="590" rx="24" fill="#fff"/><text x="500" y="45" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Bangladesh RMG Export Earnings</text><text x="500" y="76" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">Fiscal year · US$ billion • BGMEA comparative export table</text><g stroke="#e2e8f0" stroke-width="1"><path d="M100 440 H920 M100 365 H920 M100 290 H920 M100 215 H920 M100 140 H920"/></g><g font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="end"><text x="88" y="445">0</text><text x="88" y="370">10</text><text x="88" y="295">20</text><text x="88" y="220">30</text><text x="88" y="145">40</text></g><path d="M100 140 V440 H920" stroke="#64748b" stroke-width="2" fill="none"/><g fill="#0f766e"><rect x="145" y="230.4" width="72" height="209.6" rx="6"/><rect x="275" y="204.1" width="72" height="235.9" rx="6"/><rect x="405" y="120.4" width="72" height="319.6" rx="6"/><rect x="535" y="154.0" width="72" height="286.0" rx="6"/><rect x="665" y="169.0" width="72" height="271.0" rx="6"/><rect x="795" y="145.0" width="72" height="295.0" rx="6"/></g><g font-family="sans-serif" font-size="16" font-weight="700" fill="#115e59" text-anchor="middle"><text x="181" y="215">27.95</text><text x="311" y="189">31.46</text><text x="441" y="105">42.61</text><text x="571" y="139">38.14</text><text x="701" y="154">36.15</text><text x="831" y="130">39.35</text></g><g font-family="sans-serif" font-size="15" fill="#334155" text-anchor="middle"><text x="181" y="466">2019–20</text><text x="311" y="466">2020–21</text><text x="441" y="466">2021–22</text><text x="571" y="466">2022–23*</text><text x="701" y="466">2023–24*</text><text x="831" y="466">2024–25</text></g><text x="500" y="505" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">RMG share of total exports remained around 81–83%.</text><text x="500" y="532" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">Share: 83.00% · 81.16% · 81.82% · 82.15% · 81.29% · 81.49%</text><text x="500" y="558" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">*BGMEA table marks FY2022–23 and FY2023–24 as revised. Values are rounded.</text></svg>