<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="24" fill="#f8fafc"/><text x="550" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">BCS Written: Evidence-Based Answer Framework</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="130" width="220" height="125" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="155" y="170" font-size="22" font-weight="700">1. Claim</text><text x="155" y="202" font-size="16">Define + answer</text><text x="155" y="225" font-size="16">the question</text><path d="M265 192 H300" stroke="#475569" stroke-width="3"/><path d="M290 182 L303 192 L290 202" fill="none" stroke="#475569" stroke-width="3"/><rect x="305" y="130" width="220" height="125" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="415" y="170" font-size="22" font-weight="700">2. Evidence</text><text x="415" y="202" font-size="16">BBS / official report</text><text x="415" y="225" font-size="16">year + measure</text><path d="M525 192 H560" stroke="#475569" stroke-width="3"/><path d="M550 182 L563 192 L550 202" fill="none" stroke="#475569" stroke-width="3"/><rect x="565" y="130" width="220" height="125" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="675" y="170" font-size="22" font-weight="700">3. Analysis</text><text x="675" y="202" font-size="16">Causes + impact</text><text x="675" y="225" font-size="16">+ trade-offs</text><path d="M785 192 H820" stroke="#475569" stroke-width="3"/><path d="M810 182 L823 192 L810 202" fill="none" stroke="#475569" stroke-width="3"/><rect x="825" y="130" width="230" height="125" rx="16" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="940" y="170" font-size="22" font-weight="700">4. Reform</text><text x="940" y="202" font-size="16">Who does what</text><text x="940" y="225" font-size="16">+ measure results</text><path d="M940 255 V305 H550 V340" fill="none" stroke="#475569" stroke-width="3"/><path d="M540 330 L550 345 L560 330" fill="none" stroke="#475569" stroke-width="3"/><rect x="220" y="350" width="660" height="90" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="550" y="386" font-size="23" font-weight="700">5. Balanced conclusion</text><text x="550" y="414" font-size="17">Return to the prompt and state realistic priorities</text><text x="550" y="500" font-size="17" fill="#52606d">Adapt the framework to “analyse”, “evaluate”, “compare” or “recommend”.</text></g></svg>