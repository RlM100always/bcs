<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580"><rect width="1100" height="580" rx="24" fill="#f8fafc"/><text x="550" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">Economic Growth ≠ Inclusive Development</text><g font-family="Arial"><rect x="65" y="95" width="455" height="350" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="292" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">Economic growth</text><text x="105" y="195" font-size="19" fill="#243b53">• Real GDP/output rises</text><text x="105" y="240" font-size="19" fill="#243b53">• Investment and production</text><text x="105" y="285" font-size="19" fill="#243b53">• Exports and productivity</text><text x="105" y="350" font-size="16" fill="#486581">Necessary, but jobs and benefits</text><text x="105" y="375" font-size="16" fill="#486581">may be unevenly distributed.</text><rect x="580" y="95" width="455" height="350" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="807" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#047857">Inclusive development</text><text x="620" y="195" font-size="19" fill="#243b53">• Decent work and fair opportunity</text><text x="620" y="240" font-size="19" fill="#243b53">• Education and health outcomes</text><text x="620" y="285" font-size="19" fill="#243b53">• Lower poverty and exclusion</text><text x="620" y="330" font-size="19" fill="#243b53">• Voice, safety and resilience</text><text x="620" y="375" font-size="16" fill="#486581">Needs deliberate policy and</text><text x="620" y="398" font-size="16" fill="#486581">accountability.</text><rect x="160" y="475" width="780" height="65" rx="15" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="550" y="502" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3412">Measure both</text><text x="550" y="526" text-anchor="middle" font-size="16" fill="#9a3412">GDP + jobs + wages + poverty + learning + health + inequality</text></g></svg>