<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">সাহিত্য ও সংস্কৃতির পরিসর</text><g font-family="sans-serif" text-anchor="middle"><rect x="65" y="100" width="235" height="100" rx="15" fill="#dbeafe" stroke="#7aa7d9"/><text x="182" y="140" font-size="22" font-weight="700" fill="#173e68">সাহিত্য</text><text x="182" y="170" font-size="16" fill="#173e68">কবিতা • গল্প • উপন্যাস</text><rect x="333" y="100" width="235" height="100" rx="15" fill="#fef3c7" stroke="#e4bd55"/><text x="450" y="140" font-size="22" font-weight="700" fill="#854d0e">সংগীত ও নাটক</text><text x="450" y="170" font-size="16" fill="#854d0e">স্মৃতি • প্রতিবাদ • লোকধারা</text><rect x="600" y="100" width="235" height="100" rx="15" fill="#f3e8ff" stroke="#b69ad9"/><text x="717" y="140" font-size="22" font-weight="700" fill="#6b21a8">চলচ্চিত্র ও শিল্প</text><text x="717" y="170" font-size="16" fill="#6b21a8">সমাজ • ইতিহাস • পরিচয়</text><path d="M182 200 V245 H717 V200 M450 245 V270" stroke="#64748b" stroke-width="3" fill="none"/><rect x="140" y="270" width="620" height="100" rx="18" fill="#123047"/><text x="450" y="308" font-size="22" font-weight="700" fill="#fff">জাতীয় স্মৃতি ও বহুত্ববাদী পরিচয়</text><text x="450" y="338" font-size="17" fill="#e2e8f0">ভাষা • মুক্তিযুদ্ধ • আঞ্চলিক ঐতিহ্য • বহু ভাষা</text></g><text x="450" y="405" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">সংরক্ষণ + সৃজনশীল স্বাধীনতা + অন্তর্ভুক্তি</text></svg>