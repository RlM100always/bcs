<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">RTI to accountability</title><desc id="d">A citizen identifies information, submits a request to the designated authority, receives a lawful response, reviews it or appeals if necessary, and uses information for accountability.</desc><rect width="1000" height="520" rx="24" fill="#fff"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">RTI → Transparency → Accountability</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="125" width="250" height="85" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180" y="160" font-size="21" font-weight="700" fill="#1e3a8a">1. Identify information</text><text x="180" y="188" font-size="16" fill="#1e3a8a">Specific, clear request</text><rect x="375" y="125" width="250" height="85" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="500" y="160" font-size="21" font-weight="700" fill="#14532d">2. Submit request</text><text x="500" y="188" font-size="16" fill="#14532d">Responsible authority</text><rect x="695" y="125" width="250" height="85" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="820" y="160" font-size="21" font-weight="700" fill="#78350f">3. Lawful response</text><text x="820" y="188" font-size="16" fill="#78350f">Disclosure / reasoned decision</text><g stroke="#64748b" stroke-width="3" fill="none"><path d="M305 167 H375"/><path d="M625 167 H695"/><path d="M820 210 V285 H500"/><path d="M500 285 V330"/></g><rect x="310" y="330" width="380" height="75" rx="16" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="500" y="360" font-size="21" font-weight="700" fill="#581c87">4. Review / appeal if needed</text><text x="500" y="387" font-size="16" fill="#581c87">Follow applicable law and deadlines</text><path d="M500 405 V435" stroke="#64748b" stroke-width="3"/><rect x="250" y="435" width="500" height="55" rx="14" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="500" y="470" font-size="21" font-weight="700" fill="#164e63">5. Evidence-informed public accountability</text></g></svg>