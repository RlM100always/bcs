<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Cybersecurity and privacy by design</title><desc id="d">A lifecycle showing collect minimum data, define purpose, restrict access, encrypt and log, retain only as needed, delete securely and respond to incidents.</desc><rect width="1200" height="600" rx="28" fill="#f7f9fc"/><text x="55" y="60" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#14283f">Privacy and cybersecurity by design</text><text x="55" y="92" font-size="17" font-family="Arial,sans-serif" fill="#526579">Security is a lifecycle, not a final checkbox.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="150" width="300" height="100" rx="18" fill="#dceeff" stroke="#4d87bd" stroke-width="2"/><text x="220" y="187" font-size="20" font-weight="700" fill="#143a5a">1. Collect less</text><text x="220" y="216" font-size="16" fill="#143a5a">purpose limitation • consent/legal basis</text><rect x="450" y="150" width="300" height="100" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="600" y="187" font-size="20" font-weight="700" fill="#13584f">2. Protect access</text><text x="600" y="216" font-size="16" fill="#13584f">least privilege • MFA • encryption</text><rect x="830" y="150" width="300" height="100" rx="18" fill="#fff0ca" stroke="#d6a23a" stroke-width="2"/><text x="980" y="187" font-size="20" font-weight="700" fill="#78530b">3. Monitor</text><text x="980" y="216" font-size="16" fill="#78530b">logs • backups • anomaly alerts</text><path d="M370 200 H450 M750 200 H830" stroke="#9aabba" stroke-width="4"/><path d="M980 250 V315 H600 V350" stroke="#9aabba" stroke-width="4" fill="none"/><rect x="340" y="350" width="520" height="95" rx="18" fill="#14283f"/><text x="600" y="388" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4. Retain only as needed</text><text x="600" y="417" font-family="Arial,sans-serif" font-size="16" fill="#dce7f2" text-anchor="middle">retention schedule • secure deletion • access audit</text><path d="M600 445 V475" stroke="#9aabba" stroke-width="4"/><rect x="140" y="475" width="920" height="70" rx="18" fill="#fce4e4" stroke="#d36b6b" stroke-width="2"/><text x="600" y="505" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#8b2c2c" text-anchor="middle">5. Prepare for incidents</text><text x="600" y="528" font-family="Arial,sans-serif" font-size="16" fill="#8b2c2c" text-anchor="middle">contain • preserve evidence • notify as required • restore • learn</text></g></svg>