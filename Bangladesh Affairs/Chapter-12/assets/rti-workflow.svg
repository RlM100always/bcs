<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Bangladesh Right to Information workflow</title><desc id="d">RTI workflow: identify public authority and records, submit request to designated officer, authority processes under law, response or lawful exception, then review or complaint routes as prescribed by the law.</desc><rect width="1200" height="620" rx="28" fill="#f7f9fc"/><text x="55" y="60" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#14283f">RTI in practice: from request to remedy</text><text x="55" y="92" font-size="17" font-family="Arial,sans-serif" fill="#526579">Study aid, not legal advice • follow the current official Bengali text and applicable rules.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="145" width="220" height="100" rx="18" fill="#dceeff" stroke="#4d87bd" stroke-width="2"/><text x="165" y="183" font-size="20" font-weight="700" fill="#143a5a">1. Identify</text><text x="165" y="213" font-size="16" fill="#143a5a">authority + record</text><rect x="325" y="145" width="220" height="100" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="435" y="183" font-size="20" font-weight="700" fill="#13584f">2. Apply</text><text x="435" y="213" font-size="16" fill="#13584f">designated officer</text><rect x="595" y="145" width="220" height="100" rx="18" fill="#fff0ca" stroke="#d6a23a" stroke-width="2"/><text x="705" y="183" font-size="20" font-weight="700" fill="#78530b">3. Process</text><text x="705" y="213" font-size="16" fill="#78530b">records + legal review</text><rect x="865" y="145" width="280" height="100" rx="18" fill="#e9e5ff" stroke="#8272c7" stroke-width="2"/><text x="1005" y="183" font-size="20" font-weight="700" fill="#44377c">4. Response</text><text x="1005" y="213" font-size="16" fill="#44377c">disclose or state lawful grounds</text><g stroke="#9aabba" stroke-width="4" fill="none"><path d="M275 195 H325"/><path d="M545 195 H595"/><path d="M815 195 H865"/></g><path d="M1005 245 V300 H705 V340" stroke="#9aabba" stroke-width="4" fill="none"/><rect x="490" y="340" width="430" height="95" rx="18" fill="#14283f"/><text x="705" y="378" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">If refused / delayed / disputed</text><text x="705" y="408" font-size="16" font-family="Arial,sans-serif" fill="#dce7f2" text-anchor="middle">use statutory review / complaint routes</text><path d="M705 435 V475 H300" stroke="#9aabba" stroke-width="4" fill="none"/><rect x="55" y="475" width="490" height="90" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="300" y="510" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13584f" text-anchor="middle">Proactive disclosure</text><text x="300" y="538" font-family="Arial,sans-serif" font-size="16" fill="#13584f" text-anchor="middle">publish catalogues, indexes and public information</text><rect x="650" y="475" width="495" height="90" rx="18" fill="#fff0ca" stroke="#d6a23a" stroke-width="2"/><text x="897" y="510" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#78530b" text-anchor="middle">Records + privacy safeguards</text><text x="897" y="538" font-family="Arial,sans-serif" font-size="16" fill="#78530b" text-anchor="middle">preserve records; assess lawful exceptions carefully</text></g><text x="55" y="595" font-family="Arial,sans-serif" font-size="14" fill="#526579">Primary legal source: Right to Information Act, 2009, especially sections 4–5 and the applicable request/review provisions.</text></svg>