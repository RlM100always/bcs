<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Information ecosystem and accountability</title><desc id="d">Public information moves between public authorities, journalists, citizens, civil society and digital platforms; RTI, media ethics, corrections and feedback create accountability.</desc><rect width="1200" height="600" rx="28" fill="#f7f9fc"/><text x="55" y="60" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#14283f">Information ecosystem: access + scrutiny + response</text><text x="55" y="92" font-size="17" font-family="Arial,sans-serif" fill="#526579">No single actor guarantees trustworthy information; institutions and feedback loops matter.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="440" y="145" width="320" height="90" rx="18" fill="#14283f"/><text x="600" y="181" font-size="22" font-weight="700" fill="#ffffff">Public authorities</text><text x="600" y="209" font-size="16" fill="#dce7f2">records • decisions • service data</text><rect x="65" y="300" width="245" height="100" rx="18" fill="#dceeff" stroke="#4d87bd" stroke-width="2"/><text x="187" y="340" font-size="21" font-weight="700" fill="#143a5a">RTI &amp; disclosure</text><text x="187" y="370" font-size="16" fill="#143a5a">lawful public access</text><rect x="350" y="300" width="245" height="100" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="472" y="340" font-size="21" font-weight="700" fill="#13584f">Journalism</text><text x="472" y="370" font-size="16" fill="#13584f">verify • explain • scrutinise</text><rect x="635" y="300" width="245" height="100" rx="18" fill="#fff0ca" stroke="#d6a23a" stroke-width="2"/><text x="757" y="340" font-size="21" font-weight="700" fill="#78530b">Digital platforms</text><text x="757" y="370" font-size="16" fill="#78530b">speed • reach • risk</text><rect x="920" y="300" width="215" height="100" rx="18" fill="#e9e5ff" stroke="#8272c7" stroke-width="2"/><text x="1027" y="340" font-size="21" font-weight="700" fill="#44377c">Citizens</text><text x="1027" y="370" font-size="16" fill="#44377c">participate • respond</text><path d="M440 190 H187 V300 M600 235 V270 H472 V300 M600 235 V270 H757 V300 M760 190 H1027 V300" stroke="#9aabba" stroke-width="3" fill="none"/><rect x="160" y="455" width="880" height="80" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="600" y="486" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13584f" text-anchor="middle">Trust loop</text><text x="600" y="514" font-family="Arial,sans-serif" font-size="16" fill="#13584f" text-anchor="middle">verification • correction • transparent decisions • complaints resolved • public feedback</text></g></svg>