<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Digital divide: causes and remedies</title><desc id="d">Four access barriers—connectivity, affordability, skills and accessible design—connect to inclusive policy actions and measurable outcomes.</desc><rect width="1200" height="600" rx="28" fill="#f7f9fc"/><text x="55" y="60" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#14283f">Closing the digital divide</text><text x="55" y="92" font-size="17" font-family="Arial,sans-serif" fill="#526579">Access is more than signal coverage: people must be able to afford, understand and use a service.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="145" width="245" height="120" rx="18" fill="#dceeff" stroke="#4d87bd" stroke-width="2"/><text x="177" y="183" font-size="21" font-weight="700" fill="#143a5a">Connectivity</text><text x="177" y="213" font-size="16" fill="#143a5a">rural coverage • reliable power</text><text x="177" y="238" font-size="16" fill="#143a5a">network resilience</text><rect x="335" y="145" width="245" height="120" rx="18" fill="#fff0ca" stroke="#d6a23a" stroke-width="2"/><text x="457" y="183" font-size="21" font-weight="700" fill="#78530b">Affordability</text><text x="457" y="213" font-size="16" fill="#78530b">devices • data costs</text><text x="457" y="238" font-size="16" fill="#78530b">assistive technology</text><rect x="615" y="145" width="245" height="120" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="737" y="183" font-size="21" font-weight="700" fill="#13584f">Digital skills</text><text x="737" y="213" font-size="16" fill="#13584f">language • confidence</text><text x="737" y="238" font-size="16" fill="#13584f">safety • media literacy</text><rect x="895" y="145" width="245" height="120" rx="18" fill="#e9e5ff" stroke="#8272c7" stroke-width="2"/><text x="1017" y="183" font-size="21" font-weight="700" fill="#44377c">Accessibility</text><text x="1017" y="213" font-size="16" fill="#44377c">disability • age</text><text x="1017" y="238" font-size="16" fill="#44377c">Bangla • simple UX</text><path d="M177 265 V310 H600 M457 265 V310 M737 265 V310 M1017 265 V310 H600 V345" fill="none" stroke="#8fa3b7" stroke-width="4"/><rect x="250" y="345" width="700" height="90" rx="18" fill="#14283f"/><text x="600" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">Inclusive delivery package</text><text x="600" y="411" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#dce7f2">Affordable access + assisted service + training + accessible design</text><path d="M600 435 V470" stroke="#218a80" stroke-width="4"/><rect x="150" y="470" width="900" height="75" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="600" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#13584f">Measure outcomes, not just connections</text><text x="600" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#13584f">completion rate • cost/time saved • rural/gender/disability gap • user satisfaction</text></g></svg>