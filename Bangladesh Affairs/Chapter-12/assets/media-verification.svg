<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Media verification workflow</title><desc id="d">A newsroom workflow from claim received through source verification, independent corroboration, context and harm checks, publication, correction and feedback.</desc><rect width="1200" height="600" rx="28" fill="#f7f9fc"/><text x="55" y="60" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#14283f">Responsible reporting: verify before amplifying</text><text x="55" y="92" font-size="17" font-family="Arial,sans-serif" fill="#526579">A repeatable newsroom workflow for breaking news, public-interest reporting and social posts.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="150" width="200" height="100" rx="18" fill="#dceeff" stroke="#4d87bd" stroke-width="2"/><text x="155" y="190" font-size="20" font-weight="700" fill="#143a5a">1. Claim</text><text x="155" y="220" font-size="15" fill="#143a5a">Who says what?</text><rect x="295" y="150" width="200" height="100" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="395" y="190" font-size="20" font-weight="700" fill="#13584f">2. Source</text><text x="395" y="220" font-size="15" fill="#13584f">original document / witness</text><rect x="535" y="150" width="200" height="100" rx="18" fill="#fff0ca" stroke="#d6a23a" stroke-width="2"/><text x="635" y="190" font-size="20" font-weight="700" fill="#78530b">3. Corroborate</text><text x="635" y="220" font-size="15" fill="#78530b">independent evidence</text><rect x="775" y="150" width="200" height="100" rx="18" fill="#e9e5ff" stroke="#8272c7" stroke-width="2"/><text x="875" y="190" font-size="20" font-weight="700" fill="#44377c">4. Context</text><text x="875" y="220" font-size="15" fill="#44377c">date • location • harm</text><rect x="1015" y="150" width="130" height="100" rx="18" fill="#14283f"/><text x="1080" y="190" font-size="18" font-weight="700" fill="#ffffff">5. Publish</text><text x="1080" y="220" font-size="14" fill="#dce7f2">with caveats</text><g stroke="#9aabba" stroke-width="4" fill="none"><path d="M255 200 H295"/><path d="M495 200 H535"/><path d="M735 200 H775"/><path d="M975 200 H1015"/></g><path d="M1080 250 V320 H635 V360" fill="none" stroke="#9aabba" stroke-width="4"/><rect x="380" y="360" width="510" height="85" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="635" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#13584f">6. Corrections &amp; accountability</text><text x="635" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#13584f">update visibly • explain changes • protect sources</text><text x="55" y="510" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#14283f">Red flags</text><text x="55" y="540" font-family="Arial,sans-serif" font-size="16" fill="#526579">old image • cropped context • anonymous claim • manipulated media • emotional urgency • no primary source</text></svg>