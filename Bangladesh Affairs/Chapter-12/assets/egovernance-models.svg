<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">E-governance interaction models</title><desc id="d">Four government digital interaction models: G2C, G2B, G2G and G2E, with examples and enabling foundations.</desc><rect width="1200" height="600" rx="28" fill="#f7f9fc"/><text x="55" y="60" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#14283f">E-governance: four interaction models</text><text x="55" y="92" font-size="17" font-family="Arial,sans-serif" fill="#526579">Use the model to organise examples, then evaluate inclusion, security and accountability.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="145" width="250" height="150" rx="20" fill="#dceeff" stroke="#4d87bd" stroke-width="2"/><text x="180" y="185" font-size="25" font-weight="700" fill="#143a5a">G2C</text><text x="180" y="217" font-size="19" font-weight="700" fill="#143a5a">Government → Citizen</text><text x="180" y="250" font-size="16" fill="#143a5a">birth registration, certificates,</text><text x="180" y="274" font-size="16" fill="#143a5a">benefits, service tracking</text><rect x="335" y="145" width="250" height="150" rx="20" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="460" y="185" font-size="25" font-weight="700" fill="#13584f">G2B</text><text x="460" y="217" font-size="19" font-weight="700" fill="#13584f">Government → Business</text><text x="460" y="250" font-size="16" fill="#13584f">e-procurement, tax, trade</text><text x="460" y="274" font-size="16" fill="#13584f">licensing, compliance</text><rect x="615" y="145" width="250" height="150" rx="20" fill="#fff0ca" stroke="#d6a23a" stroke-width="2"/><text x="740" y="185" font-size="25" font-weight="700" fill="#78530b">G2G</text><text x="740" y="217" font-size="19" font-weight="700" fill="#78530b">Government ↔ Government</text><text x="740" y="250" font-size="16" fill="#78530b">interoperability, data exchange,</text><text x="740" y="274" font-size="16" fill="#78530b">e-files and coordination</text><rect x="895" y="145" width="250" height="150" rx="20" fill="#e9e5ff" stroke="#8272c7" stroke-width="2"/><text x="1020" y="185" font-size="25" font-weight="700" fill="#44377c">G2E</text><text x="1020" y="217" font-size="19" font-weight="700" fill="#44377c">Government → Employee</text><text x="1020" y="250" font-size="16" fill="#44377c">payroll, leave, training,</text><text x="1020" y="274" font-size="16" fill="#44377c">HR and internal workflows</text><path d="M180 295 V345 H600 M460 295 V345 M740 295 V345 H600 M1020 295 V345 H600 V375" fill="none" stroke="#9aabba" stroke-width="4"/><rect x="180" y="375" width="840" height="115" rx="20" fill="#14283f"/><text x="600" y="416" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">Shared foundations</text><text x="600" y="448" font-size="17" font-family="Arial,sans-serif" fill="#dce7f2" text-anchor="middle">identity • interoperability • accessible design • cybersecurity • records • audit trail</text><text x="600" y="474" font-size="17" font-family="Arial,sans-serif" fill="#dce7f2" text-anchor="middle">offline/assisted alternatives • grievance redressal • published service standards</text><text x="55" y="550" font-family="Arial,sans-serif" font-size="17" fill="#526579">Key test: did the service become easier, fairer and more reliable for the citizen—not merely electronic?</text></svg>