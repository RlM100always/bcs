<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="t d"><title id="t">Citizen-centred e-governance cycle</title><desc id="d">Citizen needs, accessible service design, secure digital workflow, delivery and status tracking, grievance and feedback, and evaluation feed into continuous improvement.</desc><rect width="1000" height="570" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">Citizen-Centred E-Governance Cycle</text><g font-family="sans-serif" text-anchor="middle"><rect x="350" y="85" width="300" height="65" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="124" font-size="22" font-weight="700" fill="#1e3a8a">1. Understand citizen needs</text><rect x="635" y="190" width="300" height="65" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="785" y="229" font-size="22" font-weight="700" fill="#14532d">2. Accessible service design</text><rect x="635" y="315" width="300" height="65" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="785" y="354" font-size="22" font-weight="700" fill="#78350f">3. Secure digital workflow</text><rect x="350" y="415" width="300" height="65" rx="16" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="500" y="454" font-size="22" font-weight="700" fill="#581c87">4. Deliver + track service</text><rect x="65" y="315" width="300" height="65" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="215" y="354" font-size="22" font-weight="700" fill="#7f1d1d">5. Complaint + feedback</text><rect x="65" y="190" width="300" height="65" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="215" y="229" font-size="22" font-weight="700" fill="#164e63">6. Evaluate outcomes</text><g stroke="#64748b" stroke-width="3" fill="none"><path d="M650 117 L735 190"/><path d="M785 255 V315"/><path d="M635 347 L650 415"/><path d="M350 447 L300 380"/><path d="M215 315 V255"/><path d="M365 222 L430 150"/></g><text x="500" y="525" font-size="18" font-weight="700" fill="#334155">Inclusion • Privacy • Security • Accountability</text><text x="500" y="550" font-size="15" fill="#475569">Feedback and evaluation should continuously improve the service.</text></g></svg>