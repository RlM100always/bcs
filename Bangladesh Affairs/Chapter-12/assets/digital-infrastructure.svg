<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Bangladesh digital connectivity architecture</title><desc id="d">Schematic, not to scale: international submarine cable landing stations at Cox's Bazar and Kuakata connect to domestic fibre, gateways, ISPs, mobile networks and citizen services.</desc><rect width="1200" height="640" rx="28" fill="#f5f8fc"/><text x="56" y="62" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#14283f">Bangladesh digital connectivity</text><text x="56" y="94" font-size="17" font-family="Arial,sans-serif" fill="#526579">Conceptual network • NOT a geographic map • verify current cable details with BSCPLC</text><g stroke="#a7b8ca" stroke-width="4" fill="none"><path d="M190 210 H355"/><path d="M190 330 H355"/><path d="M520 270 H640"/><path d="M805 270 H925"/><path d="M1005 340 V420 H835"/><path d="M1005 340 V420 H1045"/><path d="M835 500 V540 H590"/><path d="M1045 500 V540 H590"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="165" width="135" height="90" rx="16" fill="#dceeff" stroke="#4d87bd" stroke-width="2"/><text x="122" y="200" font-size="18" font-weight="700" fill="#143a5a">SMW4</text><text x="122" y="225" font-size="15" fill="#143a5a">Cox's Bazar</text><rect x="55" y="285" width="135" height="90" rx="16" fill="#dceeff" stroke="#4d87bd" stroke-width="2"/><text x="122" y="320" font-size="18" font-weight="700" fill="#143a5a">SMW5</text><text x="122" y="345" font-size="15" fill="#143a5a">Kuakata</text><rect x="355" y="215" width="165" height="110" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="437" y="253" font-size="19" font-weight="700" fill="#13584f">Landing &amp;</text><text x="437" y="278" font-size="19" font-weight="700" fill="#13584f">backhaul</text><text x="437" y="301" font-size="14" fill="#13584f">fibre network</text><rect x="640" y="215" width="165" height="110" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="722" y="255" font-size="19" font-weight="700" fill="#13584f">IIG / ISPs</text><text x="722" y="282" font-size="15" fill="#13584f">routing &amp; access</text><rect x="925" y="215" width="160" height="125" rx="18" fill="#fff0ca" stroke="#d6a23a" stroke-width="2"/><text x="1005" y="252" font-size="18" font-weight="700" fill="#78530b">Last-mile</text><text x="1005" y="278" font-size="17" fill="#78530b">mobile + fixed</text><text x="1005" y="302" font-size="17" fill="#78530b">broadband</text><rect x="735" y="420" width="200" height="80" rx="16" fill="#e9e5ff" stroke="#8272c7" stroke-width="2"/><text x="835" y="453" font-size="18" font-weight="700" fill="#44377c">Homes / schools</text><text x="835" y="477" font-size="15" fill="#44377c">businesses / clinics</text><rect x="955" y="420" width="180" height="80" rx="16" fill="#e9e5ff" stroke="#8272c7" stroke-width="2"/><text x="1045" y="453" font-size="18" font-weight="700" fill="#44377c">Public services</text><text x="1045" y="477" font-size="15" fill="#44377c">portals / e-services</text><rect x="350" y="540" width="480" height="55" rx="14" fill="#14283f"/><text x="590" y="574" font-size="18" font-weight="700" fill="#ffffff">Power • affordability • skills • cyber resilience</text></g><text x="56" y="615" font-size="14" font-family="Arial,sans-serif" fill="#526579">Schematic only. Sources: BSCPLC landing-station information; BTRC statistics. Do not infer geographic distances or current route details.</text></svg>