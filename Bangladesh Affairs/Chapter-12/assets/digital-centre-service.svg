<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Digital centre assisted public service</title><desc id="d">Citizen need enters an assisted local digital centre, where an entrepreneur helps identify the service, submit an application, track status and escalate complaints. Service outcome is measured by time, cost and completion.</desc><rect width="1200" height="600" rx="28" fill="#f7f9fc"/><text x="55" y="60" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#14283f">Digital Centre: assisted last-mile service</text><text x="55" y="92" font-size="17" font-family="Arial,sans-serif" fill="#526579">An inclusion model for citizens who need support to use online public and private services.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="170" width="200" height="115" rx="18" fill="#dceeff" stroke="#4d87bd" stroke-width="2"/><text x="155" y="210" font-size="21" font-weight="700" fill="#143a5a">Citizen need</text><text x="155" y="240" font-size="16" fill="#143a5a">certificate • benefit</text><text x="155" y="262" font-size="16" fill="#143a5a">land • health • ticket</text><rect x="315" y="170" width="220" height="115" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="425" y="210" font-size="21" font-weight="700" fill="#13584f">Assisted centre</text><text x="425" y="240" font-size="16" fill="#13584f">trained entrepreneur</text><text x="425" y="262" font-size="16" fill="#13584f">language / accessibility</text><rect x="595" y="170" width="220" height="115" rx="18" fill="#fff0ca" stroke="#d6a23a" stroke-width="2"/><text x="705" y="210" font-size="21" font-weight="700" fill="#78530b">Digital workflow</text><text x="705" y="240" font-size="16" fill="#78530b">apply • pay • track</text><text x="705" y="262" font-size="16" fill="#78530b">receipt • audit trail</text><rect x="875" y="170" width="270" height="115" rx="18" fill="#e9e5ff" stroke="#8272c7" stroke-width="2"/><text x="1010" y="210" font-size="21" font-weight="700" fill="#44377c">Responsible authority</text><text x="1010" y="240" font-size="16" fill="#44377c">decision • delivery</text><text x="1010" y="262" font-size="16" fill="#44377c">review / complaint route</text><g stroke="#9aabba" stroke-width="4" fill="none"><path d="M255 227 H315"/><path d="M535 227 H595"/><path d="M815 227 H875"/></g><path d="M1010 285 V350 H600 V380" stroke="#9aabba" stroke-width="4" fill="none"/><rect x="230" y="380" width="740" height="105" rx="18" fill="#14283f"/><text x="600" y="419" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">Measure service quality</text><text x="600" y="450" font-size="17" font-family="Arial,sans-serif" fill="#dce7f2" text-anchor="middle">time saved • transparent fees • successful completion • user satisfaction</text><text x="600" y="472" font-size="16" font-family="Arial,sans-serif" fill="#dce7f2" text-anchor="middle">disaggregate results by gender, disability, rurality and income where lawful</text><text x="55" y="548" font-family="Arial,sans-serif" font-size="15" fill="#526579" text-anchor="start">Source for service model and current figures: Bangladesh National Portal / Digital Centre portal. Re-check dates before citing statistics.</text></g></svg>