<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">AI safeguards in public services</title><desc id="d">AI-assisted government workflow with transparent purpose, quality data, human review, explanations, appeal, bias audit and privacy/security controls.</desc><rect width="1200" height="600" rx="28" fill="#f7f9fc"/><text x="55" y="60" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#14283f">AI in public services: safeguards first</text><text x="55" y="92" font-size="17" font-family="Arial,sans-serif" fill="#526579">AI can assist routine work; high-impact decisions need accountable human oversight.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="60" y="155" width="245" height="100" rx="18" fill="#dceeff" stroke="#4d87bd" stroke-width="2"/><text x="182" y="193" font-size="20" font-weight="700" fill="#143a5a">Purpose &amp; data</text><text x="182" y="222" font-size="16" fill="#143a5a">lawful purpose • quality</text><rect x="345" y="155" width="245" height="100" rx="18" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="467" y="193" font-size="20" font-weight="700" fill="#13584f">AI assistance</text><text x="467" y="222" font-size="16" fill="#13584f">draft • classify • flag</text><rect x="630" y="155" width="245" height="100" rx="18" fill="#fff0ca" stroke="#d6a23a" stroke-width="2"/><text x="752" y="193" font-size="20" font-weight="700" fill="#78530b">Human review</text><text x="752" y="222" font-size="16" fill="#78530b">verify • override • record</text><rect x="915" y="155" width="225" height="100" rx="18" fill="#e9e5ff" stroke="#8272c7" stroke-width="2"/><text x="1027" y="193" font-size="20" font-weight="700" fill="#44377c">Decision / service</text><text x="1027" y="222" font-size="16" fill="#44377c">reason + remedy</text><g stroke="#9aabba" stroke-width="4"><path d="M305 205 H345"/><path d="M590 205 H630"/><path d="M875 205 H915"/></g><rect x="110" y="340" width="980" height="150" rx="20" fill="#14283f"/><text x="600" y="380" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">Mandatory safeguards for public trust</text><text x="600" y="414" font-size="17" font-family="Arial,sans-serif" fill="#dce7f2" text-anchor="middle">privacy • cybersecurity • bias testing • explainability • audit trail</text><text x="600" y="443" font-size="17" font-family="Arial,sans-serif" fill="#dce7f2" text-anchor="middle">accessible human appeal • procurement transparency • continuous monitoring</text><text x="600" y="468" font-size="17" font-family="Arial,sans-serif" fill="#dce7f2" text-anchor="middle">Do not delegate final high-impact decisions to an unreviewable model.</text><text x="55" y="550" font-family="Arial,sans-serif" font-size="16" fill="#526579" text-anchor="start">BCS answer angle: efficiency is useful only when legality, fairness and redress remain enforceable.</text></g></svg>