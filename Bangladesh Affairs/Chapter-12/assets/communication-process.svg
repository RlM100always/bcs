<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Communication process</title><desc id="d">Sender encodes a message, sends it through a channel to a receiver, who decodes it and provides feedback. Noise can disrupt the process.</desc><rect width="1000" height="500" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">Communication Process</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="150" width="160" height="75" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="125" y="194" font-size="22" font-weight="700" fill="#1e3a8a">Sender</text><rect x="245" y="150" width="160" height="75" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="325" y="194" font-size="22" font-weight="700" fill="#14532d">Encoding</text><rect x="445" y="150" width="160" height="75" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="525" y="194" font-size="22" font-weight="700" fill="#78350f">Message</text><rect x="645" y="150" width="150" height="75" rx="16" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="720" y="194" font-size="22" font-weight="700" fill="#581c87">Channel</text><rect x="835" y="150" width="130" height="75" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="900" y="194" font-size="21" font-weight="700" fill="#164e63">Receiver</text><g stroke="#64748b" stroke-width="3" fill="none"><path d="M205 187 H245"/><path d="M405 187 H445"/><path d="M605 187 H645"/><path d="M795 187 H835"/><path d="M900 225 V310 H125 V225"/></g><path d="M135 240 L125 225 L115 240" fill="none" stroke="#64748b" stroke-width="3"/><rect x="360" y="285" width="280" height="60" rx="16" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="500" y="322" font-size="22" font-weight="700" fill="#0f172a">Feedback / Response</text><rect x="345" y="385" width="310" height="52" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="500" y="418" font-size="20" font-weight="700" fill="#7f1d1d">Noise: language, bias, outage</text></g><text x="500" y="475" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">Learning diagram — communication improves when feedback is understood and acted upon.</text></svg>