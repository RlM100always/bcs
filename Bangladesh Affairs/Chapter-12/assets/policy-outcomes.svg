<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Digital governance performance scorecard</title><desc id="d">A scorecard separates inputs, outputs, outcomes and public value to show why counting portals is not enough to measure e-governance.</desc><rect width="1200" height="600" rx="28" fill="#f7f9fc"/><text x="55" y="60" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#14283f">How to evaluate e-governance</text><text x="55" y="92" font-size="17" font-family="Arial,sans-serif" fill="#526579">Count what changed for citizens—not only what government launched.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="160" width="250" height="145" rx="20" fill="#dceeff" stroke="#4d87bd" stroke-width="2"/><text x="180" y="198" font-size="23" font-weight="700" fill="#143a5a">Inputs</text><text x="180" y="232" font-size="16" fill="#143a5a">budget • staff • connectivity</text><text x="180" y="258" font-size="16" fill="#143a5a">training • systems</text><text x="180" y="283" font-size="14" fill="#143a5a">What was invested?</text><rect x="335" y="160" width="250" height="145" rx="20" fill="#d6f3ee" stroke="#218a80" stroke-width="2"/><text x="460" y="198" font-size="23" font-weight="700" fill="#13584f">Outputs</text><text x="460" y="232" font-size="16" fill="#13584f">portals • digitised forms</text><text x="460" y="258" font-size="16" fill="#13584f">centres • e-files</text><text x="460" y="283" font-size="14" fill="#13584f">What was delivered?</text><rect x="615" y="160" width="250" height="145" rx="20" fill="#fff0ca" stroke="#d6a23a" stroke-width="2"/><text x="740" y="198" font-size="23" font-weight="700" fill="#78530b">Outcomes</text><text x="740" y="232" font-size="16" fill="#78530b">less time/cost • fewer errors</text><text x="740" y="258" font-size="16" fill="#78530b">higher completion</text><text x="740" y="283" font-size="14" fill="#78530b">What improved?</text><rect x="895" y="160" width="250" height="145" rx="20" fill="#e9e5ff" stroke="#8272c7" stroke-width="2"/><text x="1020" y="198" font-size="23" font-weight="700" fill="#44377c">Public value</text><text x="1020" y="232" font-size="16" fill="#44377c">fair access • trust</text><text x="1020" y="258" font-size="16" fill="#44377c">accountability • dignity</text><text x="1020" y="283" font-size="14" fill="#44377c">Who benefits?</text><g stroke="#9aabba" stroke-width="4"><path d="M305 230 H335"/><path d="M585 230 H615"/><path d="M865 230 H895"/></g><rect x="150" y="370" width="900" height="125" rx="20" fill="#14283f"/><text x="600" y="411" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">Minimum balanced dashboard</text><text x="600" y="444" font-size="17" font-family="Arial,sans-serif" fill="#dce7f2" text-anchor="middle">completion time • rejection/error rate • user cost • uptime • grievance resolution</text><text x="600" y="470" font-size="17" font-family="Arial,sans-serif" fill="#dce7f2" text-anchor="middle">accessibility • privacy/security incidents • rural/gender/disability gaps</text><text x="55" y="550" font-family="Arial,sans-serif" font-size="16" fill="#526579" text-anchor="start">Exam conclusion: digitisation is a tool; public value depends on process reform, rights, inclusion and accountability.</text></g></svg>