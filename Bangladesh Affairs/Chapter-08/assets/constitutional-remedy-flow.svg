<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680"><rect width="1000" height="680" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#102a43">Constitutional Remedy: Conceptual Flow</text><g font-family="Arial" text-anchor="middle"><rect x="255" y="90" width="490" height="75" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="120" font-size="21" font-weight="700" fill="#1e3a8a">1. Identify alleged unlawful action</text><text x="500" y="145" font-size="15" fill="#1e3a8a">Right / decision / authority / evidence</text><path d="M500 165 V200" stroke="#475569" stroke-width="3"/><path d="M488 188 L500 205 L512 188" stroke="#475569" stroke-width="3" fill="none"/><rect x="255" y="210" width="490" height="75" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="500" y="240" font-size="21" font-weight="700" fill="#78350f">2. Check legal route and jurisdiction</text><text x="500" y="265" font-size="15" fill="#78350f">Standing · grounds · alternative remedy · procedure</text><path d="M500 285 V320" stroke="#475569" stroke-width="3"/><path d="M488 308 L500 325 L512 308" stroke="#475569" stroke-width="3" fill="none"/><rect x="255" y="330" width="490" height="75" rx="16" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="500" y="360" font-size="21" font-weight="700" fill="#581c87">3. Court considers the matter</text><text x="500" y="385" font-size="15" fill="#581c87">Article 102 writ jurisdiction, where applicable</text><path d="M500 405 V440" stroke="#475569" stroke-width="3"/><path d="M488 428 L500 445 L512 428" stroke="#475569" stroke-width="3" fill="none"/><rect x="205" y="450" width="590" height="75" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="500" y="480" font-size="21" font-weight="700" fill="#14532d">4. Reasoned decision / lawful remedy</text><text x="500" y="505" font-size="15" fill="#14532d">Depends on facts, evidence, law and jurisdiction</text><path d="M500 525 V555" stroke="#475569" stroke-width="3"/><path d="M488 543 L500 560 L512 543" stroke="#475569" stroke-width="3" fill="none"/><rect x="280" y="570" width="440" height="55" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="500" y="604" font-size="19" font-weight="700" fill="#0c4a6e">Remedy · Compliance · Rule of law</text></g><text x="500" y="654" text-anchor="middle" font-family="Arial" font-size="12" fill="#52606d">Educational flowchart, not legal advice; court procedure and remedies depend on applicable law.</text></svg>