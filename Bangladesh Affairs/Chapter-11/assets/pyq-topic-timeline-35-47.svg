<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d"><title id="t">Election-related BCS Written question themes, 35th to 47th BCS</title><desc id="d">Archive-reported election topics: 35th Election Commission and campaign expenditure, 36th observers and RPO, 37th election mission and campaign cost, 38th reserved women's seats, 40th 1970 election history, 41st EC and observers, 43rd EC formation and functions, 47th political culture. 39th and 42nd were special BCS exams; some other years had no direct election-management question identified in the accessible archive.</desc><rect width="1000" height="540" rx="24" fill="#fff"/><text x="500" y="45" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">Election-related BCS Written Themes: 35th–47th</text><text x="500" y="75" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">Topic audit of secondary archives; not a frequency or probability chart.</text><path d="M100 128 H900" stroke="#94a3b8" stroke-width="4"/><g font-family="sans-serif" text-anchor="middle"><g><circle cx="100" cy="128" r="10" fill="#2563eb"/><text x="100" y="111" font-size="18" font-weight="700" fill="#1e3a8a">35th</text><rect x="40" y="150" width="120" height="95" rx="12" fill="#dbeafe"/><text x="100" y="175" font-size="15" font-weight="700" fill="#1e3a8a">EC duties</text><text x="100" y="197" font-size="14" fill="#1e3a8a">campaign</text><text x="100" y="217" font-size="14" fill="#1e3a8a">expenses</text></g><g><circle cx="233" cy="128" r="10" fill="#0f766e"/><text x="233" y="111" font-size="18" font-weight="700" fill="#115e59">36th</text><rect x="173" y="265" width="120" height="95" rx="12" fill="#ccfbf1"/><text x="233" y="290" font-size="15" font-weight="700" fill="#115e59">Observers</text><text x="233" y="312" font-size="14" fill="#115e59">RPO note</text></g><g><circle cx="366" cy="128" r="10" fill="#b45309"/><text x="366" y="111" font-size="18" font-weight="700" fill="#78350f">37th</text><rect x="306" y="150" width="120" height="95" rx="12" fill="#fef3c7"/><text x="366" y="175" font-size="15" font-weight="700" fill="#78350f">Election</text><text x="366" y="197" font-size="14" fill="#78350f">mission</text><text x="366" y="217" font-size="14" fill="#78350f">cost control</text></g><g><circle cx="499" cy="128" r="10" fill="#7e22ce"/><text x="499" y="111" font-size="18" font-weight="700" fill="#581c87">38th</text><rect x="439" y="265" width="120" height="95" rx="12" fill="#f3e8ff"/><text x="499" y="290" font-size="15" font-weight="700" fill="#581c87">Reserved</text><text x="499" y="312" font-size="14" fill="#581c87">women's</text><text x="499" y="332" font-size="14" fill="#581c87">seats</text></g><g><circle cx="632" cy="128" r="10" fill="#0e7490"/><text x="632" y="111" font-size="18" font-weight="700" fill="#164e63">40th</text><rect x="572" y="150" width="120" height="95" rx="12" fill="#cffafe"/><text x="632" y="175" font-size="15" font-weight="700" fill="#164e63">1970 general</text><text x="632" y="197" font-size="14" fill="#164e63">election</text><text x="632" y="217" font-size="14" fill="#164e63">history</text></g><g><circle cx="765" cy="128" r="10" fill="#b91c1c"/><text x="765" y="111" font-size="18" font-weight="700" fill="#7f1d1d">41st/43rd</text><rect x="705" y="265" width="120" height="95" rx="12" fill="#fee2e2"/><text x="765" y="290" font-size="15" font-weight="700" fill="#7f1d1d">EC mandate</text><text x="765" y="312" font-size="14" fill="#7f1d1d">and observer</text><text x="765" y="332" font-size="14" fill="#7f1d1d">role</text></g><g><circle cx="900" cy="128" r="10" fill="#475569"/><text x="900" y="111" font-size="18" font-weight="700" fill="#334155">47th</text><rect x="840" y="150" width="120" height="95" rx="12" fill="#e2e8f0"/><text x="900" y="175" font-size="15" font-weight="700" fill="#334155">Political</text><text x="900" y="197" font-size="14" fill="#334155">culture and</text><text x="900" y="217" font-size="14" fill="#334155">democracy</text></g></g><rect x="70" y="405" width="860" height="78" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="500" y="435" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a">39th and 42nd: special BCS exams, not ordinary Bangladesh Affairs written papers.</text><text x="500" y="461" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">44th–46th: no direct election-management question confirmed in the consulted Bangladesh Affairs archive; cross-paper themes are labelled separately.</text><text x="500" y="514" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">Sources: BCS EXAM archive and 37th BCS Bangladesh Affairs secondary scan; original BPSC scans should be checked where available.</text></svg>