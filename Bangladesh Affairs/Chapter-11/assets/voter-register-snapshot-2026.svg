<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Bangladesh registered voters, 21 October 2026</title><desc id="d">Bangladesh Election Commission constituency page lists 127,711,899 registered voters: 64,825,154 male, 62,885,525 female and 1,220 transgender voters.</desc><rect width="1000" height="560" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Registered Voters in Bangladesh</text><text x="500" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">Election Commission snapshot • 21 October 2026</text><rect x="80" y="112" width="840" height="102" rx="18" fill="#0f172a"/><text x="500" y="153" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#cbd5e1">TOTAL REGISTERED VOTERS</text><text x="500" y="190" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#fff">127,711,899</text><text x="90" y="263" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">Male</text><text x="910" y="263" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">64,825,154 • 50.76%</text><rect x="90" y="279" width="820" height="30" rx="8" fill="#dbeafe"/><rect x="90" y="279" width="416.2" height="30" rx="8" fill="#2563eb"/><text x="90" y="350" font-family="sans-serif" font-size="20" font-weight="700" fill="#115e59">Female</text><text x="910" y="350" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="700" fill="#115e59">62,885,525 • 49.24%</text><rect x="90" y="366" width="820" height="30" rx="8" fill="#ccfbf1"/><rect x="90" y="366" width="403.8" height="30" rx="8" fill="#0f766e"/><rect x="90" y="425" width="820" height="60" rx="14" fill="#fef3c7" stroke="#f59e0b"/><text x="120" y="451" font-family="sans-serif" font-size="18" font-weight="700" fill="#78350f">Transgender voters: 1,220</text><text x="120" y="473" font-family="sans-serif" font-size="15" fill="#78350f">Displayed separately because this count is too small to see at the same bar scale.</text><text x="500" y="523" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">Percentages are calculated from the three published category counts; they may not sum to exactly 100% after rounding.</text></svg>