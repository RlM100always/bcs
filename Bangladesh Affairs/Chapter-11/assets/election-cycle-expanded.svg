<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="t d"><title id="t">Election cycle from planning to post-election review</title><desc id="d">Eight linked stages: legal framework, voter roll, delimitation and nomination, campaign, polling, counting and results, disputes, post-election review.</desc><rect width="1000" height="690" rx="24" fill="#fff"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">The Election Cycle: Before, During and After Polling</text><text x="500" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">Credibility is built across the full cycle—not only on polling day.</text><g font-family="sans-serif"><rect x="70" y="120" width="390" height="86" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="100" y="151" font-size="21" font-weight="700" fill="#1e3a8a">1. Legal framework & schedule</text><text x="100" y="180" font-size="16" fill="#1e3a8a">Rules, calendar, responsibilities</text><rect x="540" y="120" width="390" height="86" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="570" y="151" font-size="21" font-weight="700" fill="#14532d">2. Voter register</text><text x="570" y="180" font-size="16" fill="#14532d">Update, corrections, inclusion</text><path d="M460 163 H540" stroke="#64748b" stroke-width="3"/><path d="M735 206 V240 H500 V265" stroke="#64748b" stroke-width="3" fill="none"/><rect x="310" y="265" width="380" height="80" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="500" y="296" text-anchor="middle" font-size="21" font-weight="700" fill="#78350f">3. Boundaries & nominations</text><text x="500" y="322" text-anchor="middle" font-size="16" fill="#78350f">Fair access, scrutiny, appeals</text><path d="M500 345 V375" stroke="#64748b" stroke-width="3"/><rect x="70" y="375" width="390" height="80" rx="16" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="265" y="406" text-anchor="middle" font-size="21" font-weight="700" fill="#581c87">4. Campaign period</text><text x="265" y="432" text-anchor="middle" font-size="16" fill="#581c87">Equal rules, finance, information</text><rect x="540" y="375" width="390" height="80" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="735" y="406" text-anchor="middle" font-size="21" font-weight="700" fill="#164e63">5. Polling day</text><text x="735" y="432" text-anchor="middle" font-size="16" fill="#164e63">Secret ballot, accessible stations</text><path d="M460 415 H540" stroke="#64748b" stroke-width="3"/><path d="M735 455 V483 H500 V500" stroke="#64748b" stroke-width="3" fill="none"/><rect x="310" y="500" width="380" height="76" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="500" y="529" text-anchor="middle" font-size="21" font-weight="700" fill="#7f1d1d">6. Count & publish results</text><text x="500" y="553" text-anchor="middle" font-size="16" fill="#7f1d1d">Reconciliation, transparency, records</text><path d="M500 576 V594" stroke="#64748b" stroke-width="3"/><rect x="70" y="594" width="390" height="60" rx="12" fill="#e2e8f0"/><text x="265" y="619" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">7. Complaints & legal remedies</text><text x="265" y="640" text-anchor="middle" font-size="15" fill="#334155">Timely, evidence-based decisions</text><rect x="540" y="594" width="390" height="60" rx="12" fill="#e2e8f0"/><text x="735" y="619" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">8. Review & reform</text><text x="735" y="640" text-anchor="middle" font-size="15" fill="#334155">Audit, lessons, public reporting</text></g></svg>