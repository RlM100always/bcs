<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Election stakeholder roles and accountability</title><desc id="d">Election Commission administers; executive authorities assist; political parties and candidates follow rules; voters participate; observers and media report independently; courts and tribunals provide legal remedies.</desc><rect width="1000" height="620" rx="24" fill="#fff"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Who Does What? Election Stakeholders</text><text x="500" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">No single actor can guarantee election integrity alone.</text><g font-family="sans-serif" text-anchor="middle"><rect x="310" y="112" width="380" height="78" rx="16" fill="#0f172a"/><text x="500" y="143" font-size="23" font-weight="700" fill="#fff">Election Commission</text><text x="500" y="169" font-size="16" fill="#e2e8f0">Administers within the Constitution and law</text><path d="M500 190 V220 M170 220 H830 M170 220 V245 M390 220 V245 M610 220 V245 M830 220 V245" stroke="#64748b" stroke-width="3" fill="none"/><rect x="65" y="245" width="210" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170" y="276" font-size="20" font-weight="700" fill="#1e3a8a">Executive</text><text x="170" y="302" font-size="15" fill="#1e3a8a">Lawful assistance</text><text x="170" y="321" font-size="15" fill="#1e3a8a">and logistics</text><rect x="285" y="245" width="210" height="90" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="390" y="276" font-size="20" font-weight="700" fill="#14532d">Parties &amp; candidates</text><text x="390" y="302" font-size="15" fill="#14532d">Conduct and finance</text><text x="390" y="321" font-size="15" fill="#14532d">rules</text><rect x="505" y="245" width="210" height="90" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="610" y="276" font-size="20" font-weight="700" fill="#78350f">Voters</text><text x="610" y="302" font-size="15" fill="#78350f">Free choice and</text><text x="610" y="321" font-size="15" fill="#78350f">informed participation</text><rect x="725" y="245" width="210" height="90" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="830" y="276" font-size="20" font-weight="700" fill="#581c87">Observers &amp; media</text><text x="830" y="302" font-size="15" fill="#581c87">Independent scrutiny</text><text x="830" y="321" font-size="15" fill="#581c87">and reporting</text><path d="M170 335 V375 H500 M390 335 V375 M610 335 V375 M830 335 V375 H500 V400" stroke="#64748b" stroke-width="3" fill="none"/><rect x="260" y="400" width="480" height="78" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="500" y="432" font-size="22" font-weight="700" fill="#164e63">Courts / election tribunals</text><text x="500" y="458" font-size="16" fill="#164e63">Evidence-based and timely legal remedies</text><rect x="110" y="520" width="780" height="56" rx="14" fill="#e2e8f0"/><text x="500" y="544" font-size="18" font-weight="700" fill="#0f172a">Accountability rule: clear mandate + public records + impartial enforcement</text><text x="500" y="565" font-size="15" fill="#334155">Constitutional anchors: Articles 118–126 • current RPO • observer and conduct rules</text></g></svg>