<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Election technology benefits, risks and safeguards</title><desc id="d">Technology can improve voter services, accessibility, logistics and timely information; it can also create cyber, privacy, access and misinformation risks. Safeguards include legal basis, auditability, cybersecurity and fallback procedures.</desc><rect width="1000" height="620" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Election Technology: Benefit + Risk + Safeguard</text><text x="500" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">Technology should strengthen verifiability—not replace accountability.</text><g font-family="sans-serif"><rect x="60" y="115" width="410" height="235" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="265" y="150" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">Potential benefits</text><text x="95" y="190" font-size="18" fill="#14532d">• Faster voter-service information</text><text x="95" y="225" font-size="18" fill="#14532d">• Better logistics and staff training</text><text x="95" y="260" font-size="18" fill="#14532d">• Accessible, searchable public data</text><text x="95" y="295" font-size="18" fill="#14532d">• Faster publication of official results</text><rect x="530" y="115" width="410" height="235" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="735" y="150" text-anchor="middle" font-size="23" font-weight="700" fill="#7f1d1d">Potential risks</text><text x="565" y="190" font-size="18" fill="#7f1d1d">• Cyberattack or service outage</text><text x="565" y="225" font-size="18" fill="#7f1d1d">• Privacy breach or inaccurate data</text><text x="565" y="260" font-size="18" fill="#7f1d1d">• Digital exclusion and accessibility gaps</text><text x="565" y="295" font-size="18" fill="#7f1d1d">• Deepfakes and false result claims</text><path d="M265 350 V382 H500 M735 350 V382 H500 V405" stroke="#64748b" stroke-width="3" fill="none"/><rect x="130" y="405" width="740" height="125" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="440" text-anchor="middle" font-size="23" font-weight="700" fill="#1e3a8a">Required safeguards</text><text x="500" y="472" text-anchor="middle" font-size="18" fill="#1e3a8a">Legal authority • security testing • audit trails • privacy protection</text><text x="500" y="500" text-anchor="middle" font-size="18" fill="#1e3a8a">Accessible alternatives • incident reporting • manual contingency plan</text><text x="500" y="575" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">Conceptual framework; not a claim that every technology is currently used in Bangladesh.</text></g></svg>