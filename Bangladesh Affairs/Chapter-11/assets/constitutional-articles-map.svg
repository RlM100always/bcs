<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="t d"><title id="t">Constitutional framework for elections in Bangladesh</title><desc id="d">Articles 118 to 126 establish the Election Commission, assign functions, support staffing, protect one electoral roll per constituency, establish adult franchise, set election timing, legislation, dispute routes and executive assistance.</desc><rect width="1000" height="700" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Constitutional Framework: Articles 118–126</text><text x="500" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">Remember the logic: Institution → Mandate → Voter equality → Timing → Remedy → Support</text><g font-family="sans-serif"><rect x="70" y="112" width="410" height="82" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95" y="142" font-size="20" font-weight="700" fill="#1e3a8a">Article 118</text><text x="95" y="169" font-size="17" fill="#1e3a8a">Constitution and independence of EC</text><rect x="520" y="112" width="410" height="82" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="545" y="142" font-size="20" font-weight="700" fill="#14532d">Articles 119–120</text><text x="545" y="169" font-size="17" fill="#14532d">Functions and staff support</text><rect x="70" y="220" width="410" height="82" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="95" y="250" font-size="20" font-weight="700" fill="#78350f">Articles 121–122</text><text x="95" y="277" font-size="17" fill="#78350f">Single roll and adult franchise</text><rect x="520" y="220" width="410" height="82" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="545" y="250" font-size="20" font-weight="700" fill="#581c87">Article 123</text><text x="545" y="277" font-size="17" fill="#581c87">Timing of elections</text><rect x="70" y="328" width="410" height="82" rx="14" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="95" y="358" font-size="20" font-weight="700" fill="#164e63">Article 124</text><text x="95" y="385" font-size="17" fill="#164e63">Parliament may legislate on elections</text><rect x="520" y="328" width="410" height="82" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="545" y="358" font-size="20" font-weight="700" fill="#7f1d1d">Article 125</text><text x="545" y="385" font-size="17" fill="#7f1d1d">Legal route for election disputes</text><path d="M275 194 V210 M725 194 V210 M275 302 V318 M725 302 V318 M275 410 V432 H500 M725 410 V432 H500 V455" stroke="#64748b" stroke-width="3" fill="none"/><rect x="180" y="455" width="640" height="88" rx="16" fill="#0f172a"/><text x="500" y="488" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Article 126 — Executive assistance</text><text x="500" y="517" text-anchor="middle" font-size="17" fill="#e2e8f0">All executive authorities must assist the EC in discharging its functions.</text><rect x="120" y="575" width="760" height="70" rx="14" fill="#e2e8f0"/><text x="500" y="603" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Exam link: cite the correct article, then explain its practical meaning.</text><text x="500" y="627" text-anchor="middle" font-size="15" fill="#334155">Official text: Laws of Bangladesh • Constitution • Part VII</text></g></svg>