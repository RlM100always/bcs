<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">RPO Amendment Act 2026 study map</title><desc id="d">Study map of six amendment themes: single candidate and No Vote, postal ballot, nomination disclosure, election expenditure limit, polling-station management, and misleading synthetic election content.</desc><rect width="1000" height="650" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">RPO Amendment Act, 2026 — Revision Map</text><text x="500" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">Act No. 03 of 2026 • Official law text takes precedence over summaries.</text><rect x="300" y="108" width="400" height="64" rx="16" fill="#0f172a"/><text x="500" y="147" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#fff">RPO 1972, as amended</text><path d="M500 172 V200 M160 200 H840 M160 200 V225 M330 200 V225 M500 200 V225 M670 200 V225 M840 200 V225" stroke="#64748b" stroke-width="3" fill="none"/><g font-family="sans-serif" text-anchor="middle"><rect x="60" y="225" width="200" height="105" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160" y="257" font-size="19" font-weight="700" fill="#1e3a8a">Single candidate</text><text x="160" y="283" font-size="16" fill="#1e3a8a">No Vote under</text><text x="160" y="304" font-size="16" fill="#1e3a8a">defined conditions</text><rect x="230" y="225" width="200" height="105" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="330" y="257" font-size="19" font-weight="700" fill="#14532d">Postal ballot</text><text x="330" y="283" font-size="16" fill="#14532d">Specified eligible</text><text x="330" y="304" font-size="16" fill="#14532d">voter categories</text><rect x="400" y="225" width="200" height="105" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="500" y="257" font-size="19" font-weight="700" fill="#78350f">Nomination</text><text x="500" y="283" font-size="16" fill="#78350f">Disclosure and</text><text x="500" y="304" font-size="16" fill="#78350f">document rules</text><rect x="570" y="225" width="200" height="105" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="670" y="257" font-size="19" font-weight="700" fill="#581c87">Campaign finance</text><text x="670" y="283" font-size="16" fill="#581c87">Tk 10 per voter</text><text x="670" y="304" font-size="16" fill="#581c87">or Tk 25 lakh, higher</text><rect x="740" y="225" width="200" height="105" rx="14" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="840" y="257" font-size="19" font-weight="700" fill="#164e63">Polling stations</text><text x="840" y="283" font-size="16" fill="#164e63">Preparation and</text><text x="840" y="304" font-size="16" fill="#164e63">Commission approval</text><path d="M500 330 V360" stroke="#64748b" stroke-width="3"/><rect x="150" y="360" width="700" height="82" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="500" y="392" font-size="21" font-weight="700" fill="#7f1d1d">Misleading election content / synthetic media</text><text x="500" y="418" font-size="16" fill="#7f1d1d">Read the precise legal elements, intent, scope and due-process protections in the Act.</text><rect x="110" y="470" width="780" height="108" rx="16" fill="#e2e8f0"/><text x="500" y="501" font-size="20" font-weight="700" fill="#0f172a">Exam method</text><text x="500" y="530" font-size="17" fill="#334155">Name the provision → explain its purpose → identify safeguards and limits</text><text x="500" y="554" font-size="17" fill="#334155">→ assess implementation and public accountability.</text><text x="500" y="615" font-size="15" fill="#475569">Official text: bdlaws.minlaw.gov.bd/act-print-1632.html • snapshot for study, not legal advice</text></g></svg>