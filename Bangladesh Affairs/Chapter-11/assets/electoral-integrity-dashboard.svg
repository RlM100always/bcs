<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d"><title id="t">Six pillars of electoral integrity</title><desc id="d">Legality, independence, inclusion, competition, transparency, and accountability support electoral integrity.</desc><rect width="1000" height="610" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Electoral Integrity: Six Interlocking Pillars</text><text x="500" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">A useful framework for a 10- or 20-mark critical analysis.</text><g font-family="sans-serif" text-anchor="middle"><rect x="65" y="125" width="270" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="200" y="160" font-size="23" font-weight="700" fill="#1e3a8a">1. Legality</text><text x="200" y="190" font-size="16" fill="#1e3a8a">Clear, current rules</text><text x="200" y="211" font-size="16" fill="#1e3a8a">and due process</text><rect x="365" y="125" width="270" height="105" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="500" y="160" font-size="23" font-weight="700" fill="#14532d">2. Independence</text><text x="500" y="190" font-size="16" fill="#14532d">Impartial decisions</text><text x="500" y="211" font-size="16" fill="#14532d">and capacity</text><rect x="665" y="125" width="270" height="105" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="800" y="160" font-size="23" font-weight="700" fill="#78350f">3. Inclusion</text><text x="800" y="190" font-size="16" fill="#78350f">Accessible services</text><text x="800" y="211" font-size="16" fill="#78350f">and equal access</text><rect x="65" y="260" width="270" height="105" rx="16" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="200" y="295" font-size="23" font-weight="700" fill="#581c87">4. Competition</text><text x="200" y="325" font-size="16" fill="#581c87">Fair campaign</text><text x="200" y="346" font-size="16" fill="#581c87">and finance rules</text><rect x="365" y="260" width="270" height="105" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="500" y="295" font-size="23" font-weight="700" fill="#164e63">5. Transparency</text><text x="500" y="325" font-size="16" fill="#164e63">Traceable count</text><text x="500" y="346" font-size="16" fill="#164e63">and public data</text><rect x="665" y="260" width="270" height="105" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="800" y="295" font-size="23" font-weight="700" fill="#7f1d1d">6. Accountability</text><text x="800" y="325" font-size="16" fill="#7f1d1d">Complaints, review</text><text x="800" y="346" font-size="16" fill="#7f1d1d">and remedies</text><path d="M200 365 V395 H800 V365 M500 365 V415" stroke="#64748b" stroke-width="3" fill="none"/><rect x="220" y="415" width="560" height="90" rx="18" fill="#0f172a"/><text x="500" y="451" font-size="25" font-weight="700" fill="#fff">Credible election</text><text x="500" y="479" font-size="17" fill="#e2e8f0">Public trust is an outcome to earn—not a claim to make.</text><text x="500" y="555" font-size="16" fill="#475569">Framework adapted for study from the Constitution, UN human-rights instruments and International IDEA guidance.</text></g></svg>