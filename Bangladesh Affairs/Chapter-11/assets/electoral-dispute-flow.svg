<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">Electoral complaint and legal remedy workflow</title><desc id="d">Record complaint and evidence, check jurisdiction and deadline, refer to the competent EC authority or court/tribunal under the applicable law, provide fair hearing, issue a reasoned decision, and follow lawful appeal and post-election review procedures.</desc><rect width="1000" height="650" rx="24" fill="#fff"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Electoral Complaint → Lawful Remedy</text><text x="500" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">Always verify the competent forum, grounds and deadlines in the current law.</text><g font-family="sans-serif" text-anchor="middle"><rect x="300" y="110" width="400" height="62" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="148" font-size="21" font-weight="700" fill="#1e3a8a">1. Record the complaint and evidence</text><path d="M500 172 V195" stroke="#64748b" stroke-width="3"/><rect x="300" y="195" width="400" height="62" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="500" y="233" font-size="21" font-weight="700" fill="#78350f">2. Check grounds, jurisdiction and time limit</text><path d="M500 257 V280" stroke="#64748b" stroke-width="3"/><rect x="200" y="280" width="600" height="72" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="500" y="310" font-size="21" font-weight="700" fill="#0f172a">3. Refer to the competent forum</text><text x="500" y="334" font-size="16" fill="#334155">EC / designated authority / election tribunal or court, as law provides</text><path d="M500 352 V377" stroke="#64748b" stroke-width="3"/><rect x="300" y="377" width="400" height="62" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="500" y="415" font-size="21" font-weight="700" fill="#14532d">4. Fair hearing and evidence review</text><path d="M500 439 V462" stroke="#64748b" stroke-width="3"/><rect x="300" y="462" width="400" height="62" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="500" y="500" font-size="21" font-weight="700" fill="#581c87">5. Reasoned decision and lawful remedy</text><path d="M500 524 V546" stroke="#64748b" stroke-width="3"/><rect x="150" y="546" width="700" height="58" rx="14" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="500" y="570" font-size="19" font-weight="700" fill="#164e63">6. Appeal (if available) + record preservation + review</text><text x="500" y="591" font-size="14" fill="#164e63">Do not treat an allegation, pending case and final decision as the same thing.</text></g></svg>