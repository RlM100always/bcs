<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" rx="24" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">Bangladesh Election Commission — Constitutional Map</text><g font-family="Arial" text-anchor="middle"><rect x="325" y="75" width="450" height="68" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="550" y="103" font-size="21" font-weight="700" fill="#1e3a8a">Constitution Part VII: Elections</text><text x="550" y="126" font-size="15" fill="#1e3a8a">Articles 118–126</text><path d="M550 143 V177 M180 177 H920 M180 177 V205 M430 177 V205 M680 177 V205 M920 177 V205" stroke="#64748b" stroke-width="2.5" fill="none"/><rect x="90" y="205" width="180" height="95" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="180" y="236" font-size="20" font-weight="700" fill="#14532d">Art. 118</text><text x="180" y="260" font-size="15" fill="#14532d">Commission</text><text x="180" y="280" font-size="15" fill="#14532d">and independence</text><rect x="340" y="205" width="180" height="95" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="430" y="236" font-size="20" font-weight="700" fill="#78350f">Art. 119</text><text x="430" y="260" font-size="15" fill="#78350f">Powers and</text><text x="430" y="280" font-size="15" fill="#78350f">functions</text><rect x="590" y="205" width="180" height="95" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="680" y="236" font-size="20" font-weight="700" fill="#581c87">Arts. 120–122</text><text x="680" y="260" font-size="15" fill="#581c87">Staff, voter roll</text><text x="680" y="280" font-size="15" fill="#581c87">and franchise</text><rect x="830" y="205" width="180" height="95" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="920" y="236" font-size="20" font-weight="700" fill="#7f1d1d">Arts. 123–126</text><text x="920" y="260" font-size="15" fill="#7f1d1d">Timing, law,</text><text x="920" y="280" font-size="15" fill="#7f1d1d">disputes, support</text><rect x="180" y="360" width="740" height="110" rx="15" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="550" y="395" font-size="22" font-weight="700" fill="#0c4a6e">Implementation requires the wider election ecosystem</text><text x="550" y="428" font-size="17" fill="#0c4a6e">EC · election officers · courts · administration · parties · observers · voters</text><text x="550" y="451" font-size="15" fill="#0c4a6e">Use current Constitution and amended election laws for exact legal wording</text><text x="550" y="535" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">Study diagram — a learning aid, not an official government chart.</text><text x="550" y="565" text-anchor="middle" font-family="Arial" font-size="14" fill="#52606d">Sources: Constitution of Bangladesh, Part VII; Bangladesh Election Commission official legal register.</text></g></svg>