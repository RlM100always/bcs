<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><rect width="900" height="460" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">সম্পদ ব্যবস্থাপনায় সুশাসন</text><g font-family="sans-serif" text-anchor="middle"><rect x="65" y="100" width="220" height="85" rx="14" fill="#dbeafe" stroke="#7aa7d9"/><text x="175" y="135" font-size="21" font-weight="700" fill="#173e68">স্বচ্ছ তথ্য</text><text x="175" y="162" font-size="16" fill="#173e68">Inventory • monitoring</text><rect x="340" y="100" width="220" height="85" rx="14" fill="#dcfce7" stroke="#86c69b"/><text x="450" y="135" font-size="21" font-weight="700" fill="#14532d">আইন ও প্রয়োগ</text><text x="450" y="162" font-size="16" fill="#14532d">EIA • enforcement</text><rect x="615" y="100" width="220" height="85" rx="14" fill="#fef3c7" stroke="#e4bd55"/><text x="725" y="135" font-size="21" font-weight="700" fill="#854d0e">অংশগ্রহণ</text><text x="725" y="162" font-size="16" fill="#854d0e">Local rights • benefit</text><path d="M175 185 V220 H725 V185 M450 220 V245" stroke="#64748b" stroke-width="3" fill="none"/><rect x="130" y="245" width="640" height="90" rx="18" fill="#123047"/><text x="450" y="282" font-size="22" font-weight="700" fill="#fff">জবাবদিহি ও অভিযোজনশীল নীতি</text><text x="450" y="310" font-size="17" fill="#e2e8f0">সমন্বয় • অভিযোগ নিষ্পত্তি • ফলাফলভিত্তিক মূল্যায়ন</text><text x="450" y="400" font-size="18" fill="#475569">নীতির ফলাফল: সম্পদ টিকে থাকা + ন্যায্য সুবিধা + মানুষের নিরাপত্তা</text></g></svg>