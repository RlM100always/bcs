<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><rect width="900" height="480" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">টেকসই সম্পদ ব্যবস্থাপনার চক্র</text><g font-family="sans-serif" text-anchor="middle"><rect x="70" y="105" width="210" height="78" rx="14" fill="#dbeafe" stroke="#7aa7d9"/><text x="175" y="137" font-size="20" font-weight="700" fill="#173e68">১. সম্পদ তালিকা</text><text x="175" y="160" font-size="15" fill="#173e68">Inventory</text><rect x="345" y="105" width="210" height="78" rx="14" fill="#dcfce7" stroke="#86c69b"/><text x="450" y="137" font-size="20" font-weight="700" fill="#14532d">২. চাপ নিরূপণ</text><text x="450" y="160" font-size="15" fill="#14532d">Demand &amp; pressure</text><rect x="620" y="105" width="210" height="78" rx="14" fill="#fef3c7" stroke="#e4bd55"/><text x="725" y="137" font-size="20" font-weight="700" fill="#854d0e">৩. সীমা নির্ধারণ</text><text x="725" y="160" font-size="15" fill="#854d0e">Ecological limits</text><path d="M280 144 H338 M555 144 H613" stroke="#64748b" stroke-width="3"/><path d="M725 183 V230 H175 V183" stroke="#64748b" stroke-width="3" fill="none"/><rect x="70" y="250" width="210" height="78" rx="14" fill="#f3e8ff" stroke="#b69ad9"/><text x="175" y="282" font-size="20" font-weight="700" fill="#6b21a8">৪. নিয়ম ও অধিকার</text><text x="175" y="305" font-size="15" fill="#6b21a8">Rules &amp; rights</text><rect x="345" y="250" width="210" height="78" rx="14" fill="#ffe4e6" stroke="#e8a0a8"/><text x="450" y="282" font-size="20" font-weight="700" fill="#9f1239">৫. পর্যবেক্ষণ</text><text x="450" y="305" font-size="15" fill="#9f1239">Monitoring</text><rect x="620" y="250" width="210" height="78" rx="14" fill="#e2e8f0" stroke="#94a3b8"/><text x="725" y="282" font-size="20" font-weight="700" fill="#123047">৬. অভিযোজন</text><text x="725" y="305" font-size="15" fill="#123047">Adaptation</text>