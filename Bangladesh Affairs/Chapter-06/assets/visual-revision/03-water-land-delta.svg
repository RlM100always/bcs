<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><rect width="900" height="460" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">পানি–ভূমি–ডেল্টা: আন্তঃসম্পর্ক</text><g font-family="sans-serif" text-anchor="middle"><rect x="60" y="105" width="220" height="90" rx="14" fill="#dbeafe" stroke="#7aa7d9"/><text x="170" y="143" font-size="22" font-weight="700" fill="#173e68">নদী ও পানি</text><text x="170" y="170" font-size="16" fill="#173e68">প্রবাহ • পলি • গুণমান</text><rect x="340" y="105" width="220" height="90" rx="14" fill="#dcfce7" stroke="#86c69b"/><text x="450" y="143" font-size="22" font-weight="700" fill="#14532d">ভূমি ও কৃষি</text><text x="450" y="170" font-size="16" fill="#14532d">মাটি • ফসল • বসতি</text><rect x="620" y="105" width="220" height="90" rx="14" fill="#fef3c7" stroke="#e4bd55"/><text x="730" y="143" font-size="22" font-weight="700" fill="#854d0e">জলাভূমি ও মৎস্য</text><text x="730" y="170" font-size="16" fill="#854d0e">আবাসস্থল • জীবিকা</text><path d="M280 150 H333 M560 150 H613" stroke="#64748b" stroke-width="3"/><rect x="130" y="255" width="640" height="95" rx="18" fill="#123047"/><text x="450" y="293" font-size="22" font-weight="700" fill="#fff">সমন্বিত অববাহিকা ব্যবস্থাপনা</text><text x="450" y="322" font-size="17" fill="#e2e8f0">উজান–ভাটি • বন্যা ও খরা • পানি নিরাপত্তা • বাস্তুতন্ত্র</text><path d="M170 195 V225 H450 V255 M730 195 V225 H450" stroke="#64748b" stroke-width="3" fill="none"/><text x="450" y="405" font-size="18" fill="#475569">Bangladesh Delta Plan 2100: দীর্ঘমেয়াদি, সমন্বিত ও অভিযোজনশীল পরিকল্পনা</text></g></svg>