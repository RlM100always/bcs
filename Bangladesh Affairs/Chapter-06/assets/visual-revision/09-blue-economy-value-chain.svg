<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Blue economy value chain for Bangladesh</title><desc id="d">Marine ecosystems support fisheries, shipping, tourism, renewable energy and research, which can generate jobs and income if governed sustainably.</desc><rect width="1000" height="600" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">Blue Economy: From Ocean Assets to Shared Benefits</text><rect x="340" y="82" width="320" height="65" rx="16" fill="#0c4a6e"/><text x="500" y="109" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff">Ocean & Coastal Ecosystems</text><text x="500" y="132" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e0f2fe">Bay of Bengal • estuaries • coast</text><path d="M500 147 V180 M160 180 H840 M160 180 V207 M387 180 V207 M613 180 V207 M840 180 V207" stroke="#64748b" stroke-width="3" fill="none"/><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="207" width="210" height="75" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160" y="238" font-size="19" font-weight="700" fill="#1e3a8a">Fisheries</text><text x="160" y="261" font-size="15" fill="#1e3a8a">food • livelihoods</text><rect x="282" y="207" width="210" height="75" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="387" y="238" font-size="19" font-weight="700" fill="#14532d">Ports & shipping</text><text x="387" y="261" font-size="15" fill="#14532d">trade • logistics</text><rect x="508" y="207" width="210" height="75" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="613" y="238" font-size="19" font-weight="700" fill="#78350f">Tourism & culture</text><text x="613" y="261" font-size="15" fill="#78350f">jobs • local enterprise</text><rect x="735" y="207" width="210" height="75" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="840" y="238" font-size="19" font-weight="700" fill="#581c87">Science & energy</text><text x="840" y="261" font-size="15" fill="#581c87">research • clean power</text></g><path d="M160 282 V323 H500 M387 282 V323 M613 282 V323 M840 282 V323 H500 V350" stroke="#64748b" stroke-width="3" fill="none"/><rect x="260" y="350" width="480" height="70" rx="16" fill="#0f172a"/><text x="500" y="380" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">Jobs • Food security • Exports • Resilience</text><text x="500" y="403" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e2e8f0">Benefits must be shared fairly and measured.</text><path d="M500 420 V450" stroke="#64748b" stroke-width="3"/><rect x="115" y="450" width="770" height="90" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="500" y="480" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#7f1d1d">Environmental & governance guardrails</text><text x="500" y="506" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7f1d1d">Marine habitat • pollution control • stock monitoring • safety • coastal community rights</text><text x="500" y="528" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7f1d1d">UNCLOS duties • science-led harvest • climate resilience • transparent revenue</text></svg>