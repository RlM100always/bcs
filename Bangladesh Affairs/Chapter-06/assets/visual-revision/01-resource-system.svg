<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><rect width="900" height="460" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">প্রাকৃতিক সম্পদ: একটি সমন্বিত ব্যবস্থা</text><g font-family="sans-serif" text-anchor="middle"><rect x="50" y="100" width="180" height="90" rx="14" fill="#dbeafe" stroke="#7aa7d9"/><text x="140" y="136" font-size="21" font-weight="700" fill="#173e68">ভূমি ও মাটি</text><text x="140" y="164" font-size="16" fill="#173e68">খাদ্য • বসতি</text><rect x="260" y="100" width="180" height="90" rx="14" fill="#dcfce7" stroke="#86c69b"/><text x="350" y="136" font-size="21" font-weight="700" fill="#14532d">পানি</text><text x="350" y="164" font-size="16" fill="#14532d">সেচ • নদী • পানীয়</text><rect x="470" y="100" width="180" height="90" rx="14" fill="#fef3c7" stroke="#e4bd55"/><text x="560" y="136" font-size="21" font-weight="700" fill="#854d0e">বন ও জীববৈচিত্র্য</text><text x="560" y="164" font-size="16" fill="#854d0e">আবাসস্থল • সুরক্ষা</text><rect x="680" y="100" width="170" height="90" rx="14" fill="#f3e8ff" stroke="#b69ad9"/><text x="765" y="136" font-size="21" font-weight="700" fill="#6b21a8">জ্বালানি</text><text x="765" y="164" font-size="16" fill="#6b21a8">বিদ্যুৎ • শিল্প</text><path d="M140 190 V235 H765 V190 M450 235 V260" stroke="#64748b" stroke-width="3" fill="none"/><rect x="140" y="260" width="620" height="100" rx="18" fill="#123047"/><text x="450" y="300" font-size="23" font-weight="700" fill="#fff">টেকসই ব্যবস্থাপনা</text><text x="450" y="330" font-size="17" fill="#e2e8f0">উৎপাদন + পরিবেশগত সীমা + ন্যায্য সুবিধা</text><text x="450" y="415" font-size="18" fill="#475569">একটি সম্পদের অবক্ষয় অন্য সম্পদ ও মানুষের জীবিকাকেও প্রভাবিত করে</text></g></svg>