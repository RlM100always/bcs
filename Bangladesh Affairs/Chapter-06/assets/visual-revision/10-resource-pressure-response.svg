<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d"><title id="t">Natural resource pressure and response framework</title><desc id="d">Unsustainable extraction causes land and water degradation, biodiversity loss and unequal livelihood impacts; responses include data, limits, restoration, participation and accountability.</desc><rect width="1000" height="580" rx="24" fill="#fff"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">Resource Pressure → Systemic Response</text><g font-family="sans-serif" text-anchor="middle"><rect x="70" y="95" width="390" height="66" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="265" y="122" font-size="21" font-weight="700" fill="#7f1d1d">Unsustainable pressure</text><text x="265" y="145" font-size="16" fill="#7f1d1d">overuse • pollution • land conversion</text><rect x="540" y="95" width="390" height="66" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="735" y="122" font-size="21" font-weight="700" fill="#78350f">Visible consequences</text><text x="735" y="145" font-size="16" fill="#78350f">degradation • scarcity • habitat loss</text><path d="M460 128 H540" stroke="#64748b" stroke-width="3"/><path d="M735 161 V205 H500 V230" stroke="#64748b" stroke-width="3" fill="none"/><rect x="280" y="230" width="440" height="70" rx="16" fill="#0f172a"/><text x="500" y="259" font-size="22" font-weight="700" fill="#fff">Sustainable management package</text><text x="500" y="282" font-size="16" fill="#e2e8f0">evidence + rules + fair participation</text><path d="M500 300 V330 M170 330 H830 M170 330 V355 M390 330 V355 M610 330 V355 M830 330 V355" stroke="#64748b" stroke-width="3" fill="none"/><rect x="65" y="355" width="210" height="80" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170" y="384" font-size="19" font-weight="700" fill="#1e3a8a">Measure</text><text x="170" y="408" font-size="15" fill="#1e3a8a">baseline • indicators</text><rect x="285" y="355" width="210" height="80" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="390" y="384" font-size="19" font-weight="700" fill="#14532d">Manage</text><text x="390" y="408" font-size="15" fill="#14532d">limits • permits</text><rect x="505" y="355" width="210" height="80" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="610" y="384" font-size="19" font-weight="700" fill="#581c87">Restore</text><text x="610" y="408" font-size="15" fill="#581c87">ecosystem • soil</text><rect x="725" y="355" width="210" height="80" rx="14" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="830" y="384" font-size="19" font-weight="700" fill="#164e63">Account</text><text x="830" y="408" font-size="15" fill="#164e63">public data • audit</text><rect x="150" y="470" width="700" height="58" rx="14" fill="#f1f5f9" stroke="#94a3b8"/><text x="500" y="494" font-size="19" font-weight="700" fill="#0f172a">Success indicator = ecological recovery + secure livelihoods</text><text x="500" y="515" font-size="15" fill="#475569">Monitor outcomes, not only money spent or activities completed.</text></g></svg>