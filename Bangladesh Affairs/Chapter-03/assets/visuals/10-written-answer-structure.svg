<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">BCS written history answer structure</title><desc id="d">A high scoring history answer moves from context and thesis to evidence, analysis, evaluation and conclusion.</desc><rect width="1000" height="560" rx="24" fill="#fff"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">BCS Written: Build an Analytical History Answer</text><g font-family="sans-serif" text-anchor="middle"><path d="M170 140 H830 L780 205 H220 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="166" font-size="21" font-weight="700" fill="#1e3a8a">1. Context + direct thesis</text><text x="500" y="190" font-size="16" fill="#1e3a8a">What is the question really asking?</text><path d="M220 215 H780 L735 280 H265 Z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="500" y="241" font-size="21" font-weight="700" fill="#14532d">2. Evidence + chronology</text><text x="500" y="265" font-size="16" fill="#14532d">Dates, actors, primary documents, examples</text><path d="M265 290 H735 L690 355 H310 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="500" y="316" font-size="21" font-weight="700" fill="#78350f">3. Cause → process → consequence</text><text x="500" y="340" font-size="16" fill="#78350f">Explain connections, not a fact list</text><path d="M310 365 H690 L650 425 H350 Z" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="500" y="390" font-size="20" font-weight="700" fill="#581c87">4. Critical evaluation</text><text x="500" y="412" font-size="16" fill="#581c87">Significance, limits, different perspectives</text><rect x="300" y="445" width="400" height="62" rx="15" fill="#0f172a"/><text x="500" y="471" font-size="21" font-weight="700" fill="#fff">5. Answer the question again</text><text x="500" y="492" font-size="16" fill="#e2e8f0">A concise, evidence-led conclusion</text></g></svg>