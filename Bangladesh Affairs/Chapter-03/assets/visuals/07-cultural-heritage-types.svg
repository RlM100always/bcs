<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Cultural heritage classification</title><desc id="d">Bangladesh cultural heritage can be grouped into tangible movable and immovable heritage, and intangible living heritage, supported by language, literature, music and craft.</desc><rect width="1000" height="560" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">Cultural Heritage of Bangladesh</text><rect x="350" y="78" width="300" height="60" rx="16" fill="#0f172a"/><text x="500" y="116" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#fff">Cultural Heritage</text><path d="M500 138 V174 M250 174 H750 M250 174 V205 M750 174 V205" stroke="#64748b" stroke-width="3" fill="none"/><rect x="70" y="205" width="360" height="70" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250" y="235" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">Tangible / বস্তুগত</text><text x="250" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1e3a8a">Monuments • artefacts • archives</text><rect x="570" y="205" width="360" height="70" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="750" y="235" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#14532d">Intangible / জীবন্ত</text><text x="750" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#14532d">Skills • songs • festivals • oral traditions</text><g font-family="sans-serif" text-anchor="middle"><rect x="70" y="315" width="170" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="155" y="350" font-size="18" font-weight="700" fill="#1e3a8a">Paharpur</text><text x="155" y="377" font-size="15" fill="#1e3a8a">Archaeology</text><rect x="260" y="315" width="170" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="345" y="350" font-size="18" font-weight="700" fill="#1e3a8a">Bagerhat</text><text x="345" y="377" font-size="15" fill="#1e3a8a">Architecture</text><rect x="570" y="315" width="170" height="90" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="655" y="350" font-size="18" font-weight="700" fill="#14532d">Baul songs</text><text x="655" y="377" font-size="15" fill="#14532d">Music tradition</text><rect x="760" y="315" width="170" height="90" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="845" y="350" font-size="18" font-weight="700" fill="#14532d">Jamdani</text><text x="845" y="377" font-size="15" fill="#14532d">Weaving skill</text></g><rect x="155" y="445" width="690" height="60" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="500" y="470" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#78350f">Safeguarding = documentation + community transmission</text><text x="500" y="493" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#78350f">Authenticity • access • conservation • living practitioners</text></svg>