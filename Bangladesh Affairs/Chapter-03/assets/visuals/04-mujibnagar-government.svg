<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">মুজিবনগর সরকার: কাঠামো ও কার্যাবলি</text><g font-family="sans-serif" text-anchor="middle"><rect x="245" y="85" width="410" height="75" rx="15" fill="#123047"/><text x="450" y="116" font-size="22" font-weight="700" fill="#fff">Proclamation of Independence</text><text x="450" y="141" font-size="16" fill="#e2e8f0">১০ এপ্রিল ১৯৭১ • আইনগত ভিত্তি</text><path d="M450 160 V200 M150 200 H750 M150 200 V225 M350 200 V225 M550 200 V225 M750 200 V225" stroke="#64748b" stroke-width="3" fill="none"/><rect x="55" y="225" width="190" height="90" rx="14" fill="#dbeafe" stroke="#7aa7d9"/><text x="150" y="258" font-size="20" font-weight="700" fill="#173e68">রাজনৈতিক</text><text x="150" y="284" font-size="16" fill="#173e68">বৈধতা ও নেতৃত্ব</text><rect x="255" y="225" width="190" height="90" rx="14" fill="#dcfce7" stroke="#86c69b"/><text x="350" y="258" font-size="20" font-weight="700" fill="#14532d">সামরিক</text><text x="350" y="284" font-size="16" fill="#14532d">যুদ্ধ ও সমন্বয়</text><rect x="455" y="225" width="190" height="90" rx="14" fill="#fef3c7" stroke="#e4bd55"/><text x="550" y="258" font-size="20" font-weight="700" fill="#854d0e">প্রশাসনিক</text><text x="550" y="284" font-size="16" fill="#854d0e">মন্ত্রণালয় ও সেবা</text><rect x="655" y="225" width="190" height="90" rx="14" fill="#f3e8ff" stroke="#b69ad9"/><text x="750" y="258" font-size="20" font-weight="700" fill="#6b21a8">কূটনৈতিক</text><text x="750" y="284" font-size="16" fill="#6b21a8">আন্তর্জাতিক জনমত</text><rect x="135" y="365" width="630" height="70" rx="16" fill="#ffe4e6" stroke="#e8a0a8"/><text x="450" y="395" font-size="21" font-weight="700" fill="#9f1239">১৭ এপ্রিল ১৯৭১: শপথ গ্রহণ</text><text x="450" y="419" font-size="16" fill="#9f1239">যুদ্ধ পরিচালনা ও স্বাধীন রাষ