<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Heritage protection cycle</title><desc id="d">Identify, document, conserve, involve communities, educate and review heritage preservation.</desc><rect width="1000" height="560" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">Heritage Protection: A Living Cycle</text><g font-family="sans-serif" text-anchor="middle"><rect x="350" y="82" width="300" height="62" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="120" font-size="22" font-weight="700" fill="#1e3a8a">1. Identify and inventory</text><rect x="650" y="180" width="280" height="62" rx="15" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="790" y="218" font-size="22" font-weight="700" fill="#14532d">2. Document evidence</text><rect x="650" y="315" width="280" height="62" rx="15" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="790" y="353" font-size="22" font-weight="700" fill="#78350f">3. Conserve responsibly</text><rect x="350" y="420" width="300" height="62" rx="15" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="500" y="458" font-size="22" font-weight="700" fill="#581c87">4. Teach and transmit</text><rect x="70" y="315" width="280" height="62" rx="15" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="210" y="353" font-size="22" font-weight="700" fill="#7f1d1d">5. Community-led practice</text><rect x="70" y="180" width="280" height="62" rx="15" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="210" y="218" font-size="22" font-weight="700" fill="#164e63">6. Review and improve</text><g stroke="#64748b" stroke-width="3" fill="none"><path d="M650 113 L790 180"/><path d="M790 242 V315"/><path d="M650 346 L650 451"/><path d="M350 451 L210 377"/><path d="M210 315 V242"/><path d="M350 211 L420 144"/></g><text x="500" y="520" font-size="18" font-weight="700" fill="#334155">People who practise a tradition must help shape its safeguarding.</text></g></svg>