<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><rect width="900" height="480" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">BCS Written: ২০ নম্বরের উত্তর</text><g font-family="sans-serif" text-anchor="middle"><rect x="170" y="80" width="560" height="52" rx="12" fill="#dbeafe"/><text x="450" y="112" font-size="20" font-weight="700" fill="#173e68">১. ভূমিকা ও মূল বক্তব্য</text><path d="M450 132 V151" stroke="#64748b" stroke-width="3"/><rect x="170" y="151" width="560" height="52" rx="12" fill="#dcfce7"/><text x="450" y="183" font-size="20" font-weight="700" fill="#14532d">২. পটভূমি ও কারণ</text><path d="M450 203 V222" stroke="#64748b" stroke-width="3"/><rect x="170" y="222" width="560" height="52" rx="12" fill="#fef3c7"/><text x="450" y="254" font-size="20" font-weight="700" fill="#854d0e">৩. ঘটনাপ্রবাহ ও বিভিন্ন পক্ষের ভূমিকা</text><path d="M450 274 V293" stroke="#64748b" stroke-width="3"/><rect x="170" y="293" width="560" height="52" rx="12" fill="#f3e8ff"/><text x="450" y="325" font-size="20" font-weight="700" fill="#6b21a8">৪. প্রমাণ, ফলাফল ও ঐতিহাসিক তাৎপর্য</text><path d="M450 345 V364" stroke="#64748b" stroke-width="3"/><rect x="170" y="364" width="560" height="52" rx="12" fill="#ffe4e6"/><text x="450" y="396" font-size="20" font-weight="700" fill="#9f1239">৫. সমালোচনামূলক মূল্যায়ন ও উপসংহার</text><text x="450" y="450" font-size="17" fill="#475569">প্রাসঙ্গিক উৎসের নাম দিন; অযাচাইকৃত উদ্ধৃতি/সংখ্যা ব্যবহার করবেন না</text></g></svg>