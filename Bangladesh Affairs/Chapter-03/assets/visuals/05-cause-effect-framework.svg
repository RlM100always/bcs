<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><rect width="900" height="460" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">ইতিহাস বিশ্লেষণের কারণ–ফল কাঠামো</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="115" width="180" height="100" rx="14" fill="#dbeafe" stroke="#7aa7d9"/><text x="145" y="153" font-size="21" font-weight="700" fill="#173e68">পটভূমি</text><text x="145" y="180" font-size="16" fill="#173e68">রাজনীতি • অর্থনীতি</text><rect x="260" y="115" width="180" height="100" rx="14" fill="#dcfce7" stroke="#86c69b"/><text x="350" y="153" font-size="21" font-weight="700" fill="#14532d">ঘটনা</text><text x="350" y="180" font-size="16" fill="#14532d">নেতৃত্ব • সংগঠন</text><rect x="465" y="115" width="180" height="100" rx="14" fill="#fef3c7" stroke="#e4bd55"/><text x="555" y="153" font-size="21" font-weight="700" fill="#854d0e">তাৎক্ষণিক ফল</text><text x="555" y="180" font-size="16" fill="#854d0e">প্রতিক্রিয়া • পরিবর্তন</text><rect x="670" y="115" width="180" height="100" rx="14" fill="#f3e8ff" stroke="#b69ad9"/><text x="760" y="153" font-size="21" font-weight="700" fill="#6b21a8">দীর্ঘমেয়াদি প্রভাব</text><text x="760" y="180" font-size="16" fill="#6b21a8">রাষ্ট্র • সমাজ • স্মৃতি</text><path d="M235 165 H253 M440 165 H458 M645 165 H663" stroke="#64748b" stroke-width="3"/><rect x="130" y="275" width="640" height="95" rx="18" fill="#123047"/><text x="450" y="313" font-size="22" font-weight="700" fill="#fff">সমালোচনামূলক মূল্যায়ন</text><text x="450" y="342" font-size="17" fill="#e2e8f0">প্রমাণ • বিভিন্ন পক্ষ • সীমাবদ্ধতা • উৎসের নির্ভরযোগ্যতা</text><text x="450" y="415" font-size="18" fill="#475569">এই কাঠামো দিয়ে ৫/১০/২০ নম্বরের উত্তর গঠন করুন</text></g></svg>