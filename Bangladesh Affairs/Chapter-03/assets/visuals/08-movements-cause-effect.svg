<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">From rights movements to independence</title><desc id="d">Language rights, political representation, autonomy demands, mass uprising and electoral mandate contributed to the non-cooperation movement and liberation war.</desc><rect width="1000" height="620" rx="24" fill="#fff"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">From Language Rights to Independence</text><g font-family="sans-serif" text-anchor="middle"><rect x="70" y="88" width="250" height="70" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="195" y="117" font-size="20" font-weight="700" fill="#1e3a8a">1948–52</text><text x="195" y="141" font-size="17" fill="#1e3a8a">Language rights</text><rect x="375" y="88" width="250" height="70" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="500" y="117" font-size="20" font-weight="700" fill="#14532d">1954</text><text x="500" y="141" font-size="17" fill="#14532d">Electoral mandate</text><rect x="680" y="88" width="250" height="70" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="805" y="117" font-size="20" font-weight="700" fill="#78350f">1966</text><text x="805" y="141" font-size="17" fill="#78350f">Six-Point autonomy</text><path d="M320 123 H375 M625 123 H680" stroke="#64748b" stroke-width="3"/><rect x="680" y="220" width="250" height="70" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="805" y="249" font-size="20" font-weight="700" fill="#581c87">1969</text><text x="805" y="273" font-size="17" fill="#581c87">Mass uprising</text><rect x="375" y="220" width="250" height="70" rx="14" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="500" y="249" font-size="20" font-weight="700" fill="#164e63">1970</text><text x="500" y="273" font-size="17" fill="#164e63">General election</text><rect x="70" y="220" width="250" height="70" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="195" y="249" font-size="20" font-weight="700" fill="#7f1d1d">March 1971</text><text x="195" y="273" font-size="17" fill="#7f1d1d">Non-cooperation</text><path d="M805 158 V190 H805 V220 M680 255 H625 M375 255 H320" stroke="#64748b" stroke-width="3" fill="none"/><path d="M195 290 V350 H500 V390" stroke="#64748b" stroke-width="3" fill="none"/><rect x="260" y="390" width="480" height="80" rx="16" fill="#0f172a"/><text x="500" y="422" font-size="23" font-weight="700" fill="#fff">1971 Liberation War</text><text x="500" y="450" font-size="18" fill="#e2e8f0">People’s resistance • wartime government • global diplomacy</text><path d="M500 470 V500" stroke="#64748b" stroke-width="3"/><rect x="210" y="500" width="580" height="70" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="500" y="529" font-size="20" font-weight="700" fill="#14532d">16 December 1971 — Victory</text><text x="500" y="552" font-size="16" fill="#14532d">Long-term outcome of accumulated political, cultural and social struggles</text></g></svg>