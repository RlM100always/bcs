<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><rect width="900" height="480" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">ছয় দফা থেকে নির্বাচনী ম্যান্ডেট</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="100" width="245" height="92" rx="14" fill="#dbeafe" stroke="#7aa7d9"/><text x="177" y="134" font-size="21" font-weight="700" fill="#173e68">ছয় দফা • ১৯৬৬</text><text x="177" y="161" font-size="16" fill="#173e68">স্বায়ত্তশাসন ও রাজস্ব ক্ষমতা</text><rect x="328" y="100" width="245" height="92" rx="14" fill="#dcfce7" stroke="#86c69b"/><text x="450" y="134" font-size="21" font-weight="700" fill="#14532d">গণঅভ্যুত্থান • ১৯৬৯</text><text x="450" y="161" font-size="16" fill="#14532d">দমননীতির বিরুদ্ধে গণচাপ</text><rect x="600" y="100" width="245" height="92" rx="14" fill="#fef3c7" stroke="#e4bd55"/><text x="722" y="134" font-size="21" font-weight="700" fill="#854d0e">নির্বাচন • ১৯৭০</text><text x="722" y="161" font-size="16" fill="#854d0e">সংখ্যাগরিষ্ঠতার ম্যান্ডেট</text><path d="M300 146 H320 M573 146 H592" stroke="#64748b" stroke-width="3"/><path d="M722 192 V230 H177 V192" stroke="#64748b" stroke-width="3" fill="none"/><rect x="100" y="255" width="700" height="100" rx="18" fill="#123047"/><text x="450" y="292" font-size="23" font-weight="700" fill="#fff">ক্ষমতা হস্তান্তরের সংকট</text><text x="450" y="322" font-size="17" fill="#e2e8f0">রাজনৈতিক অচলাবস্থা → অসহযোগ → মুক্তিযুদ্ধের প্রেক্ষাপট</text><text x="450" y="405" font-size="18" fill="#475569">কারণ–ফল বিশ্লেষণে প্রতিটি ধাপের যোগসূত্র লিখুন</text></g></svg>