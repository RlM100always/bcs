<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510"><rect width="900" height="510" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">ভাষা আন্দোলন থেকে স্বাধীনতা</text><g font-family="sans-serif" text-anchor="middle"><rect x="60" y="95" width="230" height="78" rx="14" fill="#dbeafe" stroke="#7aa7d9"/><text x="175" y="126" font-size="20" font-weight="700" fill="#173e68">১৯৫২</text><text x="175" y="151" font-size="16" fill="#173e68">ভাষাগত অধিকার</text><rect x="335" y="95" width="230" height="78" rx="14" fill="#dcfce7" stroke="#86c69b"/><text x="450" y="126" font-size="20" font-weight="700" fill="#14532d">১৯৫৪–৬৬</text><text x="450" y="151" font-size="16" fill="#14532d">নির্বাচন ও স্বায়ত্তশাসন</text><rect x="610" y="95" width="230" height="78" rx="14" fill="#fef3c7" stroke="#e4bd55"/><text x="725" y="126" font-size="20" font-weight="700" fill="#854d0e">১৯৬৯–৭০</text><text x="725" y="151" font-size="16" fill="#854d0e">গণঅভ্যুত্থান ও ম্যান্ডেট</text><path d="M290 134 H328 M565 134 H603" stroke="#64748b" stroke-width="3"/><path d="M725 173 V220 H175 V173" stroke="#64748b" stroke-width="3" fill="none"/><rect x="60" y="245" width="230" height="78" rx="14" fill="#f3e8ff" stroke="#b69ad9"/><text x="175" y="276" font-size="20" font-weight="700" fill="#6b21a8">৭ মার্চ</text><text x="175" y="301" font-size="16" fill="#6b21a8">ভাষণ ও অসহযোগ</text><rect x="335" y="245" width="230" height="78" rx="14" fill="#ffe4e6" stroke="#e8a0a8"/><text x="450" y="276" font-size="20" font-weight="700" fill="#9f1239">১০–১৭ এপ্রিল</text><text x="450" y="301" font-size="16" fill="#9f1239">ঘোষণাপত্র ও সরকার</text><rect x="610" y="245" width="230" height="78" rx="14" fill="#dbeafe" stroke="#7aa7d9"/><text x="725" y="276" font-size="20" font-weight="700" fill="#173e68">১৬ ডিসেম্বর</text><text x="725" y="301" font-size="16" fill="#173e68">বিজয়</text><path d="M290 284 H328 M565 284 H603" stroke="#64748b" stroke-width="3"/><rect x="130" y="370" width="640" height="75" rx="16" fill="#123047"/><text x="450" y="400" font-size="21" font-weight="700" fill="#fff">ধারাবাহিকতা: অধিকার → স্বায়ত্তশাসন → গণরায়</text><text x="450" y="426" font-size="17" fill="#e2e8f0">→ অসহযোগ ও প্রতিরোধ → মুক্তিযুদ্ধ → স্বাধীনতা</text></g></svg>