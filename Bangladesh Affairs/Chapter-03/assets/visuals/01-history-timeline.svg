<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123047">বাংলাদেশের ইতিহাস: দীর্ঘ সময়রেখা</text><g font-family="sans-serif"><path d="M110 95 V490" stroke="#94a3b8" stroke-width="5"/><g><circle cx="110" cy="120" r="10" fill="#2563eb"/><rect x="145" y="88" width="680" height="62" rx="12" fill="#dbeafe"/><text x="165" y="113" font-size="18" font-weight="700" fill="#173e68">প্রাচীন ও মধ্যযুগ</text><text x="165" y="135" font-size="15" fill="#173e68">জনপদ • পাল-সেন • সুলতানি ও মুঘল বাংলা</text></g><g><circle cx="110" cy="195" r="10" fill="#0f766e"/><rect x="145" y="163" width="680" height="62" rx="12" fill="#ccfbf1"/><text x="165" y="188" font-size="18" font-weight="700" fill="#115e59">ঔপনিবেশিক যুগ</text><text x="165" y="210" font-size="15" fill="#115e59">১৭৫৭ পলাশী • ১৭৬৫ দেওয়ানি • ১৭৯৩ চিরস্থায়ী বন্দোবস্ত</text></g><g><circle cx="110" cy="270" r="10" fill="#a16207"/><rect x="145" y="238" width="680" height="62" rx="12" fill="#fef3c7"/><text x="165" y="263" font-size="18" font-weight="700" fill="#854d0e">বঙ্গভঙ্গ থেকে দেশভাগ</text><text x="165" y="285" font-size="15" fill="#854d0e">১৯০৫ বঙ্গভঙ্গ • ১৯৪৭ দেশভাগ</text></g><g><circle cx="110" cy="345" r="10" fill="#7c3aed"/><rect x="145" y="313" width="680" height="62" rx="12" fill="#ede9fe"/><text x="165" y="338" font-size="18" font-weight="700" fill="#5b21b6">ভাষা ও স্বায়ত্তশাসনের সংগ্রাম</text><text x="165" y="360" font-size="15" fill="#5b21b6">১৯৫২ ভাষা • ১৯৫৪ নির্বাচন • ১৯৬৬ ছয় দফা • ১৯৬৯ গণঅভ্যুত্থান</text></g><g><circle cx="110" cy="420" r="10" fill="#be123c"/><rect x="145" y="388" width="680" height="62" rx="12" fill="#ffe4e6"/><text x="165" y="413" font-size="18" font-weight="700" fill="#9f1239">স্বাধীনতার সংগ্রাম</text><text x="165" y="435" font-size="15" fill="#9f1239">১৯৭০ নির্বাচন • ৭ মার্চ • মুজিবনগর সরকার • ১৬ ডিসেম্বর ১৯৭১</text></g><text x="450" y="510" text-anchor="middle" font-size="17" fill="#475569">তারিখ মুখস্থের পাশাপাশি প্রতিটি পর্যায়ের কারণ ও দীর্ঘমেয়াদি তাৎপর্য বুঝুন</text></g></svg>