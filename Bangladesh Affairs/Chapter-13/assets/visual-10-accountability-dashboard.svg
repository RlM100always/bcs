<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" rx="28" fill="#f8fafc"/><text x="500" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d">NGO Accountability: A Practical Dashboard</text><g font-family="Arial,sans-serif" fill="#17324d"><rect x="65" y="110" width="420" height="140" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95" y="150" font-size="24" font-weight="700">Financial transparency</text><text x="95" y="188" font-size="18">• Audited accounts and donor disclosure</text><text x="95" y="220" font-size="18">• Procurement and conflict-of-interest controls</text><rect x="515" y="110" width="420" height="140" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="545" y="150" font-size="24" font-weight="700">Programme effectiveness</text><text x="545" y="188" font-size="18">• Baselines, targets and verified outcomes</text><text x="545" y="220" font-size="18">• Independent evaluation and learning</text><rect x="65" y="285" width="420" height="140" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="95" y="325" font-size="24" font-weight="700">Community accountability</text><text x="95" y="363" font-size="18">• Accessible complaints and feedback</text><text x="95" y="395" font-size="18">• Participation and public reporting</text><rect x="515" y="285" width="420" height="140" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="545" y="325" font-size="24" font-weight="700">Safeguarding &amp; ethics</text><text x="545" y="363" font-size="18">• Protection from exploitation and abuse</text><text x="545" y="395" font-size="18">• Confidential, survivor-centred response</text></g></svg>