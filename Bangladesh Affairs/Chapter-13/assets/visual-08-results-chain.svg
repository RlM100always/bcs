<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><rect width="1000" height="430" rx="28" fill="#f8fafc"/><text x="500" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d">NGO Monitoring &amp; Evaluation: Results Chain</text><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d"><rect x="35" y="140" width="170" height="110" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120" y="185" font-size="23" font-weight="700">Inputs</text><text x="120" y="218" font-size="17">Budget, staff</text><rect x="235" y="140" width="170" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="320" y="185" font-size="23" font-weight="700">Activities</text><text x="320" y="218" font-size="17">Training, services</text><rect x="435" y="140" width="170" height="110" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="520" y="185" font-size="23" font-weight="700">Outputs</text><text x="520" y="218" font-size="17">People reached</text><rect x="635" y="140" width="150" height="110" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="710" y="185" font-size="23" font-weight="700">Outcomes</text><text x="710" y="218" font-size="17">Behaviour / access</text><rect x="815" y="140" width="150" height="110" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="890" y="185" font-size="23" font-weight="700">Impact</text><text x="890" y="218" font-size="17">Long-term change</text></g><g stroke="#334155" stroke-width="3" fill="none"><path d="M205 195h25m-8 -8 8 8 -8 8M405 195h25m-8 -8 8 8 -8 8M605 195h25m-8 -8 8 8 -8 8M785 195h25m-8 -8 8 8 -8 8"/></g><text x="500" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#334155">Track indicators at each stage; disaggregate results by gender, age, disability and location where relevant.</text><text x="500" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64748b">A results chain is a planning model, not proof of causal impact.</text></svg>