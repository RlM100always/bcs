<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Civil society ecosystem</title><desc id="desc">Citizens and communities connect with civil society organisations, government, media, academia and private sector through participation and accountability.</desc>
<rect width="1200" height="720" rx="28" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">CIVIL SOCIETY ECOSYSTEM</text>
<g stroke="#94a3b8" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M600 345 L600 180"/><path d="M600 345 L290 245"/><path d="M600 345 L910 245"/><path d="M600 345 L300 500"/><path d="M600 345 L900 500"/><path d="M600 345 L600 585"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="425" y="260" width="350" height="170" rx="28" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="600" y="320" font-size="30" font-weight="700" fill="#1d4ed8">CIVIL SOCIETY</text><text x="600" y="362" font-size="22" fill="#1e293b">Voice • Participation</text><text x="600" y="394" font-size="22" fill="#1e293b">Service • Accountability</text>
<rect x="440" y="95" width="320" height="95" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="600" y="135" font-size="25" font-weight="700" fill="#166534">Citizens & Communities</text><text x="600" y="165" font-size="19" fill="#14532d">Needs, feedback, local knowledge</text>
<rect x="65" y="170" width="320" height="110" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="225" y="213" font-size="25" font-weight="700" fill="#92400e">Government</text><text x="225" y="246" font-size="19" fill="#78350f">Public duties, law, services</text>
<rect x="815" y="170" width="320" height="110" rx="20" fill="#fce7f3" stroke="#db2777" stroke-width="3"/><text x="975" y="213" font-size="25" font-weight="700" fill="#9d174d">Media</text><text x="975" y="246" font-size="19" fill="#831843">Information and scrutiny</text>
<rect x="70" y="460" width="320" height="110" rx="20" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="230" y="503" font-size="25" font-weight="700" fill="#3730a3">Academia & Research</text><text x="230" y="536" font-size="19" fill="#312e81">Evidence and evaluation</text>
<rect x="810" y="460" width="320" height="110" rx="20" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="970" y="503" font-size="25" font-weight="700" fill="#6b21a8">Private Sector</text><text x="970" y="536" font-size="19" fill="#581c87">Jobs, markets, resources</text>
<rect x="420" y="575" width="360" height="90" rx="20" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><text x="600" y="612" font-size="25" font-weight="700" fill="#334155">Development Partners</text><text x="600" y="641" font-size="19" fill="#334155">Funding and technical support</text>
</g>
<text x="600" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">Effective ecosystem requires inclusion, transparent roles and accountability in every direction.</text>
</svg>