<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect width="1000" height="600" rx="28" fill="#f8fafc"/><text x="500" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d">NGO Regulation: Which Route Applies?</text><rect x="330" y="90" width="340" height="78" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#17324d"><tspan x="500">Organisation plans</tspan><tspan x="500" dy="28">voluntary activities</tspan></text><path d="M500 168V205" stroke="#334155" stroke-width="3"/><path d="M493 197l7 10 7 -10" fill="none" stroke="#334155" stroke-width="3"/><path d="M500 205L250 260M500 205L750 260" stroke="#334155" stroke-width="3" fill="none"/><rect x="70" y="260" width="360" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="250" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#17324d"><tspan x="250">Domestic-only activity?</tspan><tspan x="250" dy="30">Check applicable registration</tspan><tspan x="250" dy="27">and sector-specific laws</tspan></text><rect x="570" y="260" width="360" height="120" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="750" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#17324d"><tspan x="750">Foreign donations involved?</tspan><tspan x="750" dy="30">Check NGO Affairs Bureau</tspan><tspan x="750" dy="27">requirements and project rules</tspan></text><path d="M250 380V418m-7 -10 7 10 7 -10M750 380V418m-7 -10 7 10 7 -10" stroke="#334155" stroke-width="3" fill="none"/><rect x="80" y="420" width="340" height="85" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="250" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324d"><tspan x="250">Confirm current regulator</tspan><tspan x="250" dy="26">and legal form</tspan></text><rect x="580" y="420" width="340" height="85" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="750" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324d"><tspan x="750">Registration, approval, audit</tspan><tspan x="750" dy="26">and reporting as applicable</tspan></text><text x="500" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#b45309">Illustrative only — verify current law, amendments and organisation-specific obligations.</text></svg>