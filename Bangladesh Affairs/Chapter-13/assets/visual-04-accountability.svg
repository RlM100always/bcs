<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Accountability framework for NGOs</title><desc id="desc">Four pillars of accountability: transparent finance, community participation, independent review, and safeguarding.</desc>
<rect width="1200" height="650" rx="28" fill="#f8fafc"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">ACCOUNTABILITY FRAMEWORK</text>
<path d="M180 520 L1020 520 L600 140 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="90" y="205" width="430" height="110" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="305" y="248" font-size="27" font-weight="700" fill="#1d4ed8">Transparent Finance</text><text x="305" y="282" font-size="20" fill="#1e293b">Budgets • audits • reporting</text>
<rect x="680" y="205" width="430" height="110" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="895" y="248" font-size="27" font-weight="700" fill="#166534">Community Voice</text><text x="895" y="282" font-size="20" fill="#14532d">Feedback • complaints • consent</text>
<rect x="90" y="365" width="430" height="110" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="305" y="408" font-size="27" font-weight="700" fill="#92400e">Independent Review</text><text x="305" y="442" font-size="20" fill="#78350f">Evaluation • conflicts of interest</text>
<rect x="680" y="365" width="430" height="110" rx="20" fill="#fce7f3" stroke="#db2777" stroke-width="3"/><text x="895" y="408" font-size="27" font-weight="700" fill="#9d174d">Safeguarding</text><text x="895" y="442" font-size="20" fill="#831843">Safety • privacy • protection</text>
<rect x="390" y="530" width="420" height="70" rx="18" fill="#172033"/><text x="600" y="574" font-size="26" font-weight="700" fill="#ffffff">Trustworthy Public Benefit</text>
</g>
</svg>