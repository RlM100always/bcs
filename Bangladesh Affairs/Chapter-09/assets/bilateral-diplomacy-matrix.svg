<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" rx="24" fill="#f8fafc"/><text x="480" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">Bangladesh Bilateral Diplomacy Matrix</text><text x="480" y="82" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#475569">Illustrative issue map — not a ranking of partners</text><g font-family="Arial,sans-serif"><rect x="40" y="125" width="275" height="190" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="177" y="165" font-size="23" font-weight="700" text-anchor="middle" fill="#1e3a8a">Neighbourhood</text><text x="65" y="205" font-size="17" fill="#1e293b">• Water and borders</text><text x="65" y="237" font-size="17" fill="#1e293b">• Trade and connectivity</text><text x="65" y="269" font-size="17" fill="#1e293b">• Energy and security</text><rect x="342" y="125" width="275" height="190" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="479" y="165" font-size="23" font-weight="700" text-anchor="middle" fill="#14532d">Major markets</text><text x="367" y="205" font-size="17" fill="#1e293b">• Market access</text><text x="367" y="237" font-size="17" fill="#1e293b">• Labour and standards</text><text x="367" y="269" font-size="17" fill="#1e293b">• Investment and technology</text><rect x="644" y="125" width="275" height="190" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="781" y="165" font-size="23" font-weight="700" text-anchor="middle" fill="#78350f">Development partners</text><text x="669" y="205" font-size="17" fill="#1e293b">• Project appraisal</text><text x="669" y="237" font-size="17" fill="#1e293b">• Climate and skills</text><text x="669" y="269" font-size="17" fill="#1e293b">• Debt and transparency</text><path d="M177 315 V365 H480 M479 315 V365 M781 315 V365 H480 V395" fill="none" stroke="#64748b" stroke-width="3"/><rect x="220"