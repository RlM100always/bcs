<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570"><rect width="960" height="570" rx="24" fill="#f8fafc"/><text x="480" y="50" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">Rohingya Response: Parallel Diplomatic Tracks</text><rect x="300" y="90" width="360" height="82" rx="18" fill="#0f172a"/><text x="480" y="123" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">Core objective</text><text x="480" y="151" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#e2e8f0">Voluntary, safe, dignified, sustainable return</text><path d="M480 172 V207 H165 V235 M480 207 V235 M480 207 H795 V235" fill="none" stroke="#64748b" stroke-width="3"/><g font-family="Arial,sans-serif"><rect x="35" y="235" width="260" height="160" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="165" y="275" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3a8a">Diplomatic track</text><text x="58" y="314" font-size="17" fill="#1e293b">• Myanmar engagement</text><text x="58" y="344" font-size="17" fill="#1e293b">• Regional pressure</text><text x="58" y="374" font-size="17" fill="#1e293b">• UN and partners</text><rect x="350" y="235" width="260" height="160" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="480" y="275" font-size="22" font-weight="700" text-anchor="middle" fill="#14532d">Protection track</text><text x="373" y="314" font-size="17" fill="#1e293b">• Rights and safety</text><text x="373" y="344" font-size="17" fill="#1e293b">• Accountability</text><text x="373" y="374" font-size="17" fill="#1e293b">• No forced return</text><rect x="665" y="235" width="260" height="160" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="795" y="275" font-size="22" font-weight="700" text-anchor="middle" fill="#78350f">Host-community track</text><text x="688" y="314" font-size="17" fill="#1e293b">• Services and livelihoods</text><text x="688" y="344" font-size="17" fill="#1e293b">• Environment support</text><text x="688" y="374" font-size="17" fill="#1e293b">• Predictable funding</text><path d="M165 395 V430 H480 M480 395 V430 M795 395 V430 H480 V450" fill="none" stroke="#64748b" stroke-width="3"/><rect x="180" y="450" width="600" height="70" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="480" y="480" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#0f172a">Monitor outcomes and keep conditions rights-based</text><text x="480" y="505" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#334155">Humanitarian assistance and durable-solution diplomacy must proceed together.</text></g></svg>