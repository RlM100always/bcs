<title id="title">Foreign policy themes in BCS Bangladesh Affairs 35th to 47th</title>
<desc id="desc">Editorial review of public question archive transcripts. Direct foreign-policy or external-relations prompts were identified in 7 of 11 regular general-cadre Bangladesh Affairs papers; 39th and 42nd special BCS series are excluded. 36th has no direct item identified; 40th, 43rd and 44th have adjacent themes.</desc>
