<text x="600" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#075985">How to interpret this chart</text>
<text x="600" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0c4a6e">Rank is not the same as personnel count, mission impact or total contribution.</text>
