<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="t d"><title id="t">Layers of Bangladesh's national interest</title><desc id="d">National sovereignty and security at the core, linked to economic welfare, citizens, international standing, and long-term resilience.</desc><rect width="1000" height="570" rx="24" fill="#fff"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">Layers of National Interest</text><circle cx="500" cy="300" r="105" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="500" y="284" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">Sovereignty</text><text x="500" y="315" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">&amp; Security</text><rect x="60" y="130" width="250" height="85" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="185" y="166" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#14532d">Economic welfare</text><text x="185" y="194" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#14532d">Trade • jobs • investment</text><rect x="690" y="130" width="250" height="85" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="815" y="166" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#78350f">Citizen protection</text><text x="815" y="194" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#78350f">Diaspora • labour rights</text><rect x="60" y="390" width="250" height="85" rx="16" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="185" y="426" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#581c87">Global standing</text><text x="185" y="454" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#581c87">UN • law • diplomacy</text><rect x="690" y="390" width="250" height="85" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="815" y="426" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#7f1d1d">Long-term resilience</text><text x="815" y="454" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7f1d1d">Climate • supply chains</text><g stroke="#64748b" stroke-width="3" fill="none"><path d="M310 172 L415 238"/><path d="M690 172 L585 238"/><path d="M310 432 L415 362"/><path d="M690 432 L585 362"/></g><text x="500" y="535" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">Use these layers to structure “national interest” and policy-evaluation essays.</text></svg>