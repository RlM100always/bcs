<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Foreign policy formulation cycle</title><desc id="d">Seven steps from national interest and evidence to options, coordination, decision, diplomacy, and evaluation.</desc><rect width="1000" height="600" rx="24" fill="#f8fafc"/><text x="500" y="50" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">Foreign Policy Formulation Cycle</text><g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a"><rect x="340" y="85" width="320" height="58" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="121">1. National interest &amp; problem</text><rect x="620" y="180" width="300" height="58" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="770" y="216">2. Evidence &amp; analysis</text><rect x="620" y="280" width="300" height="58" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="770" y="316">3. Policy options</text><rect x="340" y="380" width="320" height="58" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="500" y="416">4. Inter-agency coordination</text><rect x="80" y="280" width="300" height="58" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="230" y="316">5. Decision &amp; approval</text><rect x="80" y="180" width="300" height="58" rx="14" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="230" y="216">6. Diplomatic action</text><rect x="340" y="485" width="320" height="58" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="500" y="521">7. Review, learn &amp; adjust</text></g><g stroke="#64748b" stroke-width="3" fill="none"><path d="M660 114 L770 180"/><path d="M770 238 V280"/><path d="M620 338 L600 380"/><path d="M340 409 L230 338"/><path d="M230 280 V238"/><path d="M380 209 L340 114"/><path d="M500 438 V485"/></g><text x="500" y="575" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">Analytical framework for exam answers; not an official government flowchart.</text></svg>