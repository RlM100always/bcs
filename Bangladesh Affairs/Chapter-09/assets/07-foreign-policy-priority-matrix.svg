<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Bangladesh foreign-policy priorities matrix</title>
<desc id="desc">Four connected policy priorities: protect sovereignty and citizens, diversify the economy, build regional cooperation, and deliver global public goods through UN peacekeeping and climate diplomacy. All are subject to Article 25 and international law.</desc>
<rect width="1200" height="680" rx="28" fill="#f8fafc"/>
<text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">FOREIGN-POLICY PRIORITIES: FROM PRINCIPLE TO DELIVERY</text>
<text x="600" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#475569">BCS Written answer-planning matrix</text>
<g stroke="#94a3b8" stroke-width="4" fill="none">
<path d="M600 170 L310 270"/><path d="M600 170 L890 270"/><path d="M310 390 L470 495"/><path d="M890 390 L730 495"/>
</g>
<rect x="355" y="105" width="490" height="90" rx="20" fill="#172033"/>
<text x="600" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">CONSTITUTIONAL ANCHOR</text>
<text x="600" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#e2e8f0">Article 25 • sovereignty • peace • international law</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="70" y="240" width="480" height="150" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="310" y="280" font-size="27" font-weight="700" fill="#1d4ed8">1. Sovereignty &amp; Citizens</text>
<text x="310" y="317" font-size="20" fill="#1e293b">Security • migrant protection</text><text x="310" y="348" font-size="19" fill="#1e293b">Rohingya • legal safeguards</text>
<rect x="650" y="240" width="480" height="150" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="890" y="280" font-size="27" font-weight="700" fill="#166534">2. Economic Diversification</text>
<text x="890" y="317" font-size="20" fill="#14532d">Markets • investment • technology</text><text x="890" y="348" font-size="19" fill="#14532d">Trade rules • safe migration</text>
<rect x="70" y="465" width="480" height="150" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="310" y="505" font-size="27" font-weight="700" fill="#92400e">3. Regional Cooperation</text>
<text x="310" y="542" font-size="20" fill="#78350f">India • Myanmar • BIMSTEC</text><text x="310" y="573" font-size="19" fill="#78350f">Water • borders • Bay of Bengal</text>
<rect x="650" y="465" width="480" height="150" rx="22" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
<text x="890" y="505" font-size="27" font-weight="700" fill="#6b21a8">4. Global Public Goods</text>
<text x="890" y="542" font-size="20" fill="#581c87">UN peacekeeping • climate finance</text><text x="890" y="573" font-size="19" fill="#581c87">Multilateral law • crisis response</text>
</g>
<text x="600" y="652" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64748b">Evaluate every policy by national interest, cost, legal obligations, risk and measurable outcomes.</text>
</svg>