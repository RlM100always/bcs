<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Bangladesh regional geopolitical connections</title>
<desc id="desc">A conceptual diagram, not a geographic map, showing Bangladesh connected to India, Myanmar, the Bay of Bengal, South Asia and Southeast Asia through trade, security, climate and humanitarian diplomacy.</desc>
<rect width="1200" height="760" rx="28" fill="#f8fafc"/>
<text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">BANGLADESH: REGIONAL GEOPOLITICS</text>
<text x="600" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#475569">Conceptual relationship diagram — not to scale; not a boundary map</text>
<g stroke="#94a3b8" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M420 250 L280 195"/><path d="M780 250 L920 195"/><path d="M420 410 L275 490"/><path d="M780 410 L930 490"/><path d="M600 465 L600 565"/>
<path d="M420 250 L280 195"/><path d="M780 250 L920 195"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="420" y="205" width="360" height="260" rx="28" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="600" y="270" font-size="34" font-weight="700" fill="#1d4ed8">BANGLADESH</text>
<text x="600" y="312" font-size="22" fill="#1e293b">Article 25 • National interest</text>
<text x="600" y="348" font-size="20" fill="#1e293b">Trade • Security • Climate</text>
<text x="600" y="381" font-size="20" fill="#1e293b">Humanitarian diplomacy</text>
