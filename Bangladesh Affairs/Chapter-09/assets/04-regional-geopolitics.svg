<text x="225" y="163" font-size="27" font-weight="700" fill="#166534">INDIA</text><text x="225" y="197" font-size="19" fill="#14532d">Water • Border • Trade</text><text x="225" y="224" font-size="18" fill="#14532d">Power • Connectivity</text>
<rect x="820" y="120" width="310" height="130" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="975" y="163" font-size="27" font-weight="700" fill="#92400e">CHINA</text><text x="975" y="197" font-size="19" fill="#78350f">Trade • Infrastructure</text><text x="975" y="224" font-size="18" fill="#78350f">Debt &amp; project appraisal</text>
