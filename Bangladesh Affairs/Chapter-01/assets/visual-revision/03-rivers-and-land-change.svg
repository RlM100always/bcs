<text x="108" y="560" font-family="Noto Sans Bengali, Noto Sans, Arial,sans-serif" font-size="21" font-weight="800" fill="#17324d">Erosion — ক্ষয়</text>
<text x="108" y="591" font-family="Noto Sans Bengali, Noto Sans, Arial,sans-serif" font-size="17" font-weight="500" fill="#29455e">স্রোতের আঘাতে তীর বা নদীতল ক্ষয় হয়; বসতি, কৃষিজমি ও অবকাঠামো ক্ষতিগ্রস্ত হতে পারে।</text><rect x="36" y="660" width="828" height="118" rx="16" fill="#eaf5ff" stroke="#b5d9f2" stroke-width="2"/>
<circle cx="72" cy="698" r="20" fill="#287ab4"/><text x="72" y="706" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="108" y="696" font-family="Noto Sans Bengali, Noto Sans, Arial,sans-serif" font-size="21" font-weight="800" fill="#17324d">Deposition — সঞ্চয়</text>
<text x="108" y="727" font-family="Noto Sans Bengali, Noto Sans, Arial,sans-serif" font-size="17" font-weight="500" fill="#29455e">স্রোতের গতি কমলে পলি জমে চর, বালুচর ও নতুন ভূমিরূপ তৈরি হতে পারে।</text><rect x="36" y="796" width="828" height="118" rx="16" fill="#fff4df" stroke="#eed39b" stroke-width="2"/>
<circle cx="72" cy="834" r="20" fill="#bb7a20"/><text x="72" y="842" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="108" y="832" font-family="Noto Sans Bengali, Noto Sans, Arial,sans-serif" font-size="21" font-weight="800" fill="#17324d">Channel change — গতিপথ পরিবর্তন</text>
<text x="108" y="863" font-family="Noto Sans Bengali, Noto Sans, Arial,sans-serif" font-size="17" font-weight="500" fill="#29455e">বাঁক বৃদ্ধি, তীরভাঙন ও কখনো গতিপথ বদল নদী-নির্ভর মানুষের জীবন ও পরিকল্পনায় প্রভাব ফেলে।</text>
