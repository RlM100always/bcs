<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="t d"><title id="t">Liberation War operational structure</title><desc id="d">How political leadership, sectors, guerrilla resistance and allied operations contributed to victory.</desc><rect width="1100" height="500" rx="22" fill="#f8fafc"/><text x="550" y="50" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#102a43">HOW THE WAR EFFORT WAS ORGANISED</text><g font-family="Arial" text-anchor="middle"><rect x="350" y="85" width="400" height="70" rx="14" fill="#102a43"/><text x="550" y="128" font-size="24" font-weight="700" fill="#fff">Provisional Government</text><path d="M550 155 V185 H180 V215 M550 185 V215 M550 185 H920 V215" stroke="#486581" stroke-width="4" fill="none"/><rect x="35" y="215" width="290" height="105" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180" y="254" font-size="22" font-weight="700" fill="#102a43">11 Sectors</text><text x="180" y="285" font-size="17" fill="#102a43">Regional command &amp; coordination</text><rect x="405" y="215" width="290" height="105" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="550" y="254" font-size="22" font-weight="700" fill="#102a43">Mukti Bahini</text><text x="550" y="285" font-size="17" fill="#102a43">Guerrilla &amp; regular operations</text><rect x="775" y="215" width="290" height="105" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="920" y="254" font-size="22" font-weight="700" fill="#102a43">People &amp; support</text><text x="920" y="285" font-size="17" fill="#102a43">Shelter, intelligence, logistics</text><path d="M180 320 V355 H550 M550 320 V355 M920 320 V355 H550 V375" stroke="#486581" stroke-width="4" fill="none"/><rect x="250" y="375" width="600" height="72" rx="14" fill="#7f1d1d"/><text x="550" y="420" font-size="24" font-weight="700" fill="#fff">Coordinated resistance + allied operations → Victory</text></g></svg>