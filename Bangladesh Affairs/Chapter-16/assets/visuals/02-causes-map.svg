<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">Causes of the Liberation War</title><desc id="d">Political, economic, cultural and democratic causes converging in 1971.</desc><rect width="1000" height="650" rx="22" fill="#f8fafc"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#102a43">MULTIPLE CAUSES · ONE NATIONAL STRUGGLE</text><g font-family="Arial" fill="#102a43"><rect x="70" y="115" width="380" height="145" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="260" y="155" text-anchor="middle" font-size="23" font-weight="700">Cultural & linguistic</text><text x="260" y="194" text-anchor="middle" font-size="18">Language rights · Bengali identity</text><text x="260" y="223" text-anchor="middle" font-size="18">Cultural recognition</text><rect x="550" y="115" width="380" height="145" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="740" y="155" text-anchor="middle" font-size="23" font-weight="700">Political</text><text x="740" y="194" text-anchor="middle" font-size="18">Unequal representation</text><text x="740" y="223" text-anchor="middle" font-size="18">Power-transfer crisis</text><rect x="70" y="300" width="380" height="145" rx="18" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="260" y="340" text-anchor="middle" font-size="23" font-weight="700">Economic & administrative</text><text x="260" y="379" text-anchor="middle" font-size="18">Regional disparities</text><text x="260" y="408" text-anchor="middle" font-size="18">Autonomy demands</text><rect x="550" y="300" width="380" height="145" rx="18" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="740" y="340" text-anchor="middle" font-size="23" font-weight="700">Democratic</text><text x="740" y="379" text-anchor="middle" font-size="18">1970 electoral mandate</text><text x="740" y="408" text-anchor="middle" font-size="18">Refusal to transfer power</text><path d="M260 260 V280 H500 V470 M740 260 V280 H500 M260 445 V460 H500 M740 445 V460 H500" stroke="#486581" stroke-width="4" fill="none"/><path d="M488 455 L500 475 L512 455" fill="none" stroke="#486581" stroke-width="4"/><rect x="200" y="485" width="600" height="95" rx="18" fill="#102a43"/><text x="500" y="523" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">MARCH 1971: CRISIS & REPRESSION</text><text x="500" y="553" text-anchor="middle" font-size="19" fill="#fff">Organised resistance → Liberation War</text><text x="500" y="620" text-anchor="middle" font-size="16" fill="#486581">Avoid single-cause explanations: the causes reinforced one another.</text></g></svg>