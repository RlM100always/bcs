<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">Liberation War timeline</title><desc id="d">Major milestones from 1947 to 1971.</desc><rect width="1200" height="440" rx="24" fill="#f8fafc"/><text x="60" y="58" font-size="30" font-weight="700" fill="#102a43">FROM PARTITION TO INDEPENDENCE · 1947–1971</text><line x1="90" y1="220" x2="1110" y2="220" stroke="#486581" stroke-width="5"/><g font-family="Arial,sans-serif" fill="#102a43" text-anchor="middle"><g><circle cx="110" cy="220" r="12" fill="#c2410c"/><text x="110" y="150" font-size="24" font-weight="700">1947</text><text x="110" y="178" font-size="17">Pakistan formed</text><text x="110" y="268" font-size="16">State-structure</text><text x="110" y="291" font-size="16">tensions</text></g><g><circle cx="300" cy="220" r="12" fill="#c2410c"/><text x="300" y="265" font-size="24" font-weight="700">1952</text><text x="300" y="294" font-size="17">Language Movement</text><text x="300" y="150" font-size="16">Linguistic dignity</text><text x="300" y="173" font-size="16">and identity</text></g><g><circle cx="490" cy="220" r="12" fill="#c2410c"/><text x="490" y="150" font-size="24" font-weight="700">1966</text><text x="490" y="178" font-size="17">Six-Point Programme</text><text x="490" y="268" font-size="16">Autonomy</text><text x="490" y="291" font-size="16">agenda</text></g><g><circle cx="680" cy="220" r="12" fill="#c2410c"/><text x="680" y="265" font-size="24" font-weight="700">1969</text><text x="680" y="294" font-size="17">Mass uprising</text><text x="680" y="150" font-size="16">Military rule</text><text x="680" y="173" font-size="16">challenged</text></g><g><circle cx="870" cy="220" r="12" fill="#c2410c"/><text x="870" y="150" font-size="24" font-weight="700">1970–Mar 1971</text><text x="870" y="178" font-size="17">Election & non-cooperation</text><text x="870" y="268" font-size="16">Mandate and</text><text x="870" y="291" font-size="16">power crisis</text></g><g><circle cx="1080" cy="220" r="12" fill="#c2410c"/><text x="1080" y="265" font-size="24" font-weight="700">1971</text><text x="1080" y="294" font-size="17">Liberation War</text><text x="1080" y="150" font-size="16">Victory</text><text x="1080" y="173" font-size="16">16 December</text></g></g><text x="60" y="390" font-family="Arial,sans-serif" font-size="17" fill="#486581">Exam logic: identity → autonomy → democratic mandate → repression → organised resistance → victory.</text></svg>