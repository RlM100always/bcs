<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">20 mark answer structure</title><desc id="d">Six-part structure for writing a BCS essay on the Liberation War.</desc><rect width="1000" height="420" rx="22" fill="#f8fafc"/><text x="500" y="50" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#102a43">BCS WRITTEN · 20-MARK ANSWER BLUEPRINT</text><g font-family="Arial" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="50" y="95" width="270" height="80" rx="12"/><rect x="365" y="95" width="270" height="80" rx="12"/><rect x="680" y="95" width="270" height="80" rx="12"/></g><g fill="#102a43" font-size="20" font-weight="700"><text x="185" y="128">1. Focused introduction</text><text x="500" y="128">2. Historical context</text><text x="815" y="128">3. Chronology / evidence</text></g><g fill="#dcfce7" stroke="#15803d" stroke-width="2"><rect x="50" y="220" width="270" height="80" rx="12"/><rect x="365" y="220" width="270" height="80" rx="12"/><rect x="680" y="220" width="270" height="80" rx="12"/></g><g fill="#102a43" font-size="20" font-weight="700"><text x="185" y="253">4. Analysis &amp; impact</text><text x="500" y="253">5. One relevant quotation</text><text x="815" y="253">6. Question-linked conclusion</text></g><path d="M185 175 V200 H815 V175 M500 175 V220" stroke="#486581" stroke-width="3" fill="none"/><text x="500" y="355" font-size="18" fill="#486581">Use a map, timeline or flowchart only when it adds evidence; cite source and date.</text><text x="500" y="385" font-size="17" fill="#486581">Avoid invented figures, repeated points, and decorative quotations.</text></g></svg>