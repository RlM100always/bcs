<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">Mujibnagar Government structure</title><desc id="d">Top-level roles in the provisional government and its key functions.</desc><rect width="1000" height="640" rx="22" fill="#f8fafc"/><text x="500" y="50" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#102a43">MUJIBNAGAR GOVERNMENT · 1971</text><g font-family="Arial" text-anchor="middle"><rect x="310" y="80" width="380" height="68" rx="14" fill="#102a43"/><text x="500" y="122" font-size="24" font-weight="700" fill="#fff">President: Sheikh Mujibur Rahman</text><path d="M500 148 V175 H250 V200 M500 175 H750 V200" fill="none" stroke="#486581" stroke-width="4"/><rect x="70" y="200" width="360" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250" y="235" font-size="22" font-weight="700" fill="#102a43">Acting President</text><text x="250" y="266" font-size="20" fill="#102a43">Syed Nazrul Islam</text><rect x="570" y="200" width="360" height="90" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="750" y="235" font-size="22" font-weight="700" fill="#102a43">Prime Minister</text><text x="750" y="266" font-size="20" fill="#102a43">Tajuddin Ahmad</text><path d="M750 290 V320 H500 V350 M250 290 V320 H500" fill="none" stroke="#486581" stroke-width="4"/><rect x="80" y="350" width="840" height="220" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="500" y="390" font-size="24" font-weight="700" fill="#102a43">Key ministerial portfolios &amp; state functions</text><g font-size="19" fill="#334e68"><text x="290" y="435">• Foreign affairs / law</text><text x="290" y="475">• Finance, trade &amp; industry</text><text x="290" y="515">• Home affairs, relief &amp; rehabilitation</text><text x="710" y="435">• Political legitimacy and administration</text><text x="710" y="475">• International diplomacy and publicity</text><text x="710" y="515">• War coordination and refugee support</text></g><text x="500" y="610" font-size="16" fill="#486581">Schematic for revision; use the Proclamation of Independence and official historical records for legal details.</text></g></svg>